name: Ash AutoFDE connector transaction

on:
  pull_request:
    branches: [main]
    paths:
      - "platform-console/services/ggen-marketplace/ggen-packs-src/ash-autofde-lab-connector-pack/scripts/**"
      - ".github/workflows/ash-autofde-connector-transaction.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ash-autofde-connector-transaction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transaction:
    name: Exact-head transactional connector deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'subject_sha=%s\n' "$actual"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install test runner
        run: python -m pip install "pytest==8.4.2"

      - name: Execute transaction regression court
        working-directory: platform-console/services/ggen-marketplace/ggen-packs-src/ash-autofde-lab-connector-pack
        run: python -m pytest scripts/test_deploy_connector_transactionally.py -vv

      - name: Replay existing connector failure guards
        working-directory: platform-console/services/ggen-marketplace/ggen-packs-src/ash-autofde-lab-connector-pack
        run: >-
          python -m pytest -vv
          scripts/test_add_connector_deploy_rollback.py
          scripts/test_add_connector_stale_copy.py
          scripts/test_add_connector_bridge_guard.py

name: Agent Lightning Replay Repair

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/ecosystem-runtime/src/agent_lightning_commercial_plane.rs"
      - "crates/ecosystem-runtime/tests/agent_lightning_commercial_integration.rs"
      - ".github/workflows/agent-lightning-replay-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Repair replay-before-budget ordering
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ecosystem-runtime/src/agent_lightning_commercial_plane.rs')
          text = path.read_text()

          old_state = '''struct ChargeState {
              organization: String,
              reserved: ChargeQuote,
          '''.replace('          ', '')
          new_state = '''struct ChargeState {
              organization: String,
              idempotency_key: String,
              reserved: ChargeQuote,
          '''.replace('          ', '')
          if old_state not in text:
              raise SystemExit('charge state shape changed')
          text = text.replace(old_state, new_state, 1)

          old_order = '''        let quote = self.rate_card.quote(&request.requested)?;
                  self.budget
                      .admit(quote.total_micros, self.exposure_micros())?;
                  let reservation = self.service.admit_job(&principal, request, authority)?;
                  if let Some(existing) = self.charges.get(&reservation.id) {
          '''.replace('          ', '')
          new_order = '''        let quote = self.rate_card.quote(&request.requested)?;
                  if let Some((reservation_id, existing)) = self
                      .charges
                      .iter()
                      .find(|(_, charge)| charge.idempotency_key == request.idempotency_key)
                  {
                      let reservation = self.service.admit_job(&principal, request, authority)?;
                      if &reservation.id != reservation_id
                          || existing.organization != organization
                          || existing.reserved != quote
                          || existing.target != *target
                      {
                          return Err(PlaneError::Refused("IDEMPOTENT_RUN_CONFLICT".into()));
                      }
                      return Ok(RunAdmission {
                          reservation,
                          quote: existing.reserved.clone(),
                          target: existing.target.clone(),
                          receipt_digest: existing.admission_receipt.clone(),
                      });
                  }
                  self.budget
                      .admit(quote.total_micros, self.exposure_micros())?;
                  let reservation = self.service.admit_job(&principal, request, authority)?;
                  if let Some(existing) = self.charges.get(&reservation.id) {
          '''.replace('          ', '')
          if old_order not in text:
              raise SystemExit('admit_run ordering changed')
          text = text.replace(old_order, new_order, 1)

          old_insert = '''            ChargeState {
                      organization: organization.into(),
                      reserved: quote.clone(),
          '''.replace('          ', '')
          new_insert = '''            ChargeState {
                      organization: organization.into(),
                      idempotency_key: request.idempotency_key.clone(),
                      reserved: quote.clone(),
          '''.replace('          ', '')
          if old_insert not in text:
              raise SystemExit('charge insertion shape changed')
          text = text.replace(old_insert, new_insert, 1)
          path.write_text(text)
          PY
          rustfmt --edition 2024 crates/ecosystem-runtime/src/agent_lightning_commercial_plane.rs
          rustfmt --edition 2024 crates/ecosystem-runtime/tests/agent_lightning_commercial_integration.rs
          git diff --check -- \
            crates/ecosystem-runtime/src/agent_lightning_commercial_plane.rs \
            crates/ecosystem-runtime/tests/agent_lightning_commercial_integration.rs
      - name: Verify replay boundary before publication
        run: |
          cargo check --locked -p ecosystem-runtime --bin agent-lightning-commercial
          cargo clippy --locked -p ecosystem-runtime --bin agent-lightning-commercial -- -D warnings
          cargo test --locked -p ecosystem-runtime --test agent_lightning_commercial_integration
      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/ecosystem-runtime/src/agent_lightning_commercial_plane.rs \
            crates/ecosystem-runtime/tests/agent_lightning_commercial_integration.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: preserve idempotent replay at budget boundary'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

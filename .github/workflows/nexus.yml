name: nexus

on:
  pull_request:
    paths:
      - catalog/nexus.toml
      - catalog/repositories.toml
      - west.yml
      - west/**
      - release/*/manifest.toml
      - scripts/nexus.py
      - tests/test_nexus.py
      - views/generated/nexus.md
      - .github/workflows/nexus.yml
  push:
    branches: [main]
    paths:
      - catalog/nexus.toml
      - catalog/repositories.toml
      - west.yml
      - west/**
      - release/*/manifest.toml
      - scripts/nexus.py
      - tests/test_nexus.py
      - views/generated/nexus.md
      - .github/workflows/nexus.yml

permissions:
  contents: read

jobs:
  nexus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install 'pyyaml>=6,<7'
      - name: Verify the Nexus against every registry
        run: python3 scripts/nexus.py verify
      - name: Verify the Nexus projection is current
        run: python3 scripts/nexus.py render --check
      - name: Nexus refusal tests
        run: python3 -m unittest tests.test_nexus -v

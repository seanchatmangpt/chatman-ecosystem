name: Platform Console Lock Repair Manufacture

on:
  pull_request:
    paths:
      - "platform-console/app/package.json"
      - "platform-console/app/package-lock.json"
      - ".github/workflows/lock-repair.yml"

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: true
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-console/app/package-lock.json
      - name: Manufacture lockfile
        working-directory: platform-console/app
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git add platform-console/app/package-lock.json
          if git diff --cached --quiet; then
            echo "lockfile already synchronized"
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "platform-console/app/package-lock.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: synchronize platform console lockfile"
          git push origin "HEAD:${{ github.head_ref }}"

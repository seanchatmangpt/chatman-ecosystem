name: Old-Estate RevOps DfCM Court

on:
  pull_request:
    branches: [main]
    paths:
      - apps/ecosystem-cli/src/bin/old-estate-revops.rs
      - docs/strategy/OLD_ESTATE_REVOPS_DFCM.md
      - .github/workflows/old-estate-revops.yml
      - crates/ecosystem-core/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-head:
    name: Exact-head planner admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          save-if: false
          shared-key: old-estate-revops-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Compile and execute embedded falsifiers
        run: cargo test --locked -p ecosystem-cli --bin old-estate-revops

      - name: Deny planner-local clippy warnings
        run: cargo clippy --locked -p ecosystem-cli --bin old-estate-revops -- -D warnings

      - name: Validate admitted old-estate manifest
        run: cargo run --locked --quiet -p ecosystem-cli --bin old-estate-revops -- check

      - name: Prove default plan refuses external authority
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p ecosystem-cli --bin old-estate-revops -- plan none > /tmp/plan-none.json
          python3 - <<'PY'
          import json
          plan = json.load(open('/tmp/plan-none.json'))
          assert plan['summary']['authority_refusals'] == 3, plan
          assert plan['summary']['broker_required'] == 0, plan
          assert all(
              item['do_standing'] != 'BRCE_REQUIRED'
              for item in plan['decisions']
          ), plan
          PY

      - name: Prove exact COMMUNICATE authority stops at BRCE
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p ecosystem-cli --bin old-estate-revops -- plan communicate > /tmp/plan-communicate.json
          python3 - <<'PY'
          import json
          plan = json.load(open('/tmp/plan-communicate.json'))
          by_repo = {item['repository']: item for item in plan['decisions']}
          assert by_repo['bcinr']['do_standing'] == 'BRCE_REQUIRED', by_repo['bcinr']
          assert by_repo['yawl']['do_standing'] == 'BRCE_REQUIRED', by_repo['yawl']
          assert by_repo['pyn8n']['do_standing'] == 'REFUSED:AUTHORITY', by_repo['pyn8n']
          assert plan['summary']['broker_required'] == 2, plan
          PY

      - name: Prove exact external-object authority does not imply communication
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p ecosystem-cli --bin old-estate-revops -- plan modify-external-object > /tmp/plan-modify.json
          python3 - <<'PY'
          import json
          plan = json.load(open('/tmp/plan-modify.json'))
          by_repo = {item['repository']: item for item in plan['decisions']}
          assert by_repo['pyn8n']['do_standing'] == 'BRCE_REQUIRED', by_repo['pyn8n']
          assert by_repo['bcinr']['do_standing'] == 'REFUSED:AUTHORITY', by_repo['bcinr']
          assert by_repo['yawl']['do_standing'] == 'REFUSED:AUTHORITY', by_repo['yawl']
          assert plan['summary']['broker_required'] == 1, plan
          PY

      - name: Seal and verify exact-subject BLAKE3 planning receipt
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p ecosystem-cli --bin old-estate-revops -- receipt "${CANDIDATE_SHA}" none > /tmp/receipt.json
          python3 - <<'PY'
          import json
          receipt = json.load(open('/tmp/receipt.json'))
          assert receipt['subject'].endswith('${{ env.CANDIDATE_SHA }}'), receipt
          assert receipt['authority'] == 'draft', receipt
          assert receipt['standing_before'] == 'OBSERVED', receipt
          assert receipt['standing_after'] == 'CANDIDATE', receipt
          assert receipt['digest'].startswith('blake3:'), receipt
          assert any('DO not executed' in item for item in receipt['executed']), receipt
          PY

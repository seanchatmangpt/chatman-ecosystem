name: Agent final convergence court

on:
  push:
    branches:
      - agent/finish-all-wip-20260815
    paths:
      - '.github/workflows/agent-final-convergence.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'apps/**'
      - 'crates/**'
      - 'release/v26.9.1/**'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  converge:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/finish-all-wip-20260815
          persist-credentials: true
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Refresh stale Cargo lock exactly once
        run: |
          cargo generate-lockfile
          if ! git diff --quiet -- Cargo.lock; then
            git diff --check -- Cargo.lock
            git config user.name 'chatman-ecosystem-bot'
            git config user.email '136349053+seanchatmangpt@users.noreply.github.com'
            git add Cargo.lock
            git commit -m 'chore(deps): refresh Cargo lock after bounded path deps'
            git push origin HEAD:agent/finish-all-wip-20260815
          fi
      - name: Install supply-chain courts
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf
        with:
          tool: cargo-deny,cargo-machete
      - name: Verify release constitutional law
        run: |
          python3 scripts/verify_release.py --check-refs
          python3 scripts/verify_standing_evidence.py --manifest release/v26.9.1/manifest.toml
          python3 scripts/verify_portfolio.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify Rust formatting and lint law
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Verify all Rust behavior
        run: cargo test --locked --workspace --all-features
      - name: Verify deterministic projections and architecture
        run: |
          cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- catalog validate
          cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- architecture check
          cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- projection check
          cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- receipt verify-all
      - name: Verify documentation
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Verify dependency license/source policy
        run: |
          cargo deny check
          cargo machete

name: Root Crown (v26.9.25)

# Autonomic loop (RFC-0004 §44/§45/§55): every run re-observes every pinned repository,
# recomputes RELEASE = C ∧ A ∧ R ∧ X ∧ F ∧ M from a cold checkout, and uploads a receipt
# hash-chained to the previous successful run's receipt (genesis when none exists).
# Observation/recompute/receipt carry no authority. The tag is RELEASE authority: it runs
# only after an ALIVE receipt, only at crown_sha, and only behind the operator-approved
# `release-crown` environment (BRCE gate; RFC §46 keeps publication authorities separate).
#
# Post-tag (release/v26.9.25/hardening/TAG-SUBJECT.json committed): the tag is immutable
# history. The crown runs in POST_TAG mode on every event (pull_request included): it
# replays the tag-named receipt from `git archive` of the recorded subject with the
# tag-time code (historical), attests HEAD with the post-tag tag binding (current), reads
# its chain parent from git (hardening/receipts/chain.json), and never tags. Exit 0 ALIVE,
# 3 typed BLOCKED, 2 REFUSED.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'release line vYY.M.D'
        required: false
        default: 'v26.9.25'
  push:
    branches: [main]
    paths:
      - 'release/v26.9.25/**'
      - 'scripts/release_train/root_crown/**'
      - 'scripts/durable_locator/**'
      - 'scripts/observe_release_heads.py'
      - 'scripts/release_train/scorecard/**'
      - 'scripts/observe_scorecard.py'
      - '.github/workflows/root-crown.yml'
  pull_request:
    paths:
      - 'release/v26.9.25/**'
      - 'scripts/release_train/root_crown/**'
      - 'scripts/observe_release_heads.py'
      - 'tests/release_train/root_crown/**'
      - 'scripts/durable_locator/**'
      - 'tests/durable_locator/**'
      - 'tests/test_observe_release_heads.py'
      - 'scripts/release_train/scorecard/**'
      - 'tests/release_train/scorecard/**'
      - 'scripts/observe_scorecard.py'
      - 'tests/test_observe_scorecard.py'
      - '.github/workflows/root-crown.yml'

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: root-crown-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  RELEASE: ${{ github.event.inputs.release || 'v26.9.25' }}

jobs:
  crown:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      standing: ${{ steps.crown.outputs.standing }}
      receipt_digest: ${{ steps.crown.outputs.receipt_digest }}
      crown_sha: ${{ steps.crown.outputs.crown_sha }}
      mode: ${{ steps.crown.outputs.mode }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.14'

      - name: Subject (mode)
        id: subject
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          # POST_TAG iff the tag record is committed. Materialize the RECORDED subject commit
          # (never whatever the tag points at now) and witness the tag-time CLI reproducing
          # the tag-named receipt digest from the committed historical inputs.
          set -euo pipefail
          record="release/$RELEASE/hardening/TAG-SUBJECT.json"
          mkdir -p .artifacts
          git rev-list HEAD > .artifacts/ancestry.txt
          if [ ! -f "$record" ]; then
            echo "record=false" >> "$GITHUB_OUTPUT"
            echo "PRE_TAG: no $record"
            exit 0
          fi
          field() { python3 -c 'import functools,json,sys;print(functools.reduce(lambda d,k:d[k],sys.argv[2:],json.load(open(sys.argv[1]))))' "$record" "$@"; }
          commit="$(field subject commit_sha)"
          digest="$(field tag_receipt receipt_digest)"
          hardening="$GITHUB_WORKSPACE/release/$RELEASE/hardening"
          obs="$hardening/$(field tag_receipt observations_path)"
          prev="$hardening/$(field tag_receipt previous_path)"
          git rev-parse -q --verify "refs/tags/$RELEASE" >/dev/null \
            || git fetch -q --no-tags origin "+refs/tags/$RELEASE:refs/tags/$RELEASE" \
            || echo "::warning::tag $RELEASE not fetchable; the crown records it unobserved"
          if git rev-parse -q --verify "refs/tags/$RELEASE" >/dev/null; then
            python3 - "$RELEASE" "$(git rev-parse "refs/tags/$RELEASE")" "$(git rev-parse "refs/tags/$RELEASE^{commit}")" \
              "$(git cat-file -t "refs/tags/$RELEASE")" > .artifacts/tag-observation.json <<'PY'
          import json, sys
          name, obj, commit, kind = sys.argv[1:5]
          print(json.dumps({"name": name, "sha": commit, "object_sha": obj, "object_type": kind, "source": "local-git"}))
          PY
          fi
          mkdir -p .artifacts/subject .artifacts/witness
          git archive "$commit" release scripts "docs/jira/$RELEASE" | tar -x -C .artifacts/subject
          (
            cd .artifacts/subject
            PYTHONPATH=. python3 -m scripts.release_train.root_crown --release "$RELEASE" --root . \
              --observations "$obs" --previous "$prev" --crown-sha "$commit" \
              --out "$GITHUB_WORKSPACE/.artifacts/witness/tag-time-receipt.json"
          ) > .artifacts/witness/tag-time-summary.json
          got="$(python3 -c 'import json;print(json.load(open(".artifacts/witness/tag-time-receipt.json"))["receipt_digest"])')"
          echo "tag-time CLI witness: replayed=$got recorded=$digest"
          test "$got" = "$digest"
          echo "record=true" >> "$GITHUB_OUTPUT"
          echo "subject_tree=$GITHUB_WORKSPACE/.artifacts/subject" >> "$GITHUB_OUTPUT"

      - name: Courts (root_crown, release_closure_court, invalidation_promotion, cross_product_court, scorecard)
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
          ROOT_CROWN_SUBJECT_TREE: ${{ steps.subject.outputs.subject_tree }}
        shell: bash
        run: |
          set -euo pipefail
          for suite in root_crown release_closure_court invalidation_promotion cross_product_court scorecard; do
            echo "::group::$suite"
            python3 -m unittest discover -s "tests/release_train/$suite" -p 'test_*.py' -v
            echo "::endgroup::"
          done
          python3 -m unittest discover -s tests -p 'test_observe_release_heads.py' -v
          python3 -m unittest discover -s tests -p 'test_observe_scorecard.py' -v

      - name: Mutation harness (--check-report; survivors must be 0)
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
        # In-process source + data mutants over a temp copy; exit 0 all killed, 1 survivor,
        # 2 ANCHOR_DRIFT / BASELINE_RED / MUTATION_REPORT_DRIFT. The committed report
        # (release/v26.9.25/hardening/inputs/mutation-report.json) must recompute byte-identically.
        run: python3 -m scripts.release_train.root_crown.mutate --check-report

      - name: Durable evidence locators (CE23-9; read-only git cat-file on this checkout)
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          # This checkout's object DB is the DB for seanchatmangpt/chatman-ecosystem locators
          # (fetch-depth 0 keeps E1 c599667a reachable); the other repos are absent here, so
          # completeness (which rescans them) is a local gate, not this job's.
          repos="${RUNNER_TEMP:-/tmp}/durable-locator-repos"
          mkdir -p "$repos" && ln -sfn "$GITHUB_WORKSPACE" "$repos/chatman-ecosystem"
          export DURABLE_LOCATOR_REPOS_ROOT="$repos"
          python3 -m unittest discover -s tests/durable_locator -p 'test_*.py' -v
          python3 scripts/durable_locator/durable_locator.py --no-network verify release/v26.9.25/hardening/evidence/INDEX.json
          python3 scripts/durable_locator/durable_locator.py requirements-locators --release v26.9.25 --check

      - name: Refuse ambient consequence surfaces in the court
        shell: bash
        run: |
          set -euo pipefail
          ! grep -REn \
            'requests\.(post|put|patch|delete)|httpx|urllib\.request\.(Request|urlopen)|subprocess\.|os\.system|socket\.|boto3|azure\.|google\.cloud|kubectl|terraform|git push|gh pr merge' \
            scripts/release_train/root_crown \
            tests/release_train/root_crown \
            scripts/release_train/scorecard \
            tests/release_train/scorecard

      - name: Cold reconstruction (projector --check on a clean runner)
        env:
          PYTHONPATH: .
        run: python3 -m scripts.release_train.root_crown.projector --release "$RELEASE" --check

      - name: Root manifest (verify_release)
        run: python3 scripts/verify_release.py --release "$RELEASE"

      - name: Hardening projection (--check; TAG-SUBJECT, chain, exact replay)
        if: steps.subject.outputs.record == 'true'
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python3 -m scripts.release_train.root_crown.hardening --release "$RELEASE" --check
          --subject-tree "${{ steps.subject.outputs.subject_tree }}"

      - name: Observe release heads (read-only GitHub API)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/observe_release_heads.py
          --release "$RELEASE" --cold --run-id "${{ github.run_id }}"
          --out .artifacts/observations.json

      - name: Previous receipt (PRE_TAG hash chain; genesis when none)
        # POST_TAG reads its parent from git (hardening/receipts/chain.json), never from
        # a 90-day Actions artifact.
        if: github.event_name != 'pull_request' && steps.subject.outputs.record != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .artifacts/prev
          prev="$(gh run list -R "$GITHUB_REPOSITORY" -w root-crown.yml -b main -s success -L 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)"
          if [ -n "$prev" ] && gh run download "$prev" -R "$GITHUB_REPOSITORY" -n root-crown-receipt -D .artifacts/prev 2>/dev/null; then
            echo "previous receipt from run $prev"
          else
            echo "genesis: no previous successful root-crown receipt"
          fi

      - name: Root crown
        id: crown
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          # GitHub/act run `shell: bash` as `bash -eo pipefail`: without +e a lawful typed
          # BLOCKED (exit 3) would abort the step before the receipt, outputs and summary exist.
          set +e -uo pipefail
          head="$(git rev-parse HEAD)"
          subject_args=()
          if [ -n "${{ steps.subject.outputs.subject_tree }}" ]; then
            subject_args=(--subject-tree "${{ steps.subject.outputs.subject_tree }}")
          fi
          python3 -m scripts.release_train.root_crown \
            --release "$RELEASE" \
            --mode auto \
            --observations .artifacts/observations.json \
            --previous .artifacts/prev/crown-receipt.json \
            --crown-sha "$head" \
            --head-sha "$head" \
            "${subject_args[@]}" \
            --hardening-dir "release/$RELEASE/hardening" \
            --tag-observation .artifacts/tag-observation.json \
            --ancestry .artifacts/ancestry.txt \
            --out .artifacts/receipt/crown-receipt.json \
            --tag-decision .artifacts/receipt/tag-decision.json
          code=$?
          set -e
          read_receipt() { python3 -c 'import json,sys;print(json.load(open(".artifacts/receipt/crown-receipt.json"))[sys.argv[1]])' "$1"; }
          standing="$(read_receipt standing)"
          digest="$(read_receipt receipt_digest)"
          mode="$(read_receipt mode)"
          if [ -f .artifacts/observations.json ]; then cp .artifacts/observations.json .artifacts/receipt/observations.json; fi
          if [ "$standing" != "ALIVE" ]; then cp .artifacts/receipt/tag-decision.json .artifacts/receipt/tag-illegal.json; fi
          echo "standing=$standing" >> "$GITHUB_OUTPUT"
          echo "receipt_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "crown_sha=$head" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "root crown mode=$mode standing=$standing exit=$code receipt=$digest"
          {
            echo "## Root crown $RELEASE @ $head ($mode): $standing"
            echo "receipt \`$digest\`"
            echo
            python3 - <<'PY'
          import json
          r = json.load(open(".artifacts/receipt/crown-receipt.json"))
          h = r.get("historical") or {}
          if h:
              print(f"historical: {h.get('standing')} {h.get('replay_standing')} ceiling={h.get('standing_ceiling')}")
              print()
          print("| term | state |\n|---|---|")
          for t, v in r["terms"].items():
              print(f"| {t} | {v['state']} |")
          print()
          for item in r["remaining"]:
              print(f"- {item['id']} {item['state']} {item['code']} ({item['failure_class']}/{item['broken_term']}): {item['detail'][:160]}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$code" > .artifacts/receipt/exit-code
          exit 0

      - name: Upload root-crown receipt
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (v7 sends mime_type, which the act artifact server refuses)
        with:
          name: root-crown-receipt
          path: .artifacts/receipt/
          retention-days: 90
          if-no-files-found: error

      - name: Exit policy (REFUSED fails; typed BLOCKED warns; ALIVE passes)
        shell: bash
        run: |
          set -euo pipefail
          code="$(cat .artifacts/receipt/exit-code)"
          case "$code" in
            0) echo "ALIVE" ;;
            3) echo "::warning title=root crown BLOCKED::typed blockers remain (see receipt); loop continues" ;;
            *) echo "::error title=root crown REFUSED::exit $code"; exit 1 ;;
          esac

      - name: Post-tag guard (the tag is immutable)
        if: steps.subject.outputs.record == 'true'
        shell: bash
        run: |
          set -euo pipefail
          record="release/$RELEASE/hardening/TAG-SUBJECT.json"
          want_obj="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["tag"]["object_sha"])' "$record")"
          want_commit="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["subject"]["commit_sha"])' "$record")"
          test "$(git rev-parse "refs/tags/$RELEASE")" = "$want_obj"
          test "$(git rev-parse "refs/tags/$RELEASE^{commit}")" = "$want_commit"
          echo "tag $RELEASE = $want_obj -> $want_commit (recorded, unchanged)"

  tag:
    needs: crown
    if: needs.crown.outputs.mode == 'PRE_TAG' && needs.crown.outputs.standing == 'ALIVE' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: release-crown
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout crown SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.crown.outputs.crown_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.14'

      - name: Download receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: root-crown-receipt
          path: .artifacts/receipt

      - name: Verify receipt, crown SHA and tag absence, then tag (RFC §45)
        env:
          PYTHONPATH: .
          CROWN_SHA: ${{ needs.crown.outputs.crown_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CROWN_SHA"
          existing="$(git ls-remote --tags origin "refs/tags/$RELEASE^{}" | cut -f1)"
          [ -n "$existing" ] || existing="$(git ls-remote --tags origin "refs/tags/$RELEASE" | cut -f1)"
          python3 - "$CROWN_SHA" "$existing" <<'PY'
          import json, sys
          from scripts.release_train.root_crown.tag import tag_decision
          receipt = json.load(open(".artifacts/receipt/crown-receipt.json"))
          decision = tag_decision(receipt, sys.argv[1], sys.argv[2] or None, "v26.9.25")
          print(json.dumps(decision, indent=2))
          assert decision["decision"] == "LEGAL", decision["reasons"]
          PY
          if [ "$existing" = "$CROWN_SHA" ]; then echo "tag already at crown SHA"; exit 0; fi
          digest="${{ needs.crown.outputs.receipt_digest }}"
          git config user.name "root-crown"
          git config user.email "root-crown@users.noreply.github.com"
          git tag -a "$RELEASE" "$CROWN_SHA" -m "crown receipt $digest; approval run ${{ github.run_id }}"
          git push origin "refs/tags/$RELEASE"
          test "$(git ls-remote --tags origin "refs/tags/$RELEASE^{}" | cut -f1)" = "$CROWN_SHA"

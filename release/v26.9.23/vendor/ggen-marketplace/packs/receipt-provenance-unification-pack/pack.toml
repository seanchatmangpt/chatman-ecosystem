[pack]
name = "receipt-provenance-unification-pack"
version = "0.1.0"
description = """
One schema for the five receipt contracts currently hand-maintained in five separate, non-communicating places across the gym ecosystem: ggen-ecosystem's ecosystem-sync/v2 (a 200-line python3 block embedded in scripts/verify-receipt.sh, whose field contract is ALSO restated as a markdown table in docs/RECEIPT-SCHEMA.md), ggen-ecosystem's ecosystem-bootstrap/v1 (a receipt shape on disk with NO validator), gym-ecosystem's gym-autonomic-crown/v2 (artifacts/autonomic-crown.json, emitted by scripts/crown-submodules.py, NO validator), autofde-lab's receipt.schema.json (chain-digest verification only, no field-shape checks), and autofde-lab's chatman-clean-session-receipt.schema.json (JSON Schema, NO executable validator). Every individual carries rp:sourceFile/rp:sourceLine citations to the real file it was transcribed from. Reuses prov:/dcterms:/dcat:/skos:/dqv:; mints rp: only for dottedPath/valueForm/reasonDelimiter/contractKey, which no public vocabulary covers.

Generates (1) generated/unified_receipt_validator.py -- one validator covering all six contracts (stdlib json/re/sys/subprocess only), with dotted-path resolution including `submodules[].current`-style array mapping, (2) generated/receipt_contract_matrix.json -- a machine-consumable census, (3) generated/gate_report.json, and (4) generated/qualification_runner.py -- the Chicago-style qualification of the validator against the real fixtures under qualification/.

v26.9.23 (lane MP-RPV; PRD 28, CE23-3, CE23-9): adds contract dfcm_fleet_v1 (https://chatmangpt.com/schema/receipt/v1, transcribed line by line from /Users/sac/.claude/dfcm/receipt.schema.json sha256 c19451fa...). Its default profile reproduces the exit code of ~/.claude/dfcm/validate_receipt.py (which needs ~/.claude and the third-party jsonschema package, so it cannot run on a stock CI runner) on every current xaas/ggen_igniter v26.9.23 receipt and on 29 mutants of xaas GC23-4.json. The opt-in `--require-durable [--repo-map owner/repo=path ...]` profile closes the dead identity check (validate_receipt.py:20-25 probes subject_sha only when identity.repo is a local directory, and since V23-S it is the GitHub slug): identity.repo must be a mapped owner/repo slug whose repository holds identity.subject_sha (R_missing_identity), and replay.durable_location must be git-notes:refs/notes/<ref>@<sha>, git:<owner/repo>@<sha>:<path> (blob present, subject_sha equal to <sha> or its ancestor) or an https URL (form only), never an absolute local path (R_missing_replay). Generator vocabulary added: array forms (rp:minItems, rp:itemJsonType, rp:itemPattern), rp:minLength, rp:admitsIntegralFloat, rp:nullable, conditional requirement (rp:requiredWhenPath/Pattern), rp:ImplicationRule, per-binding rp:brokenTerm, rp:Profile, and rp:ResolutionKind read-only git probes (subject_commit, notes_object, blob_at_commit, ancestor_of). With no flag every verdict of the five earlier contracts is unchanged. No chatman_root_v1 contract: chatman crates/ecosystem-core Receipt::verify owns that one.

Historical (2026-09-06, ggen 26.8.28, before dfcm_fleet_v1): `ggen sync run` writes both files (graph_hash 8737195c..., closure recorded); second run reports `skipped: unchanged: content identical` for the matrix. The generated validator reaches 4/4 exit-code parity with the REAL hand-written scripts/verify-receipt.sh across valid / bad-sha1 / missing-mandatory-field / placeholder-under-ALIVE fixtures, and returns VALID on the two real receipts on disk (artifacts/autonomic-crown.json, 13 submodule elements checked per-element; receipts/bootstrap-ggen-ecosystem-sync.json) -- neither of which has any validator today. Falsified, not just asserted: mutating one submodule SHA to 'NOTASHA' and one default_ref from refs/heads/main to 'main' both produce exit 1 with the exact failing value-form and its source file.

Measured divergence recorded as a dqv:Consistency annotation, not an opinion: the SAME standing token is mutually invalid across the two repos. `REFUSED[MARKETPLACE_IDENTITY_MISMATCH]` passes verify-receipt.sh (exit 0) and fails clean_session (exit 1); `REFUSED:MARKETPLACE_IDENTITY_MISMATCH` fails verify-receipt.sh (exit 1) and passes clean_session (exit 0) -- a perfect XOR, so no receipt can express a typed refusal that both repos accept.

Authority boundary (see PROVENANCE.md, gates/01_no_actuation.rq, gates/05_probes_read_only.rq): read-only predicate + read-only git probes (git cat-file -e, git merge-base --is-ancestor, git notes --ref=R list) + data census. Writes nothing, admits nothing; consequential DO stays behind GymAct/BRCE. NOT claimed: subsumption of receipt_store.verify_chain's chain-link re-derivation (an algorithm over an ordered ledger, out of field-shape scope), verify-receipt.sh parity beyond the 4 exercised fixtures, validate_receipt.py parity beyond the receipts and fixtures exercised by the MP-RPV gate and generated/qualification_runner.py, any network probe of an https location, or any adoption -- this pack is purely additive and modifies no existing pack, script, schema, or receipt.
"""

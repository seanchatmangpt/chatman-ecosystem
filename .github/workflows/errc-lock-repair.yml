name: ERRC Lock Repair

on:
  push:
    branches:
      - errc/production-innovations-20260912
    paths:
      - ".github/workflows/errc-lock-repair.yml"

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: errc/production-innovations-20260912
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Manufacture canonical Cargo.lock
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --check
          git diff --exit-code -- Cargo.toml crates/ecosystem-errc || {
            echo "REFUSED: lock repair mutated source" >&2
            exit 1
          }
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(errc): regenerate workspace lockfile"
          git push origin HEAD:errc/production-innovations-20260912

name: Crown Admission

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: crown-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fast:
    name: Fast constitutional gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.80.1
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: crown-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo run --quiet -p ecosystem-cli --bin ecosystem -- catalog validate
      - run: cargo run --quiet -p ecosystem-cli --bin ecosystem -- architecture check
      - run: cargo run --quiet -p ecosystem-cli --bin ecosystem -- projection check

  test:
    name: Full behavior and negative fixtures
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.80.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: crown-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --workspace --all-features
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
      - run: cargo run --quiet -p ecosystem-cli --bin ecosystem -- storage verify
      - run: cargo run --quiet -p ecosystem-cli --bin ecosystem -- receipt verify-all
      - name: Build exact-head candidate
        run: cargo build --release -p ecosystem-cli --bin ecosystem
      - name: Emit exact-head build manifest
        run: |
          set -euo pipefail
          mkdir -p target/crown
          cat > target/crown/build-manifest.json <<JSON
          {
            "source_sha": "${GITHUB_SHA}",
            "toolchain": "$(rustc --version)",
            "target": "$(rustc -vV | sed -n 's/^host: //p')",
            "cargo_lock_sha256": "$(sha256sum Cargo.lock | awk '{print $1}')",
            "binary_sha256": "$(sha256sum target/release/ecosystem | awk '{print $1}')"
          }
          JSON
          cat target/crown/build-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: crown-candidate-${{ github.sha }}
          path: |
            target/release/ecosystem
            target/crown/build-manifest.json
            target/crown/receipts/
          if-no-files-found: error

  cold-cache:
    name: Cold-cache correctness
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.80.1
      - run: ./scripts/cold-cache.sh

  github-read:
    name: Exact-head GitHub connector smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read repository and exact head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo_json="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${REPOSITORY}")"
          test "$(jq -r '.full_name' <<<"${repo_json}")" = "${REPOSITORY}"
          commit_json="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${REPOSITORY}/commits/${EXPECTED_SHA}")"
          test "$(jq -r '.sha' <<<"${commit_json}")" = "${EXPECTED_SHA}"

  crown:
    name: CHATMAN ECOSYSTEM CROWN
    runs-on: ubuntu-latest
    needs: [test, cold-cache, github-read]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.80.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          shared-key: crown-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo run --quiet -p ecosystem-cli --bin ecosystem -- crown --json | tee crown-report.json
      - run: cargo run --quiet -p ecosystem-cli --bin ecosystem -- crown --verify
      - uses: actions/upload-artifact@v4
        with:
          name: crown-report-${{ github.sha }}
          path: crown-report.json
          if-no-files-found: error

[[toolchain.components]]
id = "affidavit"
repository = "seanchatmangpt/affidavit"
ref = "feat/ecosystem-standing-receipts-20260812"
sha = "5dc78f113e60ba95a4b4594a6da3511334e86024"
role = "provenance"

[calculus]
canonical_semantics = "admitted_graph"
select_path = "candidate_graph"
construct_path = "ggen"
do_path = "BRCE"
ambient_do = false
hooks_actuate = false
planner_actuate = false
receipt_required = true
replay_required = true
exact_subject_required = true

[coverage]
ontology_sources = ["public", "custom"]
projection_classes = [
  "application-source",
  "api",
  "cli",
  "mcp",
  "a2a",
  "ui",
  "data-schema",
  "database",
  "infrastructure",
  "policy",
  "tests",
  "documentation",
  "sbom",
  "receipt",
  "replay",
]
substrates = [
  "local",
  "kubernetes",
  "aws",
  "azure",
  "gcp",
  "wasm-edge",
  "airgap",
]
negative_controls = [
  "ambient-do-refused",
  "direct-mcp-mutation-refused",
  "unauthorized-actuation-refused",
  "projection-loss-recoverable",
  "stale-subject-refused",
]

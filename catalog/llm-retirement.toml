schema = "chateco.llm-retirement-map.v1"
subject = "SELF"
observed_at = "2026-09-25"

# The global LLM retirement map.
#
#   Claude Cloud = LLM Retirement Foundry.
#   A session's objective is not LOC or tasks; it is
#     max  delta(future work no longer requiring an LLM) / usage window.
#
# Each [[edge]] is one reachable production edge that today needs (or needed)
# open-ended LLM reasoning, generation, routing, verification, or planning.
# `retirement_state` is its own axis. It never substitutes for, or implies,
# component standing (UNKNOWN != ALIVE still holds).
#
#   LLMResidue(E) = #{edges not in MACHINE_VERIFIED or LLM_RETIRED}
#   LDR           = LLMResidue(E) / #E                        (drive -> 0)
#   IRR           = delta(closed edges) / delta(days)         (drive up)
#
# Discovering residue is progress: adding an edge raises LLMResidue honestly.
# Deleting an edge or moving one down the ladder without a regression_reason
# is refused by `verify_llm_retirement.py --baseline-ref`.
#
# Scores are integers 1..5. score_basis = "ESTIMATED" marks an opinion, not a
# measurement; the frontier output carries that label through.

[ladder]
# Ordered; each state requires every evidence field of the states before it.
states = [
  "UNKNOWN",
  "LLM_ONLY",
  "FORMALIZATION_CANDIDATE",
  "MACHINE_CANDIDATE",
  "MACHINE_PARTIAL",
  "MACHINE_VERIFIED",
  "LLM_RETIRED",
]
closed = ["MACHINE_VERIFIED", "LLM_RETIRED"]

[ladder.requires]
FORMALIZATION_CANDIDATE = ["prior_art", "admitted_domain"]
MACHINE_CANDIDATE = ["machine", "smallest_falsifier"]
MACHINE_PARTIAL = ["falsifier_tests"]
MACHINE_VERIFIED = ["replay_evidence", "equivalence_corpus"]
LLM_RETIRED = ["fence", "receipt"]

[ladder.path_fields]
# Evidence fields that must name files present at the exact subject.
fields = [
  "machine",
  "falsifier_tests",
  "replay_evidence",
  "equivalence_corpus",
  "fence",
  "receipt",
]

# Residue class -> retirement mechanism. Only the residual
# ExistingMachinery |/= RequiredSemantics routes to another LLM.
[mechanisms]
repeated-generation = "ggen"
repeated-classification = "ontology+SPARQL/Datalog"
repeated-planning = "HDDL/PDDL/FOND"
constraint-decision = "SAT/SMT/CP"
state-concurrency-reasoning = "TLA+"
process-reasoning = "OCEL+conformance"
recurring-statistical-decision = "SPC"
optimization = "OR"
semantic-validation = "SHACL"
proof-obligation = "Lean"
repeated-workflow = "deterministic-automation"
cross-repo-recipe = "ggen-marketplace"
runtime-actuation = "BRCE"
evidence-judgment = "affidavit/GALL"
repeated-routing = "deterministic-selection"
semantic-unknown = "LLM"

[refusals]
terminal = [
  "EVIDENCE_PATH_MISSING",
  "STATE_EVIDENCE_INSUFFICIENT",
  "LLM_MECHANISM_CLOSED",
  "TERMINAL_RESIDUAL_ADVANCED",
  "SELF_EVIDENCE",
  "LADDER_REGRESSION",
  "EDGE_DELETED",
]

[[edge]]
id = "edge:session-work-selection"
title = "Choose the next unit of work for a Claude Cloud session"
residue_class = "repeated-routing"
mechanism = "deterministic-selection"
owner = "repository:chatman-ecosystem"
retirement_state = "MACHINE_PARTIAL"
frequency = 5
llm_cost = 4
reuse = 5
formalizability = 4
score_basis = "ESTIMATED"
prior_art = ["WSJF (cost of delay / job size)", "weighted shortest processing time", "RICE scoring"]
admitted_domain = "edges declared in catalog/llm-retirement.toml that are neither closed, blocked, nor terminal residual"
machine = ["scripts/verify_llm_retirement.py"]
smallest_falsifier = "a closed, blocked, or terminal-residual edge appears in --frontier output, or two runs over the same map disagree"
falsifier_tests = ["tests/test_llm_retirement.py"]
notes = "Selection is deterministic (argmax frequency*llm_cost*reuse*formalizability, id tiebreak). Scores are still LLM-estimated, so the edge is PARTIAL until scores are measured from telemetry."

[[edge]]
id = "edge:ce23-prose-extraction"
title = "Extract candidate propositions from operator prose (sjira extract step)"
residue_class = "repeated-classification"
mechanism = "ontology+SPARQL/Datalog"
owner = "repository:chatman-ecosystem"
retirement_state = "FORMALIZATION_CANDIDATE"
frequency = 4
llm_cost = 5
reuse = 5
formalizability = 3
score_basis = "ESTIMATED"
prior_art = ["Attempto Controlled English", "SHACL shape-directed extraction", "frozen xaas prose_spans.py check"]
admitted_domain = "CE-series operator prose units compiled by release/v26.9.23/sjira (gates, required_by, boundary_class)"
equivalence_corpus = [
  "release/v26.9.23/sjira/candidates/raw/chatman-ce23.extract.json",
  "release/v26.9.23/sjira/candidates/raw/chatman-ce23-12-bench.extract.json",
  "release/v26.9.23/sjira/candidates/raw/chatman-ce23-12-standings.extract.json",
  "release/v26.9.23/sjira/candidates/corrections.json",
]
notes = "README names this 'the one LLM edge'. The 24 recorded corrections are a measured LLM error set on required_by/boundary_class and are the first falsifier corpus for a machine extractor."

[[edge]]
id = "edge:handwritten-product-surface"

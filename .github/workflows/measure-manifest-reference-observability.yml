name: MEASURE Manifest Reference Observability MSA

on:
  pull_request:
    paths:
      - scripts/measure_train/manifest_reference_observability_msa/**
      - tests/measure_train/manifest_reference_observability_msa/**
      - .github/workflows/measure-manifest-reference-observability.yml

permissions:
  contents: read

jobs:
  manifest-reference-observability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR subject
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile manifest reference observability MSA
        run: python3 -m py_compile scripts/measure_train/manifest_reference_observability_msa/*.py tests/measure_train/manifest_reference_observability_msa/*.py
      - name: Run permanent manifest reference observability court
        run: python3 -m unittest discover -s tests/measure_train/manifest_reference_observability_msa -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|urllib\.request\.(Request|urlopen)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' scripts/measure_train/manifest_reference_observability_msa tests/measure_train/manifest_reference_observability_msa

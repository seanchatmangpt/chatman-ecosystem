name: Calibrated Composition Crown Exact Head
on:
  pull_request:
    paths:
      - 'scripts/release_train/calibrated_composition_crown/**'
      - 'tests/release_train/calibrated_composition_crown/**'
      - '.github/workflows/calibrated-composition-crown-exact-head.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile
        run: python3 -m compileall -q scripts/release_train/calibrated_composition_crown tests/release_train/calibrated_composition_crown
      - name: Permanent courts
        run: PYTHONPATH=. python3 -m unittest discover -s tests/release_train/calibrated_composition_crown -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: "! grep -REn '^\\s*(import|from)\\s+(requests|httpx|boto3|azure|google\\.cloud|socket|subprocess)|requests\\.(post|put|patch|delete)|subprocess\\.|os\\.system' scripts/release_train/calibrated_composition_crown"

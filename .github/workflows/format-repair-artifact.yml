name: Format Repair Artifact

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format-repair-artifact:
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact candidate identity
        run: test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Format workspace
        run: cargo fmt

      - name: Verify formatter fixed the crown boundary
        run: cargo fmt --check

      - name: Upload exact formatted sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-rustfmt-repair
          if-no-files-found: error
          path: |
            apps/ecosystem-cli/src/deploy.rs
            crates/ecosystem-runtime/src/commerce.rs
            crates/ecosystem-runtime/src/bin/marketplace-commerce.rs

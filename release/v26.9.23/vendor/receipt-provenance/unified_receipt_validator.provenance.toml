# Provenance of release/v26.9.23/vendor/receipt-provenance/unified_receipt_validator.py: a byte-for-byte copy
# (never edited) of the generated validator of ggen-marketplace receipt-provenance-unification-pack
# (MP-RPV: dfcm_fleet_v1 contract + durable profile), taken with
#   git -C <ggen-marketplace> show <commit>:<path> > release/v26.9.23/vendor/receipt-provenance/unified_receipt_validator.py
# It lives under vendor/, not courts/: its generated contract table cites source files by absolute
# path (data, never read at run time). The CE23-9 root court (member imported-receipts) refuses the copy unless its sha256 equals `sha256`
# below and, when the canonical marketplace checkout is present (CE23_MARKETPLACE_REPO, default
# ~/ggen-marketplace), the blob at `commit`:`path` has the same sha256 and `commit` is on
# origin/`ref` (published). A file copy, not a VENDOR.toml [[pack]] row: the CE23-1 court treats every
# vendored pack as a consumed release pack (its clause G2 runs each pack's bin/run-gates.py on
# release.ttl), and this pack is not consumed by ggen.toml. To move it: re-run the git show at the
# new commit and update commit, blob and sha256; the file is regenerated only in ggen-marketplace.

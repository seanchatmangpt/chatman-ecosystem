schema = "chatman.capability-catalog.v1"
version = "26.9.1"
subject = "SELF"

[[capability]]
id = "capability:admit-planner-policy-role-separation"
title = "Admit Planner, Policy, Role, Agent and Authority separation"
class = "SELECT"
owner = "repository:autofde-lab"
required_authority = "classify"
broker_required = false
receipt_required = true
reversible = true
standing = "CANDIDATE"
inputs = ["planner identity", "policy parameters", "role", "agent identity", "authority grant"]
outputs = ["typed separation verdict", "refusal on conflation"]
depends_on = ["capability:admit-public-custom-ontology"]
interfaces = ["cli", "api", "mcp", "a2a"]
source_repositories = ["autofde-lab"]
refusals = ["REFUSED:PLANNER_AS_POLICY", "REFUSED:ROLE_AS_AUTHORITY", "REFUSED:AGENT_AS_AUTHORITY"]

[[capability]]
id = "capability:plan-decision-frontier"
title = "Construct the reversible decision frontier"
class = "SELECT"
owner = "repository:autofde-lab"
required_authority = "classify"
broker_required = false
receipt_required = true
reversible = true
standing = "CANDIDATE"
inputs = ["O*", "capability graph", "objectives", "constraints", "authority ceiling"]
outputs = ["dependency-closed reversible candidate frontier"]
depends_on = ["capability:admit-planner-policy-role-separation", "capability:enforce-authority-ceiling"]
interfaces = ["cli", "api", "mcp", "a2a"]
source_repositories = ["autofde-lab"]
refusals = ["REFUSED:PREMATURE_SELECTION", "REFUSED:UNBOUNDED_OPTION_GRAPH", "REFUSED:AUTHORITY_AS_PLANNER_OUTPUT"]

[[capability]]
id = "capability:falsify-candidate-plan"

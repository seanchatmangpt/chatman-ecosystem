# Minimal real centralized-log-aggregation backend, closing the gap
# confirmed live before writing this file: `kubectl get pods -n monitoring`
# showed kube-prometheus-stack only (Prometheus, Grafana, Alertmanager,
# kube-state-metrics, node-exporter) -- no Loki/ELK/log-aggregation backend
# anywhere in the cluster (`kubectl get pods -A | grep -iE "loki|elastic|fluent"`
# -> empty). Every hyperscaler PaaS ships one (AWS CloudWatch Logs, GCP
# Cloud Logging, Azure Log Analytics); this cluster had none. The existing
# /logs page (app/app/logs/page.tsx) is per-pod `kubectl logs` only -- no
# cross-pod/cross-namespace search. This manifest is the minimal real
# addition: a single Loki instance (monolithic/single-binary target,
# filesystem storage, no object-store dependency) plus a Promtail DaemonSet
# that tails every container log file on the node and ships it to Loki.
#
# Single-node colima profile: `kubectl top nodes` showed ~50% memory
# already in use, so Loki runs single-binary with filesystem storage
# (boltdb-shipper index + local chunks) rather than the production
# distributed-microservices + S3/GCS topology, matching the sizing
# reasoning k8s/jaeger-tracing.yaml documents for its own in-memory choice.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  local-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

    ruler:
      alertmanager_url: http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_query_series: 5000
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      retention_period: 168h
      allow_structured_metadata: false

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
      # Deliberately NOT istio-injected -- monitoring is not part of the
      # mesh (matches monitoring-grafana precedent in k8s/grafana-route.yaml).
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.1.1
          args:
            - -config.file=/etc/loki/local-config.yaml
            - -target=all
          ports:
            - name: http
              containerPort: 3100
            - name: grpc
              containerPort: 9096
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
    - name: grpc
      port: 9096
      targetPort: 9096
---
# --- Promtail: ships every container log file on every node into Loki ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: warn

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      # Two things verified live and worth recording, not assumed:
      #   1. No node-name field selector needed: this is a single-node colima
      #      cluster, so every pod is already on the only node promtail runs
      #      on -- a node selector was tried first via `-config.expand-env=true`
      #      + `${NODE_NAME}`, but that flag globally expands `$1`/`$2`/...
      #      too (Go's os.ExpandEnv treats bare `$1` the same as `${1}`), which
      #      silently zeroed every regex capture-group replacement below
      #      (/config's rendered __path__ showed the literal string
      #      "/var/log/pods/__//*.log", every $N group emptied). Dropped
      #      expand-env and the field selector entirely.
      #   2. `selectors: [{role: pod}]` (even with an empty field/label
      #      matcher) must be present under kubernetes_sd_configs, or this
      #      promtail (3.1.1) build's kubernetes SD informer never delivers
      #      its first target sync -- confirmed live: with the key omitted
      #      entirely, promtail_targets_active_total stayed 0 indefinitely
      #      (waited 2+ minutes, tried a fresh pod, tried triggering an
      #      unrelated pod watch event -- none of it unstuck it); adding the
      #      key back (with no field/label filter, i.e. select all pods)
      #      made targets active jump to 56 within the next 10s sync_period,
      #      every time, reproducibly.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            selectors:
              - role: pod
        pipeline_stages:
          - cri: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels:
              [
                __meta_kubernetes_namespace,
                __meta_kubernetes_pod_name,
                __meta_kubernetes_pod_uid,
                __meta_kubernetes_pod_container_name,
              ]
            separator: /
            regex: (.*)/(.*)/(.*)/(.*)
            target_label: __path__
            # ${1}_${2}_${3} (braced), not $1_$2_$3 -- Go's regexp.Expand reads
            # "$1_" as a single (nonexistent) group named "1_", silently
            # resolving to empty string and dropping the namespace/pod-name
            # segments. Verified live: without braces, every discovered
            # __path__ collapsed to just "/var/log/pods/<uid>/<container>/*.log".
            replacement: /var/log/pods/${1}_${2}_${3}/${4}/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      containers:
        - name: promtail
          image: grafana/promtail:3.1.1
          args:
            - -config.file=/etc/promtail/promtail.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: run
              mountPath: /run/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: run
          emptyDir: {}
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: containers
          hostPath:
            path: /var/lib/docker/containers

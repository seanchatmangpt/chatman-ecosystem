name: Promotion Admission Exact Head

on:
  pull_request:
    paths:
      - "scripts/release_train/promotion_admission/**"
      - "tests/release_train/promotion_admission/**"
      - ".github/workflows/promotion-admission-exact-head.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact subject
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile authored promotion admission surface
        run: python3 -m compileall -q scripts/release_train/promotion_admission tests/release_train/promotion_admission
      - name: Execute promotion admission falsifier and e2e court
        env:
          PYTHONPATH: .
        run: python3 -m unittest discover -s tests/release_train/promotion_admission -p 'test_*.py' -v
      - name: Refuse ambient actuation imports
        shell: bash
        run: |
          if grep -REn '(^|[[:space:]])(import|from)[[:space:]]+(requests|urllib|http\.client|socket|subprocess|boto3|azure|google\.cloud)' scripts/release_train/promotion_admission; then
            echo "REFUSED[AMBIENT_ACTUATION_IMPORT]"
            exit 1
          fi
          echo "NO_AMBIENT_ACTUATION_IMPORT=PASS"

name: Materialize v26.9.1 constitutional corpus

on:
  push:
    branches:
      - agent/v26.9.1-constitutional-thesis
    paths:
      - '.bootstrap/chunk-*.b64'
      - '.bootstrap/tail-*.b64'
      - '.github/workflows/materialize-docs.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reconstitute constitutional corpus
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/chunk-00.b64 \
            .bootstrap/chunk-01.b64 \
            .bootstrap/chunk-02.b64 \
            .bootstrap/tail-*.b64 \
            > /tmp/docs.tar.gz.b64
          test "$(wc -c < /tmp/docs.tar.gz.b64 | tr -d ' ')" -eq 39908
          base64 --decode /tmp/docs.tar.gz.b64 > /tmp/docs.tar.gz
          tar -tzf /tmp/docs.tar.gz >/tmp/archive.list
          test "$(grep -c '^docs/.*\.md$' /tmp/archive.list)" -eq 50
          tar -xzf /tmp/docs.tar.gz -C .

      - name: Validate full-length corpus
        shell: bash
        run: |
          set -euo pipefail
          count="$(find docs -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')"
          test "$count" -eq 50
          test -s README.md
          failures=0
          for file in docs/*.md; do
            words="$(wc -w < "$file" | tr -d ' ')"
            bytes="$(wc -c < "$file" | tr -d ' ')"
            if [ "$words" -lt 1000 ] || [ "$bytes" -lt 6000 ]; then
              echo "NOT FULL LENGTH: $file words=$words bytes=$bytes"
              failures=$((failures + 1))
            fi
            grep -q '```mermaid' "$file" || { echo "MISSING MERMAID: $file"; failures=$((failures + 1)); }
          done
          test "$failures" -eq 0
          grep -q 'Architecture.*FROZEN' README.md
          grep -q 'Mathematics.*FROZEN' README.md
          grep -q 'PARTIAL_ALIVE' README.md
          grep -R -q 'Candidate.*Admitted' docs
          grep -R -q 'Where is the receipt' docs
          grep -R -q 'Mandatory Factorization' docs
          grep -R -q 'Rediscovery' docs
          echo "Validated $count full-length constitutional documents."

      - name: Remove bootstrap transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/materialize-docs.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit materialized corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatman-ecosystem-bot'
          git config user.email '136349053+seanchatmangpt@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'materialize v26.9.1 constitutional thesis [skip ci]'
          git push origin HEAD:${{ github.ref_name }}

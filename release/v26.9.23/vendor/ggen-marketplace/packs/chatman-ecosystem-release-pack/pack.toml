[pack]
name = "chatman-ecosystem-release-pack"
version = "0.3.0"
description = "Reusable semantic law and projections for dependency-closed, exact-SHA ecosystem releases: component identity, dependency closure, required-role coverage, standing bounds, zero ambient DO authority, explicit external ref-observation evidence, and (0.2.0) a total legacy-role crosswalk: every required role of a lifted predecessor release (er:LegacyRelease) gets exactly one typed role boundary (REQUIRED, SUCCESSOR, BLOCKED, UNSUPPORTED, REFUSED) from the imported fleet classification, an explicit decision, or the no-court-reference successor rule, with fleet CriticalPath and court-executed repositories forced into the required set, constitutional role mappings, and generated release manifest, crosswalk and requirement projections, and (0.3.0) imported upstream checkpoint crowns: a stop-court receipt directory lifted to er:ImportedCrown facts is admitted only when STOP is ALIVE, the required number of distinct gates are ALIVE at the crown subject and against the paired subject, both SHAs equal the importing release's exact component commits, and LLM_INVOCATIONS_ON_KNOWN_REFERENCE_PATH and UNRECEIPTED_ACTUATION are present and 0, with a generated imported-crown projection. Exact release-instance facts remain consumer-owned."

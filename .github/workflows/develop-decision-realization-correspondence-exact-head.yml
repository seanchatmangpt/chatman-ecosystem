name: DEVELOP Decision Realization Correspondence Exact Head

on:
  pull_request:
    paths:
      - "scripts/develop_train/decision_realization_correspondence/**"
      - "tests/develop_train/decision_realization_correspondence/**"
      - ".github/workflows/develop-decision-realization-correspondence-exact-head.yml"

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile exact authored capsule
        run: python3 -m compileall -q scripts/develop_train/decision_realization_correspondence tests/develop_train/decision_realization_correspondence
      - name: Execute permanent and Chicago courts
        run: PYTHONPATH=. python3 -m unittest discover -s tests/develop_train/decision_realization_correspondence -p 'test_*.py' -v
      - name: Reject ambient consequential actuation
        run: "! grep -REn '^\\s*(import|from)\\s+(requests|httpx|boto3|azure|google\\.cloud|socket|subprocess)|requests\\.(post|put|patch|delete)|subprocess\\.|os\\.system' scripts/develop_train/decision_realization_correspondence tests/develop_train/decision_realization_correspondence"

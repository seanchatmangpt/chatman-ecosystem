name: v26.9.1 release control plane

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify manifest and live ref identity
        run: python3 scripts/verify_release.py --check-refs
      - name: Mutation and invariant tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Report crown standing without overclaiming
        run: python3 scripts/verify_release.py

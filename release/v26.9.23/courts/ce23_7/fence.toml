# CE23-7 version fence: the release-instance facts the court judges against.
# Read by release/v26.9.23/courts/ce23_7/court.py; hand-authored (HANDWRITTEN.md row).

[fence]
target = "v26.9.23"
predecessor = "v26.9.1"
# The subject before the fence (tools byte-identical to GitHub main c59596f5 for scripts/):
# the differential baseline materialized with `git show <base>:scripts/<tool>.py`.
base_commit = "aa4e3873b40c3406378800ca82facc366293b564"
# release/v26.9.1 stays byte-untouched: its git tree at the subject, and (outside a git
# checkout) sha256 over sorted "<sha256>  <path>" lines of its files minus __pycache__.
predecessor_tree = "7e0feef1b137bea72fe1cf22a599636f77b0e47c"
predecessor_files_sha256 = "27dbc487c10b004578f67f6cb2165818f3669f01cb9e027639fd7b8ea4ed037e"
# Floor for `python3 -m unittest discover -s tests`: 434 at base_commit + 24 in
# tests/test_release_line.py + 12 in tests/test_ce23_7_probe.py (the court probe itself).
unittest_floor = 470
# Token of the predecessor line in any spelling (26.9.1, 26_9_1, v26-9-1), not 26.9.10+.
token = '26[._-]9[._-]1(?![0-9])'
# A targeted run that opens a byte copy of a release/v26.9.1 file of at least this size,
# anywhere outside release/v26.9.23/, read the predecessor line (court audit(): a copy under
# another name is the same read). Smaller files (empty __init__.py-sized) carry no identity.
content_min_bytes = 64

# The fenced tools: no predecessor token, --release accepted, default = the catalog pointer,
# inputs resolved by scripts/release_line.py. The court exercises every one of them.
[[tool]]
id = "verify_release"
script = "scripts/verify_release.py"

[[tool]]
id = "plan_completion"
script = "scripts/plan_completion.py"

[[tool]]
id = "survey_portfolio"
script = "scripts/survey_portfolio.py"

[[tool]]
id = "verify_standing_evidence"
script = "scripts/verify_standing_evidence.py"

[[tool]]
id = "verify_west_workspace"
script = "scripts/verify_west_workspace.py"

[[tool]]
id = "release_line"
script = "scripts/release_line.py"

# Pinned v26.9.1 outputs, measured at base_commit and re-measured on the fenced tools.
# A pin applies only while its inputs hash to inputs_sha256 (sha256 over "<sha256>  <path>"
# lines in the listed order); otherwise the court falls back to the base_commit differential.

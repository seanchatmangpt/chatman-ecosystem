name: Construct Runtime Admission

on:
  pull_request:
    branches: [main]
    paths:
      - "catalog/construct-runtime.toml"
      - "scripts/verify_construct_runtime.py"
      - "tests/test_construct_runtime.py"
      - "docs/architecture/hyperdimensional-information-encryption.md"
      - ".github/workflows/construct-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Admit canonical profile
        run: python3 scripts/verify_construct_runtime.py

      - name: Exercise positive and negative fixtures
        run: python3 -m unittest tests.test_construct_runtime -v

      - name: Refuse widened query-text instruction channel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('catalog/construct-runtime.toml').read_text()
          text = text.replace('selector_transports_query_text = false', 'selector_transports_query_text = true')
          Path('/tmp/invalid-construct-runtime.toml').write_text(text)
          PY
          if python3 scripts/verify_construct_runtime.py /tmp/invalid-construct-runtime.toml; then
            echo 'negative fixture was incorrectly admitted' >&2
            exit 1
          fi

name: MEASURE Cross-Control Composition MSA

on:
  pull_request:
    paths:
      - 'scripts/measure_train/cross_control_msa/**'
      - 'tests/measure_train/cross_control_msa/**'
      - '.github/workflows/measure-cross-control-composition-msa.yml'

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile cross-control MSA
        run: python3 -m py_compile scripts/measure_train/cross_control_msa/*.py tests/measure_train/cross_control_msa/*.py
      - name: Execute cross-control MSA court
        run: PYTHONPATH=. python3 -m unittest discover -s tests/measure_train/cross_control_msa -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|urllib\.request\.(Request|urlopen)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' scripts/measure_train/cross_control_msa tests/measure_train/cross_control_msa

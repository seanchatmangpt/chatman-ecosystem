name: Realized Feedback Admission Exact Head
on:
  pull_request:
    paths:
      - 'scripts/release_train/feedback_policy_admission/**'
      - 'tests/release_train/feedback_policy_admission/**'
      - '.github/workflows/implement-realized-feedback-exact-head.yml'
permissions:
  contents: read
jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile realized feedback admission
        run: python3 -m compileall -q scripts/release_train/feedback_policy_admission tests/release_train/feedback_policy_admission
      - name: Execute permanent realized feedback court
        env:
          PYTHONPATH: .:tests/release_train/feedback_policy_admission
        run: python3 -m unittest discover -s tests/release_train/feedback_policy_admission -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|httpx|boto3|azure\.|google\.cloud|socket|subprocess|os\.system' scripts/release_train/feedback_policy_admission

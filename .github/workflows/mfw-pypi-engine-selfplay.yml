name: mfw-pypi-engine-selfplay

on:
  push:
    branches:
      - validation/mfw-pypi-planning-5e9b3c41
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_CAPSULE: validation/mfw-pypi-planning/mfw-pypi-planner.tar.gz
  MFW_HEAD_SHA: 5e9b3c41c1f4aa6de9522828716ffe41e70b760b
  VAL_COMMIT: 3c7a1f330bdab0ba28a4762bb45c3f06c27fb6d4
  FMAP_COMMIT: 89016e0debf808d30bd339e2a37db4deb2053c8d
  FMAP_TEST_BLOB: 8b0cfd1ae3d8f8697e0726fd89ca651ab7de4e1d

jobs:
  real-engine-selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install complete official PyPI federation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/capsule"
          tar -xzf "$PYTHON_CAPSULE" -C "$RUNNER_TEMP/capsule"
          python -m pip install --disable-pip-version-check "$RUNNER_TEMP/capsule[engines]"
      - name: Build pinned independent VAL validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison
          git clone --filter=blob:none https://github.com/KCL-Planning/VAL.git "$RUNNER_TEMP/VAL"
          git -C "$RUNNER_TEMP/VAL" checkout "$VAL_COMMIT"
          test "$(git -C "$RUNNER_TEMP/VAL" rev-parse HEAD)" = "$VAL_COMMIT"
          cmake -S "$RUNNER_TEMP/VAL" -B "$RUNNER_TEMP/VAL/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/VAL/build" --target Validate --parallel 2
          test -x "$RUNNER_TEMP/VAL/build/bin/Validate"
      - name: Execute and independently validate seven real PDDL planners
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/selfplay"
          python - \
            "$RUNNER_TEMP/capsule/tests/fixtures/domain.pddl" \
            "$RUNNER_TEMP/capsule/tests/fixtures/problem.pddl" \
            "$RUNNER_TEMP/VAL/build/bin/Validate" \
            "$RUNNER_TEMP/selfplay" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys
          import time

          domain, problem, validator, root = map(Path, sys.argv[1:])
          engines = [
              "pyperplan",
              "fast-downward",
              "enhsp",
              "lpg",
              "tamer",
              "symk",
              "aries",
          ]
          receipts = []
          for engine in engines:
              run = root / engine
              run.mkdir(parents=True)
              candidate = run / "candidate.plan"
              started = time.perf_counter_ns()
              solve = subprocess.run(
                  [
                      "mfw-pypi-planner", "solve",
                      "--domain", str(domain),
                      "--problem", str(problem),
                      "--plan", str(candidate),
                      "--engine", engine,
                      "--mode", "classical",
                      "--timeout", "60",
                  ],
                  text=True,
                  capture_output=True,
                  timeout=120,
              )
              solve_ms = (time.perf_counter_ns() - started) / 1_000_000
              (run / "solve.stdout.json").write_text(solve.stdout)
              (run / "solve.stderr.log").write_text(solve.stderr)
              assert solve.returncode == 0, {
                  "engine": engine,
                  "returncode": solve.returncode,
                  "stdout": solve.stdout,
                  "stderr": solve.stderr,
              }
              result = json.loads(solve.stdout)
              assert result["status"] == "found", result
              assert candidate.is_file() and candidate.stat().st_size > 0, result
              validation = subprocess.run(
                  [str(validator), "-v", "-t", "0.001", str(domain), str(problem), str(candidate)],
                  text=True,
                  capture_output=True,
                  timeout=60,
              )
              (run / "validator.stdout.log").write_text(validation.stdout)
              (run / "validator.stderr.log").write_text(validation.stderr)
              validation_text = (validation.stdout + "\n" + validation.stderr).lower()
              assert validation.returncode == 0, {
                  "engine": engine,
                  "returncode": validation.returncode,
                  "stdout": validation.stdout,
                  "stderr": validation.stderr,
              }
              assert "plan valid" in validation_text, {
                  "engine": engine,
                  "validator_output": validation_text,
              }
              receipt = {
                  "schema": "urn:chatman:mfw-real-engine-selfplay:v1",
                  "status": "ALIVE",
                  "mfw_head_sha": "5e9b3c41c1f4aa6de9522828716ffe41e70b760b",
                  "engine": engine,
                  "planner_status": result["planner_status"],
                  "solve_ms": solve_ms,
                  "step_count": result["step_count"],
                  "candidate_sha256": hashlib.sha256(candidate.read_bytes()).hexdigest(),
                  "validator": "KCL-Planning/VAL@3c7a1f330bdab0ba28a4762bb45c3f06c27fb6d4",
                  "validation_status": "valid",
              }
              (run / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
              receipts.append(receipt)
          aggregate = {
              "schema": "urn:chatman:mfw-real-engine-selfplay-aggregate:v1",
              "status": "ALIVE",
              "mfw_head_sha": "5e9b3c41c1f4aa6de9522828716ffe41e70b760b",
              "executed_engines": engines,
              "receipts": receipts,
          }
          (root / "receipt-aggregate.json").write_text(json.dumps(aggregate, indent=2, sort_keys=True) + "\n")
          print(json.dumps(aggregate, sort_keys=True))
          PY
      - name: Execute official FMAP multi-agent solver fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fmap"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/aiplan4eu/up-fmap/$FMAP_COMMIT/test/test_up_fmap.py" \
            --output "$RUNNER_TEMP/fmap/test_up_fmap.py"
          test "$(git hash-object "$RUNNER_TEMP/fmap/test_up_fmap.py")" = "$FMAP_TEST_BLOB"
          python "$RUNNER_TEMP/fmap/test_up_fmap.py" 2>&1 | tee "$RUNNER_TEMP/fmap/execution.log"
          grep -q "OK" "$RUNNER_TEMP/fmap/execution.log"
          python - "$RUNNER_TEMP/fmap/receipt-fmap.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          receipt = {
              "schema": "urn:chatman:mfw-fmap-multi-agent-selfplay:v1",
              "status": "ALIVE",
              "mfw_head_sha": "5e9b3c41c1f4aa6de9522828716ffe41e70b760b",
              "engine": "fmap",
              "distribution": "up-fmap",
              "fixture_repository": "aiplan4eu/up-fmap",
              "fixture_commit": "89016e0debf808d30bd339e2a37db4deb2053c8d",
              "fixture_blob": "8b0cfd1ae3d8f8697e0726fd89ca651ab7de4e1d",
              "planner_status": "SOLVED_SATISFICING",
          }
          Path(sys.argv[1]).write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Record installed graph and hashes
        shell: bash
        run: |
          set -euo pipefail
          mfw-pypi-planner catalog > "$RUNNER_TEMP/selfplay/catalog.json"
          python -m pip freeze > "$RUNNER_TEMP/selfplay/pip-freeze.txt"
          sha256sum "$RUNNER_TEMP/VAL/build/bin/Validate" > "$RUNNER_TEMP/selfplay/val-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: mfw-real-engine-selfplay-${{ github.sha }}
          path: |
            ${{ runner.temp }}/selfplay
            ${{ runner.temp }}/fmap
          if-no-files-found: error
          retention-days: 14

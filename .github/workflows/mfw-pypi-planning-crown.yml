name: mfw-pypi-planning-crown

on:
  push:
    branches:
      - validation/mfw-pypi-crown-18294174
  workflow_dispatch:

permissions:
  contents: read

env:
  CAPSULE: validation/mfw-pypi-crown/mfw-pypi-planner.tar.gz
  MANIFEST: validation/mfw-pypi-crown/manifest.json
  CAPSULE_SHA256: 9d5b8d59de97115f0396c3b9f096c524b8d91725934abb3132560bdbed37c0bb
  CAPSULE_GIT_BLOB_SHA1: 6d2fc41e854739670e848ec5a52915e764aaceb8
  MFW_HEAD_SHA: 18294174c2d1262821975c08f2843f4a6c29a80c
  MFW_TREE_SHA: e31e5d50028b0e2a26ac6a6b4dd466319315e22a
  VAL_COMMIT: 3c7a1f330bdab0ba28a4762bb45c3f06c27fb6d4
  FMAP_COMMIT: 89016e0debf808d30bd339e2a37db4deb2053c8d
  FMAP_TEST_BLOB: 8b0cfd1ae3d8f8697e0726fd89ca651ab7de4e1d
  SPIDERPLAN_COMMIT: 9b79fb4de0a858afebdb11162956557a3ffaa5e4
  SPIDERPLAN_TEST_BLOB: b5d0cd87fc8307b74e04f96912dc0b00b36991b5
  RUNNER_CRATE: validation/mfw-pypi-crown/mfw-runner-integration

jobs:
  capsule-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Admit exact current MFW capsule
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$CAPSULE" | awk '{print $1}')" = "$CAPSULE_SHA256"
          test "$(git hash-object "$CAPSULE")" = "$CAPSULE_GIT_BLOB_SHA1"
          mkdir -p "$RUNNER_TEMP/receipt" "$RUNNER_TEMP/capsule"
          tar -xzf "$CAPSULE" -C "$RUNNER_TEMP/capsule"
          python - "$MANIFEST" "$RUNNER_TEMP/receipt/receipt-capsule.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          manifest = json.loads(Path(sys.argv[1]).read_text())
          assert manifest["canonical_head_sha"] == os.environ["MFW_HEAD_SHA"]
          assert manifest["canonical_tree_sha"] == os.environ["MFW_TREE_SHA"]
          assert manifest["capsule_sha256"] == os.environ["CAPSULE_SHA256"]
          assert manifest["capsule_git_blob_sha1"] == os.environ["CAPSULE_GIT_BLOB_SHA1"]
          receipt = {
              "schema": "urn:chatman:mfw-capsule-integrity:v2",
              "status": "ALIVE",
              "mfw_head_sha": manifest["canonical_head_sha"],
              "mfw_tree_sha": manifest["canonical_tree_sha"],
              "capsule_sha256": manifest["capsule_sha256"],
              "capsule_git_blob_sha1": manifest["capsule_git_blob_sha1"],
              "capsule_size": manifest["capsule_size"],
              "canonical_path": manifest["canonical_path"],
          }
          Path(sys.argv[2]).write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
          test -f "$RUNNER_TEMP/capsule/src/mfw_pypi_planner/cli.py"
          test -f "$RUNNER_TEMP/capsule/tests/test_bridge.py"
      - uses: actions/upload-artifact@v4
        with:
          name: crown-capsule-${{ github.sha }}
          path: ${{ runner.temp }}/receipt
          if-no-files-found: error
          retention-days: 14

  python-federation:
    needs: capsule-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install current MFW package and all admitted PyPI families
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/capsule" "$RUNNER_TEMP/receipt"
          tar -xzf "$CAPSULE" -C "$RUNNER_TEMP/capsule"
          python -m pip install --disable-pip-version-check "$RUNNER_TEMP/capsule[engines]"
          python -m pip install --disable-pip-version-check "$RUNNER_TEMP/capsule[community]"
          python -m pip install --disable-pip-version-check "$RUNNER_TEMP/capsule[tamp]"
      - name: Execute compile, nine tests, clean CLI receipt, catalog, and wheel
        run: |
          python validation/mfw-pypi-crown/python_crown.py \
            "$RUNNER_TEMP/capsule" \
            "$RUNNER_TEMP/receipt"
          python -m pip freeze > "$RUNNER_TEMP/receipt/pip-freeze.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: crown-python-federation-${{ github.sha }}
          path: ${{ runner.temp }}/receipt
          if-no-files-found: error
          retention-days: 14

  pddl-selfplay:
    needs: capsule-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official PyPI planning federation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/capsule" "$RUNNER_TEMP/receipt"
          tar -xzf "$CAPSULE" -C "$RUNNER_TEMP/capsule"
          python -m pip install --disable-pip-version-check "$RUNNER_TEMP/capsule[engines]"
      - name: Build pinned independent VAL validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison
          git clone --filter=blob:none https://github.com/KCL-Planning/VAL.git "$RUNNER_TEMP/VAL"
          git -C "$RUNNER_TEMP/VAL" checkout "$VAL_COMMIT"
          test "$(git -C "$RUNNER_TEMP/VAL" rev-parse HEAD)" = "$VAL_COMMIT"
          cmake -S "$RUNNER_TEMP/VAL" -B "$RUNNER_TEMP/VAL/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/VAL/build" --target Validate --parallel 2
          test -x "$RUNNER_TEMP/VAL/build/bin/Validate"
          sha256sum "$RUNNER_TEMP/VAL/build/bin/Validate" > "$RUNNER_TEMP/receipt/val-sha256.txt"
      - name: Execute seven real planners and independent validation
        run: |
          python validation/mfw-pypi-crown/pddl_selfplay.py \
            "$RUNNER_TEMP/capsule" \
            "$RUNNER_TEMP/VAL/build/bin/Validate" \
            "$RUNNER_TEMP/receipt"
          python -m pip freeze > "$RUNNER_TEMP/receipt/pip-freeze.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: crown-pddl-selfplay-${{ github.sha }}
          path: ${{ runner.temp }}/receipt
          if-no-files-found: error
          retention-days: 14

  fmap-multi-agent:
    needs: capsule-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official federation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/capsule" "$RUNNER_TEMP/receipt"
          tar -xzf "$CAPSULE" -C "$RUNNER_TEMP/capsule"
          python -m pip install --disable-pip-version-check "$RUNNER_TEMP/capsule[engines]"
      - name: Execute pinned official FMAP multi-agent fixture
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/aiplan4eu/up-fmap.git "$RUNNER_TEMP/up-fmap"
          git -C "$RUNNER_TEMP/up-fmap" checkout "$FMAP_COMMIT"
          test "$(git -C "$RUNNER_TEMP/up-fmap" rev-parse HEAD)" = "$FMAP_COMMIT"
          test "$(git -C "$RUNNER_TEMP/up-fmap" hash-object test/test_up_fmap.py)" = "$FMAP_TEST_BLOB"
          (
            cd "$RUNNER_TEMP/up-fmap/test"
            python -m unittest test_up_fmap.FMAPtest.test_fmap -v
          ) 2>&1 | tee "$RUNNER_TEMP/receipt/fmap-execution.log"
          grep -q "OK" "$RUNNER_TEMP/receipt/fmap-execution.log"
          python - "$RUNNER_TEMP/receipt/receipt-fmap.json" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          log = Path(sys.argv[1]).with_name("fmap-execution.log")
          receipt = {
              "schema": "urn:chatman:mfw-fmap-multi-agent:v2",
              "status": "ALIVE",
              "mfw_head_sha": "18294174c2d1262821975c08f2843f4a6c29a80c",
              "mfw_tree_sha": "e31e5d50028b0e2a26ac6a6b4dd466319315e22a",
              "engine": "fmap",
              "distribution": "up-fmap",
              "fixture_repository": "aiplan4eu/up-fmap",
              "fixture_commit": "89016e0debf808d30bd339e2a37db4deb2053c8d",
              "fixture_blob": "8b0cfd1ae3d8f8697e0726fd89ca651ab7de4e1d",
              "test": "FMAPtest.test_fmap",
              "result": "OK",
              "execution_log_sha256": hashlib.sha256(log.read_bytes()).hexdigest(),
          }
          Path(sys.argv[1]).write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crown-fmap-${{ github.sha }}
          path: ${{ runner.temp }}/receipt
          if-no-files-found: error
          retention-days: 14

  spiderplan-docker:
    needs: capsule-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Admit Docker and docker-compose compatibility
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          if ! command -v docker-compose >/dev/null 2>&1; then
            sudo tee /usr/local/bin/docker-compose >/dev/null <<'SH'
          #!/usr/bin/env bash
          exec docker compose "$@"
          SH
            sudo chmod +x /usr/local/bin/docker-compose
          fi
          docker-compose version
      - name: Install and explicitly register Spiderplan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/capsule" "$RUNNER_TEMP/receipt"
          tar -xzf "$CAPSULE" -C "$RUNNER_TEMP/capsule"
          python -m pip install --disable-pip-version-check "$RUNNER_TEMP/capsule[tamp]"
          mfw-pypi-planner catalog \
            --register spiderplan=up_spiderplan.solver:EngineImpl \
            > "$RUNNER_TEMP/receipt/catalog-spiderplan.json"
          python - "$RUNNER_TEMP/receipt/catalog-spiderplan.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          value = json.loads(Path(sys.argv[1]).read_text())
          assert value["distributions"]["up-spiderplan"] == "0.6.4", value
          assert any(engine["name"] == "spiderplan" for engine in value["engines"]), value
          PY
      - name: Execute pinned official Docker-backed Spiderplan fixture
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/aiplan4eu/up-spiderplan.git "$RUNNER_TEMP/up-spiderplan"
          git -C "$RUNNER_TEMP/up-spiderplan" checkout "$SPIDERPLAN_COMMIT"
          test "$(git -C "$RUNNER_TEMP/up-spiderplan" rev-parse HEAD)" = "$SPIDERPLAN_COMMIT"
          test "$(git -C "$RUNNER_TEMP/up-spiderplan" hash-object tests/test_classical.py)" = "$SPIDERPLAN_TEST_BLOB"
          (
            cd "$RUNNER_TEMP/up-spiderplan/tests"
            timeout 900 python -m unittest test_classical.TestClassical.test_basic -v
          ) 2>&1 | tee "$RUNNER_TEMP/receipt/spiderplan-execution.log"
          grep -q "OK" "$RUNNER_TEMP/receipt/spiderplan-execution.log"
          docker image ls --digests --no-trunc > "$RUNNER_TEMP/receipt/docker-images.txt"
          docker ps -a --no-trunc > "$RUNNER_TEMP/receipt/docker-containers.txt"
          python - "$RUNNER_TEMP/receipt/receipt-spiderplan.json" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          output = Path(sys.argv[1])
          log = output.with_name("spiderplan-execution.log")
          catalog = json.loads(output.with_name("catalog-spiderplan.json").read_text())
          receipt = {
              "schema": "urn:chatman:mfw-spiderplan-docker:v2",
              "status": "ALIVE",
              "mfw_head_sha": "18294174c2d1262821975c08f2843f4a6c29a80c",
              "mfw_tree_sha": "e31e5d50028b0e2a26ac6a6b4dd466319315e22a",
              "distribution": "up-spiderplan==0.6.4",
              "registered_engine": "spiderplan=up_spiderplan.solver:EngineImpl",
              "fixture_repository": "aiplan4eu/up-spiderplan",
              "fixture_commit": "9b79fb4de0a858afebdb11162956557a3ffaa5e4",
              "fixture_blob": "b5d0cd87fc8307b74e04f96912dc0b00b36991b5",
              "test": "TestClassical.test_basic",
              "result": "OK",
              "execution_log_sha256": hashlib.sha256(log.read_bytes()).hexdigest(),
              "catalog": catalog,
          }
          output.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crown-spiderplan-${{ github.sha }}
          path: ${{ runner.temp }}/receipt
          if-no-files-found: error
          retention-days: 14

  rust-python-val:
    needs: capsule-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Admit exact MFW runner source blobs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_CRATE/src"
          test "$(git hash-object config.rs)" = 480f36f7a3b5a836cc95dc652a053eb6c5b9ccc1
          test "$(git hash-object digest.rs)" = 0a62f4bdd90832a5de43ea5c4dc9605d788458d0
          test "$(git hash-object error.rs)" = 0a6a244add4cdf20e5d4fd3745faea00bd1bf9b2
          test "$(git hash-object model.rs)" = b1c83c72d14eddb50c91444539b3e03096cafe07
          test "$(git hash-object runner.rs)" = 92be66ad878a96859fa2523dc27b5f5fb71675a0
          test "$(git hash-object template.rs)" = d3179fbc2af462ac4fa237e6193a872c657356a0
      - name: Install current Python candidate engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/capsule" "$RUNNER_TEMP/receipt"
          tar -xzf "$CAPSULE" -C "$RUNNER_TEMP/capsule"
          python -m pip install --disable-pip-version-check "$RUNNER_TEMP/capsule[pyperplan]"
          rustc -Vv > "$RUNNER_TEMP/receipt/rustc-version.txt"
          cargo -V > "$RUNNER_TEMP/receipt/cargo-version.txt"
      - name: Build pinned independent VAL validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison
          git clone --filter=blob:none https://github.com/KCL-Planning/VAL.git "$RUNNER_TEMP/VAL"
          git -C "$RUNNER_TEMP/VAL" checkout "$VAL_COMMIT"
          test "$(git -C "$RUNNER_TEMP/VAL" rev-parse HEAD)" = "$VAL_COMMIT"
          cmake -S "$RUNNER_TEMP/VAL" -B "$RUNNER_TEMP/VAL/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/VAL/build" --target Validate --parallel 2
          test -x "$RUNNER_TEMP/VAL/build/bin/Validate"
          sha256sum "$RUNNER_TEMP/VAL/build/bin/Validate" > "$RUNNER_TEMP/receipt/val-sha256.txt"
      - name: Format, compile, lint, and test exact runner projection
        working-directory: ${{ github.workspace }}/validation/mfw-pypi-crown/mfw-runner-integration
        run: |
          cargo fmt --check
          cargo check --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
      - name: Execute exact Rust runner through Python and VAL
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --manifest-path "$RUNNER_CRATE/Cargo.toml" -- \
            "$RUNNER_TEMP/capsule/tests/fixtures/domain.pddl" \
            "$RUNNER_TEMP/capsule/tests/fixtures/problem.pddl" \
            "$RUNNER_TEMP/integration" \
            "$RUNNER_TEMP/VAL/build/bin/Validate" \
            | tee "$RUNNER_TEMP/receipt/integration-stdout.jsonl"
          cp "$RUNNER_TEMP/integration/receipt-rust-python-val.json" "$RUNNER_TEMP/receipt/"
          test -s "$RUNNER_TEMP/integration/candidate/candidate.plan"
          grep -qi "plan valid" "$RUNNER_TEMP/integration/validator/stdout.log"
      - name: Execute ten clean replays and benchmark
        shell: bash
        run: |
          set -euo pipefail
          python - \
            "$RUNNER_CRATE/target/release/mfw-runner-validation" \
            "$RUNNER_TEMP/capsule/tests/fixtures/domain.pddl" \
            "$RUNNER_TEMP/capsule/tests/fixtures/problem.pddl" \
            "$RUNNER_TEMP/VAL/build/bin/Validate" \
            "$RUNNER_TEMP/receipt/receipt-benchmark.json" <<'PY'
          import json
          from pathlib import Path
          import statistics
          import subprocess
          import sys
          import tempfile
          import time

          binary, domain, problem, validator, receipt_path = sys.argv[1:]
          samples = []
          for _ in range(10):
              with tempfile.TemporaryDirectory() as directory:
                  started = time.perf_counter_ns()
                  subprocess.run(
                      [binary, domain, problem, directory, validator],
                      check=True,
                      stdout=subprocess.DEVNULL,
                  )
                  samples.append((time.perf_counter_ns() - started) / 1_000_000)
          receipt = {
              "schema": "urn:chatman:mfw-rust-python-val-benchmark:v2",
              "status": "ALIVE",
              "mfw_head_sha": "18294174c2d1262821975c08f2843f4a6c29a80c",
              "mfw_tree_sha": "e31e5d50028b0e2a26ac6a6b4dd466319315e22a",
              "samples": 10,
              "min_ms": min(samples),
              "median_ms": statistics.median(samples),
              "max_ms": max(samples),
              "samples_ms": samples,
          }
          Path(receipt_path).write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crown-rust-python-val-${{ github.sha }}
          path: ${{ runner.temp }}/receipt
          if-no-files-found: error
          retention-days: 14

  crown:
    needs:
      - capsule-integrity
      - python-federation
      - pddl-selfplay
      - fmap-multi-agent
      - spiderplan-docker
      - rust-python-val
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify complete receipt DAG and issue crown
        run: |
          python validation/mfw-pypi-crown/aggregate.py \
            artifacts \
            receipt-crown.json
      - uses: actions/upload-artifact@v4
        with:
          name: mfw-pypi-planning-crown-${{ github.sha }}
          path: receipt-crown.json
          if-no-files-found: error
          retention-days: 30

[[edge]]
id = "edge:semantic-unknown-frontier"
title = "Produce candidates for genuinely unknown semantics (formal-discovery-loop semantic-unknown route)"
residue_class = "semantic-unknown"
mechanism = "LLM"
owner = "repository:chatman-ecosystem"
retirement_state = "LLM_ONLY"
terminal_residual = true
frequency = 2
llm_cost = 5
reuse = 1
formalizability = 1
score_basis = "ESTIMATED"
notes = "The admitted residual: candidate_only, never DO. Counted in LDR, never selected for retirement. Recurrences observed here are split out as new edges."

name: Fusion Acquisition Admission

on:
  pull_request:
    paths:
      - 'scripts/release_train/fusion_acquisition_admission/**'
      - 'tests/release_train/fusion_acquisition_admission/**'
      - '.github/workflows/fusion-acquisition-admission.yml'

permissions:
  contents: read

jobs:
  exact-head-fusion-acquisition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile
        run: python3 -m compileall -q scripts/release_train/fusion_acquisition_admission tests/release_train/fusion_acquisition_admission
      - name: Permanent fusion acquisition court
        run: PYTHONPATH=. python3 -m unittest discover -s tests/release_train/fusion_acquisition_admission -p 'test_faa_*.py' -v
      - name: Reject ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|httpx|boto3|azure\.|google\.cloud|subprocess\.|os\.system|socket\.' scripts/release_train/fusion_acquisition_admission

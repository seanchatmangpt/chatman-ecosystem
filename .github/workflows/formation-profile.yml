name: Knowing Christ formation correspondence

on:
  pull_request:
    branches: [main]
    paths:
      - "catalog/formation.toml"
      - "scripts/verify_formation_profile.py"
      - ".github/workflows/formation-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  correspondence:
    name: Exact formation correspondence
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify exact cross-repository semantic correspondence
        env:
          ECOSYSTEM_SUBJECT_SHA: ${{ env.CANDIDATE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_formation_profile.py --check-refs | tee formation-correspondence.json

      - name: Preserve correspondence receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formation-correspondence-${{ env.CANDIDATE_SHA }}
          path: formation-correspondence.json
          if-no-files-found: warn

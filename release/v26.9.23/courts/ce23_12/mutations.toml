# CE23-12 anti-vacuity corpus over the benchmark design graph (release/v26.9.23/bench/design.ttl and
# its union inputs), judged by bench/pack/scripts/verify.py with every instrument (SHACL, SPARQL on
# rdflib, SPARQL on pyoxigraph, the native evaluator and ggen's own gates). Good fixtures must be
# admitted by every instrument; every mutant must be refused by every instrument under its registered
# law. G0 (the committed design, unmutated) is implicit. Origins: the 16 draft mutations of
# bench/DESIGN.md section 12 (M1-M16) and the court's extensions (M17-M29).
# remove: [subject, predicate, object] patterns ("*" = any; '"text"' = literal); add: Turtle with the
# prefixes nlb ce23 ce es sj prov rdfs rdf dflss skos xsd dcterms; standing: a class-standing fixture.

[[fixture]]
id = "G1"
description = "lawful DISCOVERY operational tuple: n=30 distinct unseen receipts, 0 defects, u=0.095034 (exact), MSA ALIVE, zero LLM, zero replay divergence"
standing = { n = 30, x = 0, u = "0.095034", receipts = 30 }


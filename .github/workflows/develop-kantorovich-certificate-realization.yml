name: DEVELOP Kantorovich Certificate Realization Exact Head

on:
  pull_request:
    paths:
      - 'scripts/develop_train/kantorovich_certificate_realization/**'
      - 'tests/develop_train/kantorovich_certificate_realization/**'
      - '.github/workflows/develop-kantorovich-certificate-realization.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact PR head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile
        run: python3 -m compileall -q scripts/develop_train/kantorovich_certificate_realization tests/develop_train/kantorovich_certificate_realization
      - name: Permanent and Chicago courts
        env:
          PYTHONPATH: .
        run: python3 -m unittest discover -s tests/develop_train/kantorovich_certificate_realization -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        shell: bash
        run: |
          ! grep -REn '^\s*(import|from)\s+(requests|httpx|boto3|azure|google\.cloud|socket|subprocess)|requests\.(post|put|patch|delete)|subprocess\.|os\.system' scripts/develop_train/kantorovich_certificate_realization tests/develop_train/kantorovich_certificate_realization

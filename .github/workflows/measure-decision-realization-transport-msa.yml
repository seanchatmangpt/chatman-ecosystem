name: MEASURE Decision Realization Transport MSA

on:
  pull_request:
    paths:
      - 'scripts/measure_train/decision_realization_transport_msa/**'
      - 'tests/measure_train/decision_realization_transport_msa/**'
      - '.github/workflows/measure-decision-realization-transport-msa.yml'

permissions:
  contents: read

jobs:
  exact-head-court:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact subject
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile transport MSA
        run: PYTHONPATH=. python3 -m py_compile scripts/measure_train/decision_realization_transport_msa/*.py tests/measure_train/decision_realization_transport_msa/*.py
      - name: Run permanent falsifier and Chicago court
        run: PYTHONPATH=. python3 -m unittest discover -s tests/measure_train/decision_realization_transport_msa -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        shell: bash
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|urllib\.request\.(Request|urlopen)|subprocess\.|os\.system|boto3|azure\.|google\.cloud|socket\.' scripts/measure_train/decision_realization_transport_msa

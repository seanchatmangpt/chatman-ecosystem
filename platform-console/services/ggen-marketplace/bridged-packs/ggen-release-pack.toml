[pack]
id = "ggen-release-pack"
name = "ggen-release-pack"
version = "0.1.1"
description = """v0.1.1: ERRC reconciliation of this pack's ontology.ttl against the older monorepo copy (~/ggen/packs/ggen-release-pack/), which had accreted a real 2026-08-07 re-audit + same-day 80/20 ERRC gap-closure pass this marketplace copy never received (this copy's PUBLICATION_JUDGMENT.md table and RELEASE_STANDING.json/.md were frozen at the 2026-07-20 walk). Diffed both ontology.ttl files line-for-line: the monorepo copy is a strict superset — every one of its 23 condition rows either matches this copy's 2026-07-20 text verbatim or extends it with a dated 'Re-audited 2026-08-07' addendum citing a real re-run command/file-read; none of this copy's rows contained wording absent from the monorepo copy. Condition-level deltas the reconciliation admits: condition 1 (regression — the marketplace-docs generation.rules entry was deleted by an unrelated PR, then restored, both events disclosed) stays PARTIAL with the fuller history; condition 10 moves PARTIAL->ALIVE (claims ledger grew 17->19 entries, schema validation re-run green); condition 18 (migration-receipt.json) round-trips a real regression (file went missing) and a real same-day fix (persisted via a new test) that the 2026-07-20 snapshot could not have known about, netting ALIVE with the full history instead of a stale unconditional ALIVE; condition 20 moves PARTIAL->ALIVE (a real, live, all-4-target cross-host CI run, gh run 31208843697, executed and passed); condition 21 round-trips ALIVE->PARTIAL (book/dist/ went missing) ->ALIVE (re-regenerated and independently re-verified deterministic against the original methodology); condition 22 round-trips ALIVE->PARTIAL (repo-facts.ttl pack inventory drifted again, 82 dirs vs 33 registered) ->ALIVE (closed via a new automation script, sync_pack_inventory.py, instead of another manual one-off); conditions 2-4, 6, 8, 9, 12, 13, 14, 15, 16, 17, 19, 23 keep their prior status with an added 'no regression' re-confirmation citing a real re-run; conditions 5, 7, 11 keep prior status with sharpened, more honestly-scoped Basis text (condition 7 discloses a newly-found `just verify-tcps` failure in examples/tcps-generated, not present in the older snapshot). Also verified: this pack's templates/*.tmpl (publication_judgment, publish_candidate_workflow.yml, release_standing_json, release_standing_md) are already byte-identical to the monorepo copy's canonical .tmpl siblings; the monorepo copy additionally carries legacy bare .tera equivalents (publication_judgment.md.tera, release_standing_json.json.tera, release_standing_md.md.tera) that were confirmed content-equivalent (identical SPARQL SELECT over the same grp:*Artifact subject/predicate, same output target) and were NOT ported, since this marketplace's canonical to:/sparql:/for_each: frontmatter format already covers the same projection. No new content was fabricated; every retained claim traces to text already present in one of the two source ontology.ttl files. Also generates an honest RELEASE_STANDING.json/.md pair for ggen (source_standing believable/claimed, binary_standing unverified-on-artifact-host, l5_publication_claim WITHHELD) and docs/PUBLICATION_JUDGMENT.md, a per-condition status table transcribed from GGEN-v26.7.20-製品要求書・構成設計書.md's 第二十九章 公開可能条件 (23 conditions), driven from ontology individuals (grp:CiWorkflow/grp:ReleaseArtifact) whose body literals are the real, byte-for-byte content this pack renders — following the literal-template-body pattern of packs/tcps-release-pack"""
category = "marketplace"
packages = []

[pack.metadata]
bridged_from = "~/ggen-marketplace/packs/ggen-release-pack"
has_ontology_ttl = true

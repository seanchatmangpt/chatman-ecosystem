name: Agent Lightning Format Capsule

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/ecosystem-runtime/src/lib.rs"
      - "crates/ecosystem-runtime/src/agent_lightning_commercial_plane.rs"
      - "crates/ecosystem-runtime/src/bin/agent-lightning-commercial.rs"
      - ".github/workflows/agent-lightning-format-capsule.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Promote modules and canonical-format bounded owned surfaces
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ecosystem-runtime/src/lib.rs')
          text = path.read_text()
          marker = '//! Runtime and adapter layer for the Chatman Ecosystem.\n\n'
          modules = (
              'pub mod agent_lightning_commercial_plane;\n'
              'pub mod agent_lightning_service;\n'
              'pub mod commerce;\n\n'
          )
          if modules not in text:
              if marker not in text:
                  raise SystemExit('runtime crate header changed')
              text = text.replace(marker, marker + modules, 1)
              path.write_text(text)
          PY
          rustfmt --edition 2024 crates/ecosystem-runtime/src/agent_lightning_commercial_plane.rs
          rustfmt --edition 2024 --config skip_children=true crates/ecosystem-runtime/src/lib.rs
          rustfmt --edition 2024 --config skip_children=true crates/ecosystem-runtime/src/bin/agent-lightning-commercial.rs
          git diff --check -- \
            crates/ecosystem-runtime/src/lib.rs \
            crates/ecosystem-runtime/src/agent_lightning_commercial_plane.rs \
            crates/ecosystem-runtime/src/bin/agent-lightning-commercial.rs
      - name: Commit formatter result
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            crates/ecosystem-runtime/src/lib.rs \
            crates/ecosystem-runtime/src/agent_lightning_commercial_plane.rs \
            crates/ecosystem-runtime/src/bin/agent-lightning-commercial.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/ecosystem-runtime/src/lib.rs \
            crates/ecosystem-runtime/src/agent_lightning_commercial_plane.rs \
            crates/ecosystem-runtime/src/bin/agent-lightning-commercial.rs
          git commit -m 'refactor: expose formatted Agent Lightning commercial library'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

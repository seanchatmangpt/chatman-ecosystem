# Modest ResourceQuota per project namespace, sized for a single
# status-only service (1 replica, one small stdlib http.server container)
# PLUS the Istio sidecar every pod in these namespaces gets, since
# namespaces.yaml sets istio-injection: enabled on all five.
#
# Root-caused during real deployment: the first `kubectl apply` of this
# file (with limits.cpu: 500m / limits.memory: 256Mi) produced
# `FailedCreate ... exceeded quota` for every Deployment, because each
# pod's *total* (app container + istio-proxy sidecar) is what the quota
# counts, not just the app container's own resources. Confirmed via
# `kubectl get cm istio-sidecar-injector -n istio-system -o
# jsonpath='{.data.values}'` -> global.proxy.resources: limits
# {cpu: 2000m, memory: 1024Mi}, requests {cpu: 10m, memory: 40Mi} --
# that is this cluster's real, live sidecar default, not an assumption.
#
# Per-pod totals with that sidecar:
#   status pod:  limits  200m+2000m=2200m cpu, 128Mi+1024Mi=1152Mi mem
#                requests 50m+10m=60m cpu,     64Mi+40Mi=104Mi mem
#   console pod: limits  500m+2000m=2500m cpu, 512Mi+1024Mi=1536Mi mem
#                requests 100m+10m=110m cpu,   128Mi+40Mi=168Mi mem
#
# Quotas below are sized for 2x a single replica's totals (headroom for
# a RollingUpdate surge pod existing briefly alongside the old one, plus
# a throwaway debug/curl pod during verification), not the bare minimum.
# Field names (limits.cpu, limits.memory, pods, requests.cpu,
# requests.memory) match the existing team-platform-team/platform-team-quota
# object already live on this cluster -- same shape, numbers now sized to
# the real, observed per-pod cost instead of the app container alone.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: autofde-lab-quota
  namespace: autofde-lab
spec:
  hard:
    pods: "5"
    requests.cpu: "500m"
    requests.memory: "256Mi"
    limits.cpu: "5"
    limits.memory: "2560Mi"
---

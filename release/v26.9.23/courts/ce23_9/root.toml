# CE23-9 root court pins (hand-authored; HANDWRITTEN.md row). The court's members
# (release/v26.9.23/courts/ce23_9/members.py) and its judge (court.py) read these facts; the
# members themselves are er:Gate facts of release/v26.9.23/release.ttl, rendered by the vendored
# chatman-ecosystem-release-pack into release/v26.9.23/out/scripts/crown_v26_9_23.sh.

[subject]
gate = "CE23-9"
repository = "seanchatmangpt/chatman-ecosystem"
subject_dir = "release/v26.9.23"
# GitHub main at CE23-0: the release pull request's base. The CI check universe is computed over
# the files the release changes from it (courts/ce23_9/ci_checks.py).
base_commit = "c59596f5506e7a00ca4ed6b909ebf6d6659b74c1"
court_script = "out/scripts/crown_v26_9_23.sh"
typed_checks = "out/typed-checks.txt"
release_graph = "release.ttl"
imported_crown_render = "out/imported-crown.toml"
goal = "sjira/goal.ttl"
goal_root = "https://ggen-igniter.dev/sjira/chatman-26.9.23#GC-CE-26.9.23"
receipts_dir = "receipts/v26.9.23"
# The judging court: every file here must be byte-identical to HEAD (clause C1).
court_files = [
  "release/v26.9.23/courts/CE23-9.sh",
  "release/v26.9.23/courts/ce23_9/court.py",
  "release/v26.9.23/courts/ce23_9/members.py",
  "release/v26.9.23/courts/ce23_9/ci_checks.py",
  "release/v26.9.23/courts/ce23_9/ci_job.py",
  "release/v26.9.23/courts/ce23_9/root.toml",
  "release/v26.9.23/courts/ce23_9/fixtures/checkruns-c59596f5.json",
]

[validator]
# The generated receipt validator of ggen-marketplace receipt-provenance-unification-pack (MP-RPV:
# dfcm_fleet_v1 contract + durable profile). It is never committed here: its generated contract table
# cites source files by absolute path (among them one under the retired shadow tree), so the members
# imported-receipts and chatman-stop and the judge's AV3 read it at run time as
#   git -C $CE23_MARKETPLACE_REPO show <commit>:<path>     (default: the canonical ~/ggen-marketplace)
# into their own scratch and run that copy only when its sha256 is `sha256`
# (REFUSED[VALIDATOR_NOT_BYTE_IDENTICAL] otherwise; UNKNOWN[MARKETPLACE_UNAVAILABLE] without the
# checkout). `commit` must be on origin/<ref> (published): a pin on a fast-forward of that line is
# UNKNOWN[VALIDATOR_PUBLICATION_PENDING], a pin off it REFUSED[VALIDATOR_OFF_REF]. To move it: point
# commit/blob/sha256 at the new marketplace commit; the file is regenerated only in ggen-marketplace.
repository = "seanchatmangpt/ggen-marketplace"
ref = "release/v26.9.23-int"
commit = "e3988aba4a850095d94d3b18a4495766d13e4d5e"
pack = "packs/receipt-provenance-unification-pack"
path = "packs/receipt-provenance-unification-pack/generated/unified_receipt_validator.py"
blob = "facbff0551319ae11da812c9c3e1c6c901d2aa3f"
sha256 = "008ce23419325ebda2998fb7445a38da80a7735ba3ca6fdc56c0e0a7ec686f70"
contract = "dfcm_fleet_v1"

[stop]
# CHATMAN_STOP: member `chatman-stop` evaluates goal_root's own sj:stopQuery over goal.ttl, the compiled
# orders and the admitted receipts under receipts_dir projected as sj:Receipt nodes; member `replay`
# re-runs, at HEAD, the court of every root-level gate those receipts hold ALIVE. The gates below never
# get their receipt from this court's inputs (reason printed by the members); CE23-9 and CE23-10 enter
# the stop query provisionally ALIVE, CE23-11 is outside it:
exclude = { "CE23-9" = "this court (a court cannot be a member of itself)", "CE23-10" = "the root release receipt is rendered from this court's observation (circular)", "CE23-11" = "the tag is a consequence of STOP=true, never a premise" }
# The operator edge (GC23-12 acceptance, operator-only): the imported Semantic Manufacturing crown
# can only reach STOP=true after the operator commits this file in the component repository.
acceptance_component = "xaas"
acceptance_path = "docs/sjira/v26.9.23/successor/ACCEPTED"

[ci]
# A local member's er:command is exactly this prefix + "<workflow> <job>" (+ " --skip-step '<name>'").
local_member_prefix = "python3 release/v26.9.23/courts/ce23_9/ci_job.py "
# Check-run conclusions that are not failures.
passing_conclusions = ["success", "skipped", "neutral"]

# Real Policy-as-Code / Organization Policy enforcement (AWS Config Rules /
# GCP Org Policy equivalent), using Kubernetes' own native, built-in
# ValidatingAdmissionPolicy (CEL-based, admissionregistration.k8s.io/v1,
# GA since 1.30 -- this cluster runs v1.34.0) -- NOT a third-party
# admission webhook framework (Kyverno/OPA Gatekeeper/etc.), none of which
# is installed on this cluster. Zero extra infrastructure: the policy is
# evaluated by kube-apiserver itself, in-process, on every matching
# request.
#
# The ONE real, meaningful policy enforced here: every Deployment created
# in the platform's own project namespaces must declare real resource
# requests/limits on every container. This is the exact same rule
# k8s/resource-quotas.yaml's own comment already documents as a real,
# live-confirmed gap (a Deployment with no `resources` block -- or with
# `limits` but no `requests`, or vice versa -- breaks ResourceQuota
# admission with a real `exceeded quota: must specify limits.cpu for: ...`
# once ANY compute ResourceQuota exists in that namespace, which is true
# for all 5 platform namespaces below, per k8s/resource-quotas.yaml).
# Before this policy, that gap was only caught by ResourceQuota admission
# incidentally, AFTER the fact, with a quota-shaped error message that
# doesn't explain the real rule; this policy is the platform's own,
# explicit, purpose-written rule for it -- rejected with a message that
# says exactly what's missing and why, evaluated before ResourceQuota
# admission even runs.
#
# app-level RBAC (lib/authz.ts, k8s/rbac.yaml/paas-rbac.yaml) already
# controls WHO can ask the console to create a Deployment; this is a
# second, independent, cluster-side enforcement layer that holds even
# against `kubectl apply` run directly against the API server by anyone
# with namespace write access -- the same defense-in-depth relationship
# AWS Config Rules/GCP Org Policy have to IAM.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-deployments-require-resources
spec:
  # Fail (not Ignore): if CEL evaluation itself errors for some reason,
  # fail CLOSED (reject), never silently let a non-compliant Deployment
  # through.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: >-
        object.spec.template.spec.containers.all(c,
          has(c.resources.requests) && has(c.resources.limits))
      message: >-
        every container in this Deployment's pod template must declare both
        spec.resources.requests and spec.resources.limits (Policy-as-Code
        control: platform-deployments-require-resources) -- a Deployment
        with no resources block breaks ResourceQuota-enforced namespaces
        and is rejected here before that happens
      reason: Invalid
  auditAnnotations:
    - key: enforced-by
      valueExpression: "'platform-deployments-require-resources'"
---
# Binding: scopes the policy above to the platform's 5 project
# namespaces (autofde-lab, gymact, ggen, ggen-marketplace,
# platform-console -- the exact same 5 namespaces k8s/namespaces.yaml
# creates and k8s/resource-quotas.yaml already puts a ResourceQuota in,
# confirmed live via `kubectl get resourcequota -A`) plus istio-system --
# real platform Deployments (weaver, collector, etc.) land there too, and
# CISO review flagged that this policy previously did not cover them
# (source: ciso). Matched by the well-known, immutable, auto-applied
# `kubernetes.io/metadata.name` label every namespace carries (the same
# selector shape k8s/network-policies.yaml's own
# `*-allow-from-platform-console` rules already use) -- never a wildcard,
# never kube-system/flux-system/kube-public/kube-node-lease/
# local-path-storage/monitoring/supabase-system/supabase-demo/default,
# all of which are deliberately left OUT of this list.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: platform-deployments-require-resources-binding
spec:
  policyName: platform-deployments-require-resources
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - autofde-lab
            - gymact
            - ggen
            - ggen-marketplace
            - platform-console
            - istio-system
---
# ------------------------------------------ Vulnerability admission gate
#
# The real, continuous gap this closes: services/vuln-scanner (lib/vuln-
# scan.ts) could already produce a real trivy CRITICAL-CVE finding, but
# nothing stopped that same image from being deployed anyway -- a scan
# was evidence a human could read, not an enforced gate a bad Deployment
# could actually be rejected by. This policy is that gate, built on the
# exact same native ValidatingAdmissionPolicy primitive as
# `platform-deployments-require-resources` above (zero extra
# infrastructure, evaluated by kube-apiserver itself, in-process, on
# every matching Deployment CREATE/UPDATE -- not a one-off manual `trivy`
# invocation captured as evidence once).
#
# WHY paramKind/paramRef (unlike the policy above, which needed no
# params): CEL has no built-in way to shell out to trivy or call the
# vuln-scanner's own live findings at admission time, so the real,
# already-computed scan result has to be published somewhere the
# apiserver's own admission chain can read it directly and synchronously.
# A ConfigMap is that publish point -- lib/vuln-scan.ts's
# syncVulnDenylist writes it after every completed scan (real RFC 7386
# merge patch, same primitive Feature Flags/Org Roles already use), and
# this binding's `paramRef` makes kube-apiserver fetch that exact object
# fresh on every admission request it evaluates -- there is no polling
# delay or cache to go stale, since the ConfigMap read is the admission
# request itself.
#
# WHY A REGEX PATTERN, NOT ONE KEY PER IMAGE: a k8s ConfigMap `data` key
# must match `[-._a-zA-Z0-9]+` -- a real image ref's `/` and `:` bytes
# are not legal key characters, so the blocked-image set can't be stored
# "one ref per key" the way e.g. lib/authz.ts's org-roles ConfigMap
# stores identities (which escapes disallowed bytes for that exact
# reason). ConfigMap *values* have no such restriction, so
# syncVulnDenylist instead writes a single derived RE2 alternation
# pattern as one value, and the expression below matches each
# container's raw, unescaped `c.image` against it with CEL's own native
# `.matches()` string function -- standard CEL, no JSON-decode/split
# extension library required.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-deployments-block-critical-cves
spec:
  # Fail (not Ignore): if CEL evaluation itself errors (e.g. the
  # denylist ConfigMap's `denylist_pattern` key is somehow missing after
  # being resolved), fail CLOSED -- same discipline as the resources
  # policy above.
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: >-
        !object.spec.template.spec.containers.exists(c,
          c.image.matches(params.data['denylist_pattern']))
      messageExpression: >-
        "this Deployment references a container image trivy has found " +
        "unresolved CRITICAL vulnerabilities in, per the platform's " +
        "own live vulnerability-scan admission gate (Policy-as-Code " +
        "control: platform-deployments-block-critical-cves) -- re-scan " +
        "after the image is rebuilt with a fix (services/vuln-scanner, " +
        "/security page) to clear this Deployment for admission"
      reason: Invalid
  auditAnnotations:
    - key: enforced-by
      valueExpression: "'platform-deployments-block-critical-cves'"
---
# Binding: same 5 platform namespaces as the resources policy above (not
# a copy-paste coincidence -- these are the platform's own project
# namespaces, plus istio-system (real platform Deployments like weaver
# and collector land there too -- CISO review flagged this gap, source:
# ciso). `paramRef` points at the real, single, namespace-scoped
# ConfigMap syncVulnDenylist writes to
# (`platform-console-vuln-denylist`, `platform-console` namespace --
# never a selector-based paramRef, since there is exactly one gate
# object, not a family of them per-team).
#
# `parameterNotFoundAction: Allow` is a deliberate, disclosed trade-off,
# not an oversight: the gate ConfigMap does not exist until the very
# first scan run ever completes (a fresh cluster, or this policy applied
# before any scan has run) -- `Deny` in that bootstrap window would
# reject every real Deployment across all 5 namespaces platform-wide,
# including the console's own, for a reason with no actionable fix
# (there is no denylist entry to clear; a human would have to delete
# this binding to unblock the whole platform). `Allow` here matches this
# gap's actual literal scope ("reject Deployments referencing images
# with unresolved trivy CRITICAL findings") -- it does not claim to
# reject deployments of images that have simply never been scanned,
# which is a real, larger, disclosed gap left for a future "block
# anything not on a fresh allow-list" policy, not silently implied to
# already be covered here.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: platform-deployments-block-critical-cves-binding
spec:
  policyName: platform-deployments-block-critical-cves
  validationActions: ["Deny"]
  paramRef:
    name: platform-console-vuln-denylist
    namespace: platform-console
    parameterNotFoundAction: Allow
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - autofde-lab
            - gymact
            - ggen
            - ggen-marketplace
            - platform-console
            - istio-system

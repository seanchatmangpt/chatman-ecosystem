[pack]
id = "azure-terraform-pack"
name = "azure-terraform-pack"
version = "26.7.13"
description = """Deterministic Terraform HCL (deploy/azure/crown-bribery-case/*.tf + tests/container_group.tftest.hcl, placed directly under tests/ -- not tests/unit/ -- to match Terraform's own `terraform test` default -test-directory=tests discovery convention, confirmed this session by running the real `terraform test` CLI both ways) generated from packs/azure-terraform-pack/ontology.ttl -- an RDF fact model of the ONE real deployment topology grounded in this repo's own crown-bribery-case binary (crates/multifractal-workflow/src/bin/crown-bribery-case.rs, part of the multifractal-workflow crate). Resource shape (azurerm_container_group + nested container block, argument names verbatim) is adapted from the real Azure Verified Module Azure/terraform-azurerm-avm-res-containerinstance-containergroup (MIT License, fetched and read directly this session, not assumed); its own tests/ directory ships zero .tftest.hcl files (a placeholder README, confirmed via GitHub tree API), so the tftest.hcl unit-test SHAPE (mock_provider "azurerm" {} + command = plan + assert blocks) is instead adapted from Azure/terraform-azurerm-avm-res-keyvault-vault's tests/unit/*.tftest.hcl (also MIT, also fetched and read directly), whose native-azurerm-resource mock pattern transfers cleanly since azurerm_container_group, like azurerm_key_vault, is a native azurerm resource (not azapi, which is why Storage Account AVM's own mocks were NOT the source pattern here). See packs/azure-terraform-pack/SOURCE_ATTRIBUTION.md for the full URL/license/adapted-vs-custom ledger. TOPOLOGY GROUNDING: one Azure Container Instance container group, one container running BOTH the compiled Rust binary AND Erlang/OTP plus escript, because crates/multifractal-workflow/src/f15_air_transition_core/bridge.rs and .../f16_otp_runner/bridge.rs spawn apps/air_core/scripts/air_core_bridge.escript and apps/arazzo_runner/scripts/dispatch_statem_bridge.escript as same-host OS child processes (std::process::Command, JSON over stdin/stdout) -- a subprocess bridge, not a network RPC, ruling out split serverless-function-per-language deployment. restart_policy=Never (main() runs one linear pipeline to completion and exits), ip_address_type=None (zero reqwest/hyper/axum/tonic/TcpListener references anywhere in the chain -- no listener to expose), no volume/persistent-storage resource (every stage artifact is written under target/crown-bribery-case/<run-id>/ via std::fs::write; ephemeral container disk suffices for a measured 384K/6-runs workload), no Key Vault/managed-identity resource (BrokerSecret's only non-test derivation is a fixed, disclosed blake3 label hash, not an externally-sourced secret -- grep for std::env::var in crates/multifractal-workflow/src/ returns zero hits). Region/environment/resource-group-name/container-image-reference are the only Terraform `variable` blocks NOT bound from the ontology -- those are genuine deployment-day inputs with no fact derivable from the source tree; every other resource attribute (os_type/restart_policy/ip_address_type/container name+cpu+memory+command) is SPARQL-bound from ontology.ttl so template and generated .tf can never silently drift apart. No ggen.toml extra_ontologies entry required -- this pack's vocabulary and its one real deployment instance are both self-contained in ontology.ttl (no external ontology is unioned).

MARKETPLACE IMPORT NOTE (2026-08-10): this pack's real, substantive SHACL shapes (155 lines, closed-shape discipline, sh:in enums verified against the real azurerm provider docs) were originally at shapes.ttl, written for the separate `ggen graph validate --files ontology.ttl --shapes shapes.ttl` verb. The current ggen pack contract refuses ANY file literally named shapes.ttl at a pack's root unconditionally at `ggen sync run` time (a legacy-SHACL-gate guard, per docs/reference/pack-contract.md), regardless of which verb actually consumes it -- relocated to reference/legacy-shacl-shapes.ttl (content unchanged, not deleted) to unblock sync while preserving it for manual `ggen graph validate` use. A full migration to gates/*.rq SPARQL gates (the sync-time-equivalent mechanism) was not attempted in this pass -- rewriting 155 lines of closed-shape SHACL (sh:closed, sh:ignoredProperties, sh:in enums) into equivalent ASK/SELECT queries needs care this import didn't have time for; tracked as real, disclosed follow-on work, not silently dropped.

MARKETPLACE MATURITY NOTE (2026-08-10): imported into ggen-marketplace and composed with pack-maturity-pack in a real scratch consumer (real ggen 26.8.6, no mocks) -- l5p:cap03 (Deterministic regeneration) and l5p:cap04 (Fixed-point convergence) verified via a real two-pass `ggen sync run` byte comparison, and l5p:cap09 (Generated receipts) verified via a real `ggen receipt verify` (valid, signed, signature_valid). The other 9 L5-promotion capabilities (http://ggen.org/l5-promotion#) were not evaluated in this pass -- see pack-maturity-pack's own README for exactly what composing it does and does not close."""
category = "marketplace"
packages = []

[pack.metadata]
bridged_from = "~/ggen-marketplace/packs/azure-terraform-pack"
has_ontology_ttl = true

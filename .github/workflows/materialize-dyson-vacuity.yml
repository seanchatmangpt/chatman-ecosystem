name: Materialize Dyson Non-Vacuity

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/dyson-book-vacuity-eradication'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PURPOSE_BRANCH: agent/dyson-book-vacuity-eradication
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout purpose branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PURPOSE_BRANCH }}
          fetch-depth: 0

      - name: Compile enrichment and audit courts
        run: |
          python3 -m py_compile \
            scripts/enrich_dyson_sphere_book.py \
            scripts/audit_dyson_sphere_book.py \
            scripts/generate_dyson_sphere_book.py

      - name: Materialize every SUMMARY-linked page
        run: |
          set -euo pipefail
          python3 scripts/enrich_dyson_sphere_book.py \
            --root docs/how-to-build-a-dyson-sphere \
            --repo-root . \
            --install-hook | tee /tmp/dyson-enrichment.json

      - name: Execute fail-closed non-vacuity court
        run: |
          set -euo pipefail
          python3 scripts/audit_dyson_sphere_book.py \
            --root docs/how-to-build-a-dyson-sphere \
            --write-report \
            --report artifacts/dyson-vacuity-audit.json | tee /tmp/dyson-audit.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/dyson-audit.json'))
          assert r['standing']=='ALIVE', r['findings'][:5]
          assert r['summary_linked_pages']==r['unique_linked_pages']
          assert r['unique_page_bodies']==r['summary_linked_pages']
          assert r['minimum_words'] >= 560
          print('DYSON_VACUITY_COURT_ALIVE', r['summary_linked_pages'], r['minimum_words'], r['median_words'])
          PY

      - name: Prove regeneration cannot restore vacuity
        shell: bash
        run: |
          set -euo pipefail
          find docs/how-to-build-a-dyson-sphere -type f -name '*.md' -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/before-regeneration.sha256
          python3 scripts/generate_dyson_sphere_book.py > /tmp/regeneration.log
          python3 scripts/audit_dyson_sphere_book.py \
            --root docs/how-to-build-a-dyson-sphere > /tmp/post-regeneration-audit.json
          find docs/how-to-build-a-dyson-sphere -type f -name '*.md' -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/after-regeneration.sha256
          cmp /tmp/before-regeneration.sha256 /tmp/after-regeneration.sha256
          echo DYSON_REGENERATION_REPLAY_MATCH

      - name: Bound the product diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          lines=subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          changed=[line[3:] for line in lines]
          allowed=[]
          bad=[]
          for path in changed:
              if path.startswith('docs/how-to-build-a-dyson-sphere/'):
                  allowed.append(path)
              elif path in {
                  'scripts/generate_dyson_sphere_book.py',
                  'artifacts/dyson-vacuity-audit.json',
              }:
                  allowed.append(path)
              else:
                  bad.append(path)
          assert not bad, bad
          print('BOUNDED_DYSON_DIFF', len(allowed))
          PY

      - name: Commit admitted book materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sean Chatman"
          git config user.email "136349053+seanchatmangpt@users.noreply.github.com"
          git add \
            docs/how-to-build-a-dyson-sphere \
            scripts/generate_dyson_sphere_book.py \
            artifacts/dyson-vacuity-audit.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo NO_NEW_PRODUCT_DIFF
            exit 0
          fi
          git commit -m "eradicate vacuity from every Dyson book page"
          git push origin HEAD:${PURPOSE_BRANCH}

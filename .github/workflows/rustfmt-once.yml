name: Canonicalize Once

on:
  push:
    branches: [agent/crown-completion]

concurrency:
  group: canonicalize-once-agent-crown-completion
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  canonicalize:
    if: ${{ !contains(github.event.head_commit.message, 'install hardened core canonical formatting and lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/crown-completion
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Install hardened constitutional core
        env:
          CORE_GZIP_BASE64: 
        run: printf '%s' "$CORE_GZIP_BASE64" | base64 --decode | gzip --decompress > crates/ecosystem-core/src/lib.rs
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit hardened core, canonical formatting, and lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- apps crates Cargo.lock; then
            echo 'No canonicalization changes required.'
            exit 0
          fi
          git config user.name 'chatman-ecosystem-governor'
          git config user.email '136349053+seanchatmangpt@users.noreply.github.com'
          git add apps crates Cargo.lock
          git commit -m 'install hardened core canonical formatting and lockfile'
          git push origin HEAD:agent/crown-completion

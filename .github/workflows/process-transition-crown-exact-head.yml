name: Process Transition Crown Exact Head
on:
  pull_request:
    paths:
      - 'scripts/release_train/process_transition_crown/**'
      - 'tests/release_train/process_transition_crown/**'
      - '.github/workflows/process-transition-crown-exact-head.yml'
jobs:
  crown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile
        run: python3 -m compileall -q scripts/release_train/process_transition_crown tests/release_train/process_transition_crown
      - name: Permanent courts
        run: PYTHONPATH=. python3 -m unittest discover -s tests/release_train/process_transition_crown -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|httpx|boto3|azure\.|google\.cloud|subprocess\.|os\.system|socket\.' scripts/release_train/process_transition_crown

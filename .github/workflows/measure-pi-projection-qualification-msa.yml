name: MEASURE Process Intelligence Projection Qualification MSA

on:
  pull_request:
    paths:
      - 'scripts/measure_train/process_intelligence_projection_qualification_msa/**'
      - 'tests/measure_train/process_intelligence_projection_qualification_msa/**'
      - '.github/workflows/measure-pi-projection-qualification-msa.yml'

permissions:
  contents: read

jobs:
  qualification-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR subject
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile qualification MSA
        run: python3 -m py_compile scripts/measure_train/process_intelligence_projection_qualification_msa/*.py tests/measure_train/process_intelligence_projection_qualification_msa/*.py
      - name: Run permanent projection qualification court
        env:
          PYTHONPATH: .
        run: python3 -m unittest discover -s tests/measure_train/process_intelligence_projection_qualification_msa -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' scripts/measure_train/process_intelligence_projection_qualification_msa tests/measure_train/process_intelligence_projection_qualification_msa

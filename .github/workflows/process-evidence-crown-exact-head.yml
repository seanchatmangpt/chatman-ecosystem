name: Process Evidence Crown Exact Head

on:
  pull_request:
    paths:
      - 'scripts/release_train/process_evidence_crown/**'
      - 'tests/release_train/process_evidence_crown/**'
      - '.github/workflows/process-evidence-crown-exact-head.yml'

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact pull request head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile evidence crown subsystem
        run: python3 -m compileall -q scripts/release_train/process_evidence_crown tests/release_train/process_evidence_crown
      - name: Run permanent falsifier and Chicago courts
        run: PYTHONPATH=. python3 -m unittest discover -s tests/release_train/process_evidence_crown -p 'test_*.py' -v
      - name: Reject ambient consequential actuation surfaces
        run: |
          ! grep -REn '^\s*(import|from)\s+(requests|httpx|boto3|azure|google\.cloud|socket|subprocess)|requests\.(post|put|patch|delete)|subprocess\.|os\.system' scripts/release_train/process_evidence_crown tests/release_train/process_evidence_crown

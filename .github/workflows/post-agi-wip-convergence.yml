name: Post-AGI WIP Convergence Manufacture

on:
  push:
    branches:
      - agent/post-agi-wip-convergence-v26.8.18

permissions:
  contents: write

concurrency:
  group: post-agi-wip-convergence-${{ github.ref }}
  cancel-in-progress: false

env:
  P28_BASE: 2d149b4091f6b5239ecfbbe054fdb0b2f5eb5f01
  P28_HEAD: a8afc4b4c55600d1568cac876ea5216941c0b482
  P29_BASE: 2d149b4091f6b5239ecfbbe054fdb0b2f5eb5f01
  P29_HEAD: 35be09aca696d3c1ad68bc66b2ab623d8297cd04
  P30_BASE: 441a5642531977aa766bfd4827774a4b64945789
  P30_HEAD: 20f746d515148b2b857e0ea8bbbab35aab18a9f6
  P31_BASE: 441a5642531977aa766bfd4827774a4b64945789
  P31_HEAD: 89558fc5cf4ce2d36cf593767f560af3c7e7a380

jobs:
  manufacture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact convergence seed
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact seed identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Fetch admitted source heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            feat/capability-control-plane-v26.9.1 \
            agent/finish-chatman-ecosystem-wip \
            docs/v26.8.18-repo-review \
            agent/weaver-live-chatman-ecosystem-v26.8.18
          for sha in "$P28_HEAD" "$P29_HEAD" "$P30_HEAD" "$P31_HEAD"; do
            git cat-file -e "${sha}^{commit}"
          done

      - name: Reconstitute source deltas without branch merge
        shell: bash
        run: |
          set -euo pipefail

          git diff --binary "$P28_BASE" "$P28_HEAD" -- . \
            ':(exclude)views/generated/portfolio.md' \
            > /tmp/p28.patch
          git apply --index --3way /tmp/p28.patch

          git diff --binary "$P29_BASE" "$P29_HEAD" -- . \
            ':(exclude)catalog/documents.toml' \
            ':(exclude)views/generated/portfolio.md' \
            > /tmp/p29.patch
          git apply --index --3way /tmp/p29.patch

          git diff --binary "$P30_BASE" "$P30_HEAD" -- . \
            ':(exclude)catalog/documents.toml' \
            > /tmp/p30.patch
          git apply --index --3way /tmp/p30.patch

          git diff --binary "$P31_BASE" "$P31_HEAD" -- . > /tmp/p31.patch
          git apply --index --3way /tmp/p31.patch

      - name: Manufacture canonical document union
        shell: bash
        run: |
          set -euo pipefail
          git show "${P30_HEAD}:catalog/documents.toml" > catalog/documents.toml
          cat >> catalog/documents.toml <<'EOF'

          [[document]]
          id = "document:hyperdimensional-information-encryption"
          title = "Hyperdimensional Information Encryption and the Construct-Only Standing Runtime"
          path = "docs/architecture/hyperdimensional-information-encryption.md"
          canonical = false
          EOF

      - name: Regenerate canonical projections
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- projection render
          python3 scripts/verify_capabilities.py --write

      - name: Narrow admission before publication
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- catalog validate
          cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- projection check
          python3 scripts/verify_capabilities.py
          python3 scripts/verify_construct_runtime.py
          git diff --check

      - name: Remove temporary manufacturer and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/post-agi-wip-convergence.yml
          git add -A
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m "feat: reconstitute open WIP on exact main

          Sources:
          - PR #28 @ ${P28_HEAD}
          - PR #29 @ ${P29_HEAD}
          - PR #30 @ ${P30_HEAD}
          - PR #31 @ ${P31_HEAD}

          Manufacture: net-delta reconstitution; no branch merge; generated projections regenerated from canonical sources."
          test ! -e .github/workflows/post-agi-wip-convergence.yml
          git push origin "HEAD:${GITHUB_REF_NAME}"

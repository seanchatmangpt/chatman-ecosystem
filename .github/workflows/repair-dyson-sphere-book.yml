name: Repair Dyson Sphere Book

on:
  push:
    branches:
      - agent/dyson-sphere-book

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair canonical LaTeX generation
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('scripts/generate_dyson_sphere_book.py')
          s = p.read_text(encoding='utf-8')
          a = 'def intro():\n    return f"""'
          b = 'def intro():\n    return rf"""'
          c = "write('afterword.md', f\"\"\""
          d = "write('afterword.md', rf\"\"\""
          assert s.count(a) == 1, s.count(a)
          assert s.count(c) == 1, s.count(c)
          s = s.replace(a, b, 1).replace(c, d, 1)
          p.write_text(s, encoding='utf-8')
          PYCODE

      - name: Regenerate manuscript
        shell: bash
        run: |
          CHATMAN_REPO_ROOT="$GITHUB_WORKSPACE" \
          DYSON_VALIDATION_PATH=/tmp/dyson-book-validation.json \
          python3 scripts/generate_dyson_sphere_book.py
          cat /tmp/dyson-book-validation.json

      - name: Verify exact generated subject
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, re, tomllib

          root = Path('docs/how-to-build-a-dyson-sphere')
          report = json.loads(Path('/tmp/dyson-book-validation.json').read_text())
          assert report['chapters'] == 104, report
          assert report['markdown_files'] == 839, report
          assert report['summary_links'] == 838, report
          assert report['missing_links'] == [], report

          bad = []
          for p in sorted(root.rglob('*.md')):
              data = p.read_bytes()
              controls = sorted({b for b in data if b < 32 and b != 10})
              if controls:
                  bad.append((str(p), controls))
              text = data.decode('utf-8')
              if not text.startswith('# '):
                  bad.append((str(p), ['missing-h1']))
          assert not bad, bad[:20]

          summary = (root / 'SUMMARY.md').read_text(encoding='utf-8')
          links = re.findall(r'\[[^\]]+\]\(([^)]+\.md)\)', summary)
          assert len(links) == 838, len(links)
          missing = [link for link in links if not (root / link).exists()]
          assert not missing, missing[:20]

          readme = (root / 'README.md').read_text(encoding='utf-8')
          assert r'F(r)=\frac{L}{4\pi r^2}' in readme
          assert r'\text{SELECT}' in readme
          assert r'T^2=\frac{4\pi^2 a^3}{\mu}' in readme
          afterword = (root / 'afterword.md').read_text(encoding='utf-8')
          assert r'\rightarrow' in afterword

          root_summary = Path('docs/SUMMARY.md').read_text(encoding='utf-8')
          assert root_summary.count('<!-- BEGIN HOW-TO-BUILD-A-DYSON-SPHERE -->') == 1
          assert root_summary.count('<!-- END HOW-TO-BUILD-A-DYSON-SPHERE -->') == 1
          assert '[How to Build a Dyson Sphere with the Chatman Ecosystem](how-to-build-a-dyson-sphere/README.md)' in root_summary

          catalog = Path('catalog/documents.toml')
          parsed = tomllib.loads(catalog.read_text(encoding='utf-8'))
          matches = [d for d in parsed.get('document', []) if d.get('id') == 'document:how-to-build-a-dyson-sphere']
          assert len(matches) == 1, matches
          assert matches[0]['path'] == 'docs/how-to-build-a-dyson-sphere/README.md'
          print(json.dumps({'status':'PASS','markdown_files':839,'summary_links':838,'chapters':104,'words':report['total_words'],'unexpected_controls':0}, indent=2))
          PYCODE

      - name: Rewrite replayable receipt
        shell: bash
        env:
          BASE_SHA: 91d8ddc26da04448dbd0c4e11d70c504c6b6dd9e
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, os, tomllib

          root = Path('docs/how-to-build-a-dyson-sphere')
          report = json.loads(Path('/tmp/dyson-book-validation.json').read_text())
          h = hashlib.sha256()
          for p in sorted(root.rglob('*.md')):
              h.update(str(p.relative_to(root)).encode('utf-8'))
              h.update(bytes([0]))
              h.update(p.read_bytes())
              h.update(bytes([0]))
          digest = h.hexdigest()
          lines = [
              'id = "receipt:dyson-sphere-book"',
              f'subject = "manuscript-sha256:{digest}"',
              f'base_commit = "{os.environ["BASE_SHA"]}"',
              'actor = "github-actions"',
              'authority = "explicit_user_request:write all md files for the book and commit the pr"',
              'intention = "manufacture the complete How to Build a Dyson Sphere with the Chatman Ecosystem mdBook manuscript"',
              'observed = [',
              '    "repository doctrine and exact base commit",',
              '    "existing nested-book convention under docs",',
              '    "admitted 27-part, 104-chapter outline",',
              '    "initial generated head contained Python escape corruption in LaTeX",',
              ']',
              'executed = [',
              '    "repaired the canonical generator to preserve LaTeX backslashes",',
              '    "regenerated the complete nested Markdown source tree",',
              '    "integrated the nested summary into docs/SUMMARY.md",',
              '    "registered the book in catalog/documents.toml",',
              ']',
              'changed = [',
              '    "docs/how-to-build-a-dyson-sphere/**",',
              '    "docs/SUMMARY.md",',
              '    "catalog/documents.toml",',
              '    "scripts/generate_dyson_sphere_book.py",',
              ']',
              'verified = [',
              f'    "{report["chapters"]} numbered chapters",',
              f'    "{report["markdown_files"]} Markdown files",',
              f'    "{report["summary_links"]} nested SUMMARY links",',
              '    "zero missing nested SUMMARY targets",',
              '    "zero unexpected C0 control characters",',
              '    "literal LaTeX fraction, text, and arrow sequences preserved",',
              '    "root SUMMARY integration marker unique",',
              '    "catalog registration parses as TOML",',
              f'    "{report["total_words"]} manuscript words",',
              ']',
              'excluded = [',
              '    "Dyson-sphere physical feasibility is not promoted to ALIVE by prose",',
              '    "root release Crown is not asserted by this documentation change",',
              '    "mdBook executable build remains a separate repository-toolchain gate",',
              ']',
              'replay = [',
              '    "python3 scripts/generate_dyson_sphere_book.py",',
              ']',
              'standing_before = "BUILD_BROKEN"',
              'standing_after = "PARTIAL_ALIVE"',
              f'timestamp = "{datetime.now(timezone.utc).isoformat()}"',
              f'digest = "sha256:{digest}"',
          ]
          text = chr(10).join(lines) + chr(10)
          receipt = Path('receipts/dyson-sphere-book.toml')
          receipt.write_text(text, encoding='utf-8')
          parsed = tomllib.loads(receipt.read_text(encoding='utf-8'))
          assert parsed['digest'] == f'sha256:{digest}'
          PYCODE

      - name: Commit repaired exact subject
        shell: bash
        run: |
          rm -f .github/workflows/repair-dyson-sphere-book.yml
          git config user.name "Sean Chatman"
          git config user.email "136349053+seanchatmangpt@users.noreply.github.com"
          git add docs/how-to-build-a-dyson-sphere docs/SUMMARY.md catalog/documents.toml \
                  scripts/generate_dyson_sphere_book.py receipts/dyson-sphere-book.toml
          git add -A .github/workflows
          git status --short
          git commit -m "repair Dyson book LaTeX generation"
          git push origin HEAD:agent/dyson-sphere-book

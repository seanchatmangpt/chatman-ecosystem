# Default-deny baseline per project namespace, plus one explicit allow rule
# permitting ingress only from platform-console (by namespaceSelector) on
# the status service's port (8080 -- see services-and-deployments.yaml).
#
# No NetworkPolicy exists anywhere on this cluster before this file
# (kubectl get networkpolicy -A confirmed only flux-system's own policies)
# -- this default-deny pattern is new, not a copy of an existing object.
#
# Known, disclosed operational caveat: policyTypes [Ingress, Egress] with
# an empty egress rule list blocks ALL egress from these namespaces,
# including DNS (kube-dns) and the Istio sidecar's control-plane traffic
# to istiod. That is exactly what was specified for this phase (a
# deny-all baseline); loosening it for DNS/istiod is deliberately left
# for a later, explicitly-scoped policy rather than added here silently.
#
# That later policy is this one: a narrow additional `*-allow-egress-dns-istiod`
# NetworkPolicy per namespace (podSelector: {}, so it applies to every pod,
# istio-proxy included), egress-only, allowing exactly:
#   - kube-dns (kube-system, podSelector k8s-app=kube-dns) on UDP/TCP 53
#   - istiod (istio-system, podSelector app=istiod) on TCP 15012 (xDS/CA) and
#     TCP 15017 (webhook)
# Nothing else is opened. The `*-default-deny` and `*-allow-from-platform-console`
# policies above are unchanged; this is additive (NetworkPolicy objects are
# ANDed within a policyType only in the sense that any one matching egress
# rule across all applicable policies allows the connection -- multiple
# Egress policies on the same pods are additive/OR'd, not replacing).

# ---------------------------------------------------------------- autofde-lab
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autofde-lab-default-deny
  namespace: autofde-lab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autofde-lab-allow-from-platform-console
  namespace: autofde-lab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-console
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  # autofde-lab-mcp (services-and-deployments.yaml) is a second real
  # Deployment in this namespace on its own port (8090); the rule above
  # only opens 8080 (autofde-lab-status). Additive rule, same scope
  # (platform-console namespace only), narrowly for this one additional
  # port -- see the rule above for why NetworkPolicy objects on the same
  # pods are additive/OR'd, not replacing.
  name: autofde-lab-allow-from-platform-console-mcp
  namespace: autofde-lab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-console
      ports:
        - protocol: TCP
          port: 8090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  # Custom Domains (lib/custom-domains.ts): a real Istio Gateway/
  # VirtualService bound to a custom hostname routes DIRECTLY from the
  # istio-ingressgateway pod (istio-system) to this namespace's status
  # Service -- a real, different network path than every other route in
  # this cluster, which all proxy through platform-console-gateway's own
  # already-allowed identity first. Without this rule, that direct path
  # is silently dropped by the default-deny baseline above (confirmed
  # live: a real custom-domain HTTPS request returned Envoy's own real
  # "upstream connect error ... connection timeout" -- the exact same CNI
  # drop signature network-segmentation's own control evidence documents
  # for a blocked cross-identity call, not a bug in the Gateway/
  # VirtualService wiring). Scoped as narrowly as the existing
  # allow-from-platform-console rule above: exactly the istio-ingress-
  # gateway pod's own identity (namespaceSelector istio-system +
  # podSelector istio=ingressgateway, the same selector istio-
  # ingressgateway's own Service already uses), same port 8080 only.
  name: autofde-lab-allow-from-istio-ingressgateway
  namespace: autofde-lab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              istio: ingressgateway
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autofde-lab-allow-egress-dns-istiod
  namespace: autofde-lab
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              app: istiod
      ports:
        - protocol: TCP
          port: 15012
        - protocol: TCP
          port: 15017


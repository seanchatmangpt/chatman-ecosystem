name: Chateco PhD Book

on:
  push:
    branches:
      - agent/chateco-phd-book
  pull_request:
    paths:
      - docs/chateco-phd/**
      - .github/workflows/chateco-phd.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chateco-phd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  book:
    name: Verify full doctoral book
    runs-on: ubuntu-latest
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ARCHIVE_SHA256: e90331785c29d0535ffad6f9e60167b671b148e609b0781fcb25f1fa36b144b4
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXACT_SHA"
          printf 'exact_subject=%s\n' "$actual"

      - name: Expand content-addressed manuscript bootstrap
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="docs/.chateco-phd-bootstrap"
          if [[ ! -d "$bootstrap" ]]; then
            echo "expanded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "${{ github.event_name }}" in
            push) target_branch="${GITHUB_REF_NAME}" ;;
            pull_request) target_branch="${GITHUB_HEAD_REF}" ;;
            *) echo "REFUSED:BOOTSTRAP_EVENT:${{ github.event_name }}" >&2; exit 1 ;;
          esac
          test "$target_branch" = "agent/chateco-phd-book"
          echo "TARGET_BRANCH=$target_branch" >> "$GITHUB_ENV"

          cat "$bootstrap"/part-* | base64 --decode > /tmp/chateco-phd-source.tar.xz
          echo "$ARCHIVE_SHA256  /tmp/chateco-phd-source.tar.xz" | sha256sum --check -

          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          archive = "/tmp/chateco-phd-source.tar.xz"
          with tarfile.open(archive, "r:xz") as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit("REFUSED:EMPTY_BOOTSTRAP_ARCHIVE")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"REFUSED:UNSAFE_ARCHIVE_PATH:{member.name}")
                  if len(path.parts) < 2 or path.parts[:2] != ("docs", "chateco-phd"):
                      raise SystemExit(f"REFUSED:OUT_OF_SCOPE_ARCHIVE_PATH:{member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"REFUSED:ARCHIVE_LINK:{member.name}")
          PY

          tar -xJf /tmp/chateco-phd-source.tar.xz
          rm -rf "$bootstrap"
          echo "expanded=true" >> "$GITHUB_OUTPUT"

      - name: Verify manuscript graph
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/chateco-phd/verify.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path("docs/chateco-phd")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["chapter_count"] == 141
          assert manifest["appendix_count"] == 26
          assert manifest["summary_target_count"] == 172
          assert manifest["base_sha"] == "495cb16e91b2ac208043e19a432d3cc477ec77aa"
          assert manifest["source_corpus_sha256"] == "3a7cbe92378c0f645f4acfbf898b5145583b2b801835e7fa5b5f0c5b398378cf"

          markdown = list((root / "src").rglob("*.md"))
          if len(markdown) != 173:
              raise SystemExit(f"expected 173 source markdown files, got {len(markdown)}")
          bad = []
          for path in markdown:
              text = path.read_text(encoding="utf-8")
              if any(ord(ch) < 32 and ch not in "\n\r\t" for ch in text):
                  bad.append(str(path))
              if re.search(r"\b(?:TODO|TBD)\b", text):
                  bad.append(str(path))
          if bad:
              raise SystemExit(f"REFUSED:MANUSCRIPT_HYGIENE:{bad[:10]}")
          print("manuscript_hygiene=PASS")
          PY

      - name: Install verified mdBook 0.5.4
        shell: bash
        run: |
          set -euo pipefail
          version="0.5.4"
          archive="mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rust-lang/mdBook/releases/download/v${version}/${archive}" \
            --output "${archive}"
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  ${archive}" | sha256sum --check -
          tar -xzf "${archive}"
          install -d "$HOME/.local/bin"
          install -m 0755 mdbook "$HOME/.local/bin/mdbook"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mdbook" --version

      - name: Build and verify rendered manuscript
        shell: bash
        run: |
          set -euo pipefail
          mdbook build docs/chateco-phd
          root="docs/chateco-phd/book"
          test -s "$root/index.html"
          test -s "$root/chapters/001-the-industrialization-of-knowledge-work.html"
          test -s "$root/chapters/028-zero-unreceipted-actuation.html"
          test -s "$root/chapters/141-final-receipt.html"
          test -s "$root/appendices/z-machine-readable-thesis-manifest.html"
          find "$root" -type f -name 'searchindex*.js' -size +0c -print -quit | grep -q .
          grep -q "The Chateco Research Program" "$root/index.html"
          grep -q "Zero Unreceipted Actuation" "$root/chapters/028-zero-unreceipted-actuation.html"
          printf 'rendered_subject=%s\n' "$(git rev-parse HEAD)"

      - name: Commit expanded manuscript source
        if: steps.bootstrap.outputs.expanded == 'true'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/chateco-phd/book
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/chateco-phd docs/.chateco-phd-bootstrap
          test -n "$(git diff --cached --name-only)"
          git commit -m "docs: expand full Chateco PhD book"
          final_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          printf 'published_subject=%s\n' "$final_sha"

      - name: Replay verifier at exact published head
        if: steps.bootstrap.outputs.expanded == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.publish.outputs.final_sha }}"
          git fetch origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          observed="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
          test "$observed" = "$expected"
          git checkout --detach "$observed"
          test "$(git rev-parse HEAD)" = "$expected"
          python3 docs/chateco-phd/verify.py
          mdbook build docs/chateco-phd
          root="docs/chateco-phd/book"
          test -s "$root/index.html"
          test -s "$root/chapters/001-the-industrialization-of-knowledge-work.html"
          test -s "$root/chapters/028-zero-unreceipted-actuation.html"
          test -s "$root/chapters/141-final-receipt.html"
          test -s "$root/appendices/z-machine-readable-thesis-manifest.html"
          find "$root" -type f -name 'searchindex*.js' -size +0c -print -quit | grep -q .
          grep -q "The Chateco Research Program" "$root/index.html"
          printf 'exact_final_head=%s\n' "$expected"

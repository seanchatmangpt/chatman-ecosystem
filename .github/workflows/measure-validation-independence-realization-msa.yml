name: MEASURE Validation Independence Realization MSA

on:
  pull_request:
    paths:
      - 'scripts/measure_train/validation_independence_realization_msa/**'
      - 'tests/measure_train/validation_independence_realization_msa/**'
      - '.github/workflows/measure-validation-independence-realization-msa.yml'

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile
        run: PYTHONPATH=. python3 -m py_compile scripts/measure_train/validation_independence_realization_msa/*.py tests/measure_train/validation_independence_realization_msa/*.py
      - name: Execute validation independence realization MSA court
        run: PYTHONPATH=. python3 -m unittest discover -s tests/measure_train/validation_independence_realization_msa -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|urllib\.request\.(Request|urlopen)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' scripts/measure_train/validation_independence_realization_msa

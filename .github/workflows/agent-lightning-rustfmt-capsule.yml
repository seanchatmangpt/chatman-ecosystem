name: Agent Lightning Rustfmt Capsule

on:
  push:
    branches: [feat/agent-lightning-commercial-runtime]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format bounded Agent Lightning Rust surface
        run: cargo fmt --all
      - name: Commit formatting when required
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- crates/ecosystem-runtime/src/agent_lightning_service.rs crates/ecosystem-runtime/src/bin/agent-lightning-commercial.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ecosystem-runtime/src/agent_lightning_service.rs crates/ecosystem-runtime/src/bin/agent-lightning-commercial.rs
          git commit -m 'style: rustfmt Agent Lightning commercial runtime'
          git push origin "HEAD:${GITHUB_REF_NAME}"

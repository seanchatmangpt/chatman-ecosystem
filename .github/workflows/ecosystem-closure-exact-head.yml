name: Ecosystem Closure Exact Head

on:
  pull_request:
    paths:
      - 'release/v26.9.24/closure.toml'
      - 'release/v26.9.24/closure-receipt.json'
      - 'scripts/release_train/ecosystem_closure/**'
      - 'tests/release_train/ecosystem_closure/**'
      - 'docs/jira/v26.9.24/CHATMAN-ECOSYSTEM-CLOSURE-COMPILER.md'
      - '.github/workflows/ecosystem-closure-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          printf 'ecosystem_closure_subject=%s\n' "$actual"
          test "$actual" = "$expected"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute closure courts
        env:
          PYTHONPATH: .
        run: >-
          python3 -m unittest discover
          -s tests/release_train/ecosystem_closure
          -p 'test_*.py'
          -v

      # Consistency, not crown: a manifest that honestly declares BLOCKED passes
      # here. Overclaim, malformation, or a stale receipt projection refuses.
      # The crown itself (scripts/crown.sh) adds --require-alive.
      - name: Compile v26.9.24 closure and replay committed receipt
        env:
          PYTHONPATH: .
        run: >-
          python3 -m scripts.release_train.ecosystem_closure
          release/v26.9.24/closure.toml
          --replay release/v26.9.24/closure-receipt.json
          --summary

      - name: Refuse ambient consequence surfaces
        shell: bash
        run: |
          set -euo pipefail
          ! grep -REn \
            'requests\.|httpx|urllib\.request|subprocess\.|os\.system|socket\.|boto3|azure\.|google\.cloud|kubectl|terraform|git push|gh pr merge' \
            scripts/release_train/ecosystem_closure \
            tests/release_train/ecosystem_closure

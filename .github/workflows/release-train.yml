name: release-train exact-head court
on:
  pull_request:
    paths:
      - "scripts/release_train/**"
      - "tests/release_train/**"
      - ".github/workflows/release-train.yml"
permissions:
  contents: read
jobs:
  release-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/release_train/*.py tests/release_train/*.py
      - name: Narrow and integration courts
        run: python -m unittest discover -s tests/release_train -p 'test_*.py' -v
      - name: Static no-DO boundary
        run: |
          ! grep -RInE 'requests\.(post|put|patch|delete)|subprocess\.|os\.system|azure|boto3|google\.cloud' scripts/release_train

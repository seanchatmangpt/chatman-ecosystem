# Additional least-privilege RBAC for platform-console's self-service PaaS
# control-plane surface (Projects / Database / GitOps / IAM modules --
# app/lib/k8s.ts). Grants only the verbs/resources actually called from
# that file -- no wildcard verbs, no wildcard resources, no pod
# exec/log/portforward. Cluster-scoped (ClusterRole + ClusterRoleBinding,
# not a per-namespace Role) because the resources these modules read/
# create -- Supabase Projects, Services, Namespaces, Flux objects,
# RBAC/NetworkPolicy objects -- can live in any namespace, not just
# platform-console's own.
#
# Bound to the existing platform-console ServiceAccount, already created
# by k8s/rbac.yaml in the platform-console namespace -- this file adds a
# grant to that identity, it does not create a new one.
#
# Auth/Storage modules (lib/gotrue.ts, lib/storage-api.ts) and the
# Observability module (lib/prometheus.ts) talk to project Services and
# the Prometheus Service directly over HTTP -- never through the
# Kubernetes API -- so they need no additional RBAC here, same reasoning
# k8s/rbac.yaml's own platform-console ServiceAccount comment already
# uses for the existing /status proxying.
#
# Secrets are handled separately, below the ClusterRoleBinding: Secrets
# are more sensitive than every resource this ClusterRole grants (a
# cluster-wide "list secrets" verb would let this console read every
# other workload's credentials on the cluster), so the Secrets Manager
# module (lib/k8s.ts's listSecrets/createSecret/deleteSecret,
# app/secrets) gets its own least-privilege Role + RoleBinding PER
# platform namespace instead -- never a ClusterRole, never kube-system or
# any namespace outside the platform's own.
#
# Pod logs are handled the same way, same reasoning: pod logs can contain
# real application output, more sensitive than the read-mostly resources
# this ClusterRole grants, so the Logs module (lib/k8s.ts's
# listPods/getPodLogs, app/app/logs) also gets its own least-privilege
# Role + RoleBinding PER platform namespace instead of a ClusterRole grant
# -- see the pods/pods-log Role+RoleBinding blocks at the bottom of this
# file. Any namespace outside that list gets a real 403 from the API
# server; the Logs module has no fallback and no synthetic log data.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-console-paas
rules:
  # Projects module: list/watch Supabase Project CRs cluster-wide for the
  # /projects list page, create for the "Create project" form. delete was
  # added for the /quickstart flow's real cleanup step
  # (deleteProject/deleteProjectWithDatabase, lib/k8s.ts) -- self-service
  # lifecycle completion (create -> read -> delete). `patch` was added for
  # the Resource Tagging module (lib/tags.ts's applyTag/removeTag): a real
  # RFC 7386 merge patch touching ONLY `metadata.labels.platform-
  # console.io/tag-<key>`, never spec -- this console still never mutates a
  # Project's spec in place.
  - apiGroups: ["core.supabase.io"]
    resources: ["projects"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  # Projects module (createProjectWithDatabase/deleteProjectWithDatabase):
  # create + delete the SingleDatabase CR paired with each Project via
  # spec.databaseRef -- same verbs, same reasoning as the projects rule
  # above.
  - apiGroups: ["core.supabase.io"]
    resources: ["singledatabases"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Database module: read Service objects (DNS name + port only, never
  # Secrets) in a project's namespace to show real connection info. `patch`
  # was added for the Resource Tagging module (lib/tags.ts's
  # applyTag/removeTag): a real RFC 7386 merge patch touching ONLY
  # `metadata.labels.platform-console.io/tag-<key>`, never spec.
  # Managed Cache (Redis) addon (lib/redis.ts): `create`/`delete` added
  # for the per-project Redis Service this module provisions/tears down,
  # mirroring the Deployment/NetworkPolicy `create`/`delete` grants added
  # in the same change below -- same sensitivity class as the existing
  # get/list/watch/patch grant on this same resource (workload metadata,
  # never Secret data).
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "patch", "create", "delete"]
  # "Create project" form's target-namespace picker. `patch` was added
  # for the Quota Enforcement module (lib/quota-enforcement.ts's
  # checkQuotaEnforcement/resetQuotaEnforcement via
  # lib/k8s.ts's patchNamespaceAnnotations): a real RFC 7386 merge patch
  # touching ONLY `metadata.annotations.platform-console.io/quota-*`,
  # never spec -- same "PATCH is metadata-only, spec is never touched by
  # this console" discipline the Resource Tagging module's own comment
  # above documents for Services.
  # `create` added for the Org/Tenant Provisioning module (lib/orgs.ts's
  # createOrg via lib/k8s.ts's createNamespace): a new paying customer's
  # self-service signup creates exactly one new Namespace per org, labeled
  # `platform-console.io/org-id=<id>` -- no other namespace-scoped write
  # verb (update/delete) is granted, matching this file's existing
  # discipline of granting only the verbs a real caller in this codebase
  # exercises. NOT YET applied to the live cluster as of this change (see
  # createNamespace's own doc comment in lib/k8s.ts) -- a real, disclosed
  # gap, not silently assumed live.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "patch", "create"]
  # GitOps module: read-only Flux Kustomization/HelmRelease status.
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  # IAM module: read-only RBAC + NetworkPolicy inventory per namespace.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  # Managed Cache (Redis) addon: `create`/`delete` added for the
  # per-project Redis NetworkPolicy this module provisions/tears down
  # (scopes ingress to only the project's own app pods, mirroring the
  # existing per-namespace network-segmentation policies in
  # k8s/network-policies.yaml) -- same resource, same sensitivity class
  # (network policy objects, not Secret data) as the existing
  # get/list/watch grant.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Registry (image inventory) module: read-only Deployment inventory, to
  # read each container's real spec.template.spec.containers[].image field.
  # Deployment specs are workload metadata, not secrets -- same
  # sensitivity class as the Services/Roles/NetworkPolicies already granted
  # cluster-wide above, so no new per-namespace Role was needed. Pod
  # containerStatuses (the image-presence cross-check) reuse the existing
  # per-namespace `platform-console-logs-reader` Role's `pods` get/list
  # grant below -- already covers exactly the same 6 platform namespaces
  # this module reads, so no additional pods grant was added either.
  # Managed Cache (Redis) addon: `create`/`delete` added for the
  # per-project Redis Deployment this module provisions/tears down --
  # same resource, same sensitivity class (workload spec, not Secret
  # data) as the existing get/list/watch grant used by the Registry
  # (image inventory) module above. Quota Enforcement module
  # (lib/quota-enforcement.ts's checkQuotaEnforcement/
  # resetQuotaEnforcement via lib/k8s.ts's patchDeploymentReplicas):
  # `patch` added for the real breach-triggered `spec.replicas` merge
  # patch that scales an operator-named target Deployment to 0 (and,
  # on an explicit operator reset, back to 1) -- cluster-wide like the
  # rest of this ClusterRole's Deployment grant, since the enforcement
  # target can be any of this platform's project namespaces, not only
  # autofde-lab (which already has its own narrower
  # platform-console-canary-autofde-lab Role's `create`/`delete` for a
  # different, canary-specific reason -- see that Role's own comment).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  # Cost & Usage module: real live per-pod CPU/memory usage
  # (metrics.k8s.io -- the same source `kubectl top pods` reads) and the
  # real per-namespace ResourceQuota object, to compute a plain
  # percentage-of-quota figure. Read-only, no billing/currency data
  # involved -- same sensitivity class as Services/Deployments/Roles
  # already granted cluster-wide above.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Plan-State Enforcement module (lib/plan-state.ts's
  # reconcilePlanState via lib/k8s.ts's patchResourceQuotaHard): `patch`
  # added for the real billing-state-triggered `spec.hard` merge patch
  # that suspends a tenant namespace's already-provisioned ResourceQuota
  # down to a near-zero ceiling (and restores it on reactivation) --
  # cluster-wide like the rest of this ClusterRole's quota grant, for the
  # same reason Quota Enforcement's Deployment-patch grant above is
  # cluster-wide (the affected namespace is any platform project
  # namespace, not one fixed one).
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "patch"]
  # Service Discovery module: read-only core/v1 Endpoints -- the real
  # backing-Pod-IP half of the DNS/service-discovery view (Services alone,
  # already granted above, only give the name/ClusterIP half). Workload
  # IPs, not secrets -- same sensitivity class as the Services/Deployments/
  # Roles already granted cluster-wide above, confirmed not already
  # covered before adding (`kubectl auth can-i list endpoints` returned a
  # real `no` prior to this rule).
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  # Network Topology module (lib/network.ts, app/network): real Node.spec.
  # podCIDR is the authoritative per-node Pod CIDR allocation (kubeadm's
  # own controller writes this, not a config-file guess) -- a cluster-
  # scoped resource, so this rule cannot be namespace-narrowed the way
  # Secrets/Logs above are. Confirmed not already covered before adding
  # (`kubectl auth can-i get nodes --as=...platform-console` returned a
  # real `no` prior to this rule). Node objects carry no Secret data;
  # same read-mostly-workload-metadata sensitivity class as Services/
  # Deployments/Roles already granted cluster-wide above -- deliberately
  # NOT combined with any kube-system-scoped grant (e.g. reading the
  # kube-apiserver Pod spec or the kubeadm-config ConfigMap to get the
  # configured --service-cluster-ip-range/serviceSubnet flag): kube-system
  # is intentionally outside every grant in this file (see the Secrets/
  # Logs section comments), so the Service CIDR is instead derived live
  # from observed Service ClusterIPs (lib/network.ts), never from a
  # kube-system read.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Data Residency & Region-Pinning Attestation module
  # (lib/data-residency-attestation.ts's storage-residency check,
  # lib/k8s.ts's listNamespacePvcs/getPersistentVolumeRegion): a real
  # attestation that an org's data actually STAYED on volumes provisioned
  # in its pinned region needs to read every PVC an org namespace holds
  # (cluster-wide GET/LIST, same reasoning as the Deployments/Services/
  # Roles grants above: orgs live in arbitrary namespaces, not just
  # platform-console's own) and, for each one's bound volume, the real
  # cluster-scoped PersistentVolume object to resolve its actual
  # `topology.kubernetes.io/region` -- same "cluster-scoped resource, this
  # rule cannot be namespace-narrowed" reasoning the Nodes rule above
  # documents. Get/list only: this module never creates, patches, or
  # deletes a PVC or PV (unlike the Backups module's namespace-scoped
  # PVC `create`, which stays in its own per-namespace Role below,
  # untouched by this cluster-wide grant).
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
  # Network Topology module, mTLS boundary half: read-only Istio
  # PeerAuthentication objects cluster-wide -- the real enforced-mTLS-mode
  # source (`STRICT`/`PERMISSIVE`/unset) the IAM module's RBAC/
  # NetworkPolicy inventory doesn't cover. Same sensitivity class as
  # NetworkPolicies/Roles already granted cluster-wide above (workload
  # security posture, not credential material); confirmed not already
  # covered before adding (`kubectl auth can-i list
  # peerauthentications.security.istio.io --as=...platform-console -A`
  # returned a real `no` prior to this rule).
  - apiGroups: ["security.istio.io"]
    resources: ["peerauthentications"]
    verbs: ["get", "list", "watch"]
  # Policy-as-Code module (lib/policy.ts, app/policy): read-only
  # ValidatingAdmissionPolicy/ValidatingAdmissionPolicyBinding inventory --
  # both are cluster-scoped resources (like Nodes/PeerAuthentications
  # above), so this cannot be namespace-narrowed. This grant is
  # deliberately get/list/watch ONLY: the app never creates, updates, or
  # deletes a ValidatingAdmissionPolicy -- that object is applied directly
  # via `kubectl apply -f k8s/admission-policy.yaml` by a cluster operator,
  # exactly the same "the app surfaces what's enforced, it doesn't
  # implement the enforcement" boundary this module's own doc comment
  # states. Confirmed not already covered before adding (`kubectl auth
  # can-i list validatingadmissionpolicies.admissionregistration.k8s.io
  # --as=system:serviceaccount:platform-console:platform-console`
  # returned a real `no` prior to this rule).
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-console-paas-binding
subjects:
  - kind: ServiceAccount
    name: platform-console
    namespace: platform-console
roleRef:
  kind: ClusterRole
  name: platform-console-paas
  apiGroup: rbac.authorization.k8s.io

# ------------------------------------------------------------- Secrets Manager
#
# One Role + RoleBinding per platform namespace -- the 4 project
# namespaces (autofde-lab, gymact, ggen, ggen-marketplace) plus
# supabase-demo. Each Role grants only get/list/create/delete on
# `secrets` in its own namespace -- no update/patch (this console only
# ever creates a Secret fresh or deletes it whole, never edits one in
# place), no watch (the /secrets page reads on demand, it does not
# stream). Never a ClusterRole: unlike the read-mostly resources in
# platform-console-paas above, Secrets can hold real credentials for
# workloads this console has nothing to do with, so scope is deliberately
# narrowed to a per-namespace allowlist instead of "any namespace".
# kube-system and every other cluster-system namespace are intentionally
# absent from this list.

# --------------------------------------------------------- autofde-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-secrets
  namespace: autofde-lab
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-console-secrets-binding
  namespace: autofde-lab
subjects:
  - kind: ServiceAccount
    name: platform-console
    namespace: platform-console
roleRef:
  kind: Role
  name: platform-console-secrets
  apiGroup: rbac.authorization.k8s.io


name: Close Dyson Sphere Book Repository State

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Seal and verify canonical receipts
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- receipt seal
          cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- receipt verify-all

      - name: Render and verify canonical projections
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- catalog validate
          cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- projection render
          cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- projection check

      - name: Execute repository tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets

      - name: Verify bounded mutation set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import subprocess
          lines = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          paths = {line[3:] for line in lines}
          allowed = {
              'receipts/dyson-sphere-book.toml',
              'views/generated/portfolio.md',
          }
          unexpected = paths - allowed
          assert not unexpected, f'unexpected mutation(s): {sorted(unexpected)}'
          assert 'receipts/dyson-sphere-book.toml' in paths, paths
          assert 'views/generated/portfolio.md' in paths, paths
          print('BOUNDED_MUTATION_SET_ALIVE', sorted(paths))
          PYCODE

      - name: Commit canonical closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sean Chatman"
          git config user.email "136349053+seanchatmangpt@users.noreply.github.com"
          git add receipts/dyson-sphere-book.toml views/generated/portfolio.md
          git rm .github/workflows/close-dyson-sphere-book.yml
          git diff --cached --check
          git commit -m "close Dyson book repository projections"
          git push origin HEAD:agent/dyson-sphere-book

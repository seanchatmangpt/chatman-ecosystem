name: Toyota Code Production System

on:
  pull_request:
    paths:
      - 'catalog/tpcs.toml'
      - 'ontology/tpcs.ttl'
      - 'scripts/tpcs_pipeline.py'
      - 'tests/test_tpcs_pipeline.py'
      - '.github/workflows/tpcs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tpcs-court:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.subject.outputs.sha }}
          persist-credentials: false

      - name: Admit exact head
        env:
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"
          test "${#SUBJECT_SHA}" -eq 40

      - name: Verify production law and falsifiers
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/tpcs_pipeline.py
          python3 scripts/tpcs_pipeline.py --self-test
          python3 -m unittest tests.test_tpcs_pipeline -v

      - name: Execute deterministic DfCM production plan
        env:
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p receipts/tpcs-ci
          cat > /tmp/tpcs-work.json <<JSON
          {
            "work_items": [
              {
                "subject": "${SUBJECT_SHA}",
                "acceptance": "python3 -m unittest tests.test_tpcs_pipeline -v",
                "authority": "CONSTRUCT",
                "work_id": "runtime",
                "value_stream": "runtime",
                "class_of_service": "standard",
                "value": 10,
                "urgency": 4,
                "evidence": 3,
                "risk": 1,
                "cost": 3,
                "cycle_time": 3
              },
              {
                "subject": "${SUBJECT_SHA}",
                "acceptance": "python3 -m unittest tests.test_tpcs_pipeline -v",
                "authority": "CONSTRUCT",
                "work_id": "evidence",
                "value_stream": "evidence",
                "class_of_service": "standard",
                "value": 3,
                "urgency": 4,
                "evidence": 10,
                "risk": 1,
                "cost": 3,
                "cycle_time": 3
              },
              {
                "subject": "${SUBJECT_SHA}",
                "acceptance": "python3 -m unittest tests.test_tpcs_pipeline -v",
                "authority": "CONSTRUCT",
                "work_id": "dominated",
                "value_stream": "runtime",
                "class_of_service": "standard",
                "value": 1,
                "urgency": 1,
                "evidence": 1,
                "risk": 9,
                "cost": 9,
                "cycle_time": 9
              }
            ]
          }
          JSON
          python3 scripts/tpcs_pipeline.py \
            --plan-file /tmp/tpcs-work.json \
            --plan-receipt receipts/tpcs-ci/plan.json > /tmp/plan-one.json
          python3 scripts/tpcs_pipeline.py \
            --plan-file /tmp/tpcs-work.json > /tmp/plan-two.json
          cmp /tmp/plan-one.json /tmp/plan-two.json
          python3 scripts/tpcs_pipeline.py \
            --metrics 480 12 0.05 10 > receipts/tpcs-ci/flow.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('receipts/tpcs-ci/plan.json').read_text())
          assert p['candidate_count'] == 3
          assert len(p['inputs']) == 3
          assert len(p['input_digest']) == 64
          assert len(p['subjects']) == 1
          assert set(p['frontier']) == {'runtime', 'evidence'}
          assert p['selected'] in p['frontier']
          assert p['selection_reversible'] is True
          assert p['irreversible_selections'] == 0
          assert p['planner_authority'] == 'SELECT'
          assert p['actuation'] is False
          PY

      - name: Manufacture chained exact-subject receipt after acceptance
        env:
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/tpcs_pipeline.py \
            --subject "${SUBJECT_SHA}" \
            --work-id tpcs-exact-head-court \
            --acceptance "python3 -m unittest tests.test_tpcs_pipeline -v" \
            --authority CONSTRUCT \
            --acceptance-passed \
            --from-plan-receipt receipts/tpcs-ci/plan.json \
            --receipt receipts/tpcs-ci/receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('receipts/tpcs-ci/plan.json').read_text())
          receipt = json.loads(Path('receipts/tpcs-ci/receipt.json').read_text())
          flow = json.loads(Path('receipts/tpcs-ci/flow.json').read_text())
          assert receipt['standing'] == 'ALIVE'
          assert receipt['acceptance_passed'] is True
          assert receipt['receipt_verified'] is True
          assert receipt['replay_match'] is True
          assert receipt['zero_unreceipted_actuation'] is True
          assert receipt['previous_receipt'] == plan['sha256']
          assert receipt['plan_digest'] == plan['sha256']
          assert receipt['plan_input_digest'] == plan['input_digest']
          assert receipt['frontier_digest'] == plan['frontier_digest']
          assert receipt['schedule_digest'] == plan['schedule_digest']
          assert flow['little_law_reconstructed_wip'] == flow['wip_items']
          PY

      - name: Preserve production receipt DAG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: tpcs-receipts-${{ steps.subject.outputs.sha }}
          path: receipts/tpcs-ci/
          if-no-files-found: error

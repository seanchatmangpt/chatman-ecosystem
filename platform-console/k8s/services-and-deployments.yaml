# ------------------------------------------------------------ platform-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-console-gateway
  namespace: platform-console
  labels:
    app: platform-console-gateway
    team: platform-team
    owner: platform-console-team
    cost-center: platform-eng
    compliance-level: internal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-console-gateway
  template:
    metadata:
      labels:
        app: platform-console-gateway
      annotations:
        # Confirmed live (this pass): with `pod-security.kubernetes.io/
        # enforce: restricted` added to platform-console (namespaces.yaml),
        # istio-injection's istio-init container (this cluster has no
        # istio-cni DaemonSet, so injection always uses the legacy
        # NET_ADMIN/NET_RAW/root init-container iptables method, never the
        # CNI plugin) is rejected outright by PodSecurity admission:
        # `container "istio-init" must not include "NET_ADMIN", "NET_RAW"`.
        # Real, reproduced-live incompatibility between this cluster's
        # Istio install and restricted, not a hypothetical -- same
        # conflict independently confirmed against autofde-lab (which
        # already carried both settings) during this pass's live
        # verification. Disabling injection per-pod here is the same
        # documented stopgap this file already used once before (see this
        # file's header comment on the network-policies.yaml DNS/istiod
        # egress fix) -- the real fix (installing istio-cni so the
        # init-container step moves out of the pod) is out of scope for a
        # namespace-label change and is disclosed here rather than
        # silently reverting the restricted enforcement.
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: platform-console
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: platform-console/console:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Explicit numeric UID: the image's `USER nextjs` (Dockerfile
            # `useradd --uid 1001`) is a non-numeric name, and the kubelet's
            # runAsNonRoot check cannot resolve /etc/passwd inside the image
            # to verify it -- it rejects with "container has runAsNonRoot
            # and image has non-numeric user" unless runAsUser is numeric.
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: AUTOFDE_LAB_STATUS_URL
              value: "http://autofde-lab-status.autofde-lab.svc.cluster.local/status"
            - name: GYMACT_STATUS_URL
              value: "http://gymact-status.gymact.svc.cluster.local/status"
            - name: GGEN_STATUS_URL
              value: "http://ggen-status.ggen.svc.cluster.local/status"
            - name: GGEN_MARKETPLACE_STATUS_URL
              value: "http://ggen-marketplace-status.ggen-marketplace.svc.cluster.local/status"
            # Identity federation (additive login path): the real GoTrue
            # (Supabase Auth) instance's user-facing REST API -- plain
            # internal Service DNS, not sensitive, same pattern as the
            # *_STATUS_URL vars above. See lib/gotrue-auth.ts.
            - name: GOTRUE_AUTH_URL
              value: "http://demo-project-auth.supabase-demo.svc.cluster.local:9999"
            # Third, distinct real auth path -- external OIDC federation
            # (lib/oidc-federation.ts) against the real, genuinely separate
            # platform-console-oidc-idp service defined below in this same
            # file. Plain internal Service DNS + a fixed, disclosed
            # redirect_uri -- same sensitivity class as GOTRUE_AUTH_URL
            # above, not a secret.
            - name: OIDC_ISSUER_URL
              value: "http://platform-console-oidc-idp.platform-console.svc.cluster.local:8081"
            - name: OIDC_CLIENT_ID
              value: "platform-console"
            - name: OIDC_REDIRECT_URI
              value: "http://platform.local/api/auth/oidc-callback"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-console-secrets
                  key: OIDC_CLIENT_SECRET
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-console-secrets
                  key: AUTH_SECRET
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: platform-console-secrets
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: platform-console-secrets
                  key: ADMIN_PASSWORD_HASH
            # Real GoTrue service-role JWT for demo-project-auth. Used both
            # by the pre-existing lib/gotrue.ts read-only admin-API proxy
            # and, new this pass, by lib/gotrue-auth.ts to auto-confirm a
            # freshly signed-up user on this specific mailer-less cluster
            # (see that file's doc comment for why). A real secret --
            # sourced from the platform-console-secrets Secret, never
            # committed to this repo in plaintext.
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-console-secrets
                  key: SUPABASE_SERVICE_ROLE_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: platform-console-gateway
  namespace: platform-console
  labels:
    app: platform-console-gateway
spec:
  selector:
    app: platform-console-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 3000

# ------------------------------------------------------- oidc-idp (third auth path)
# Real, minimal, spec-compliant OIDC provider -- a genuinely separate
# service/process/image from platform-console itself, standing in for a
# real public Google/GitHub/Microsoft OIDC provider (see
# services/oidc-idp/server.js and lib/oidc-federation.ts's module docs for
# the full "which real path, and why" reasoning). No ServiceAccount/RBAC
# needed -- this service never talks to the k8s API, only real OIDC HTTP
# endpoints of its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-console-oidc-idp
  namespace: platform-console
  labels:
    app: platform-console-oidc-idp
    team: platform-team
    owner: platform-console-team
    cost-center: platform-eng
    compliance-level: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-console-oidc-idp
  template:
    metadata:
      labels:
        app: platform-console-oidc-idp
      annotations:
        # Same real istio-init/restricted PodSecurity incompatibility as
        # platform-console-gateway above -- see that Deployment's
        # annotation comment for the full reasoning.
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oidc-idp
          image: platform-console/oidc-idp:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Same non-numeric-USER gotcha as platform-console-gateway
            # above: image's `USER oidcidp` (Dockerfile `useradd --uid
            # 1001`) needs an explicit numeric runAsUser here.
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: OIDC_IDP_ISSUER
              value: "http://platform-console-oidc-idp.platform-console.svc.cluster.local:8081"
            - name: OIDC_CLIENT_ID
              value: "platform-console"
            # Must be the exact same real redirect_uri the console's own
            # OIDC_REDIRECT_URI (this file's platform-console-gateway
            # Deployment, above) sends at /authorize and /token time -- a
            # real OIDC provider rejects any mismatch (RFC 6749 3.1.2).
            - name: OIDC_CLIENT_REDIRECT_URIS
              value: "http://platform.local/api/auth/oidc-callback"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-console-secrets
                  key: OIDC_CLIENT_SECRET
            - name: IDP_DEMO_EMAIL
              value: "demo.user@platform-eng-colima.local"
            - name: IDP_DEMO_NAME
              value: "Demo Federated User"
            - name: IDP_DEMO_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: platform-console-secrets
                  key: IDP_DEMO_PASSWORD_HASH
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: platform-console-oidc-idp
  namespace: platform-console
  labels:
    app: platform-console-oidc-idp
spec:
  selector:
    app: platform-console-oidc-idp
  ports:
    - name: http
      port: 8081
      targetPort: 8081

# One ServiceAccount + least-privilege Role + RoleBinding per project
# namespace. Each role grants get/list/watch on pods and services, scoped
# to its own namespace only -- no cluster-scoped verbs, no access to any
# other namespace. These identities are what each <project>-status
# Deployment runs as (see services-and-deployments.yaml).

# ---------------------------------------------------------------- autofde-lab
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autofde-lab-status-reader
  namespace: autofde-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autofde-lab-status-reader-role
  namespace: autofde-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autofde-lab-status-reader-binding
  namespace: autofde-lab
subjects:
  - kind: ServiceAccount
    name: autofde-lab-status-reader
    namespace: autofde-lab
roleRef:
  kind: Role
  name: autofde-lab-status-reader-role
  apiGroup: rbac.authorization.k8s.io


name: Repair and generate ecosystem repo status reports

on:
  push:
    branches:
      - agent/v26.9.1-constitutional-thesis
    paths:
      - '.github/workflows/repair-and-generate-repo-status.yml'

permissions:
  contents: write

jobs:
  repair-status:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Execute repaired embedded generator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, textwrap
          p=pathlib.Path('.github/workflows/generate-repo-status.yml')
          text=p.read_text()
          start="          python - <<'PY'\n"
          end="\n          PY\n\n      - name: Validate status corpus"
          code=text.split(start,1)[1].split(end,1)[0]
          code=textwrap.dedent(code)
          old="latest_message = (commit_info.get('message') or '').splitlines()[0]"
          new="message_lines = (commit_info.get('message') or '').splitlines()\n    latest_message = message_lines[0] if message_lines else ''"
          if old not in code:
              raise SystemExit('expected repair target not found')
          code=code.replace(old,new)
          exec(compile(code, '<repaired-status-generator>', 'exec'), {'__name__':'__main__'})
          PY

      - name: Validate status corpus
        shell: bash
        run: |
          set -euo pipefail
          test -s status/README.md
          test -s status/snapshot.json
          test "$(find status/repos -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')" -eq 17
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('status/snapshot.json').read_text())
          assert len(d['repositories']) == 17
          assert sum(d['counts'].values()) == 17
          allowed={'UNKNOWN','PARTIAL_ALIVE','ALIVE','BLOCKED','BUILD_BROKEN','UNSUPPORTED','REFUSED'}
          assert all(x['standing'] in allowed for x in d['repositories'])
          assert {x['id'] for x in d['repositories']} >= {'ggen','gymact','autofde','fdegym','chatman-ecosystem'}
          for x in d['repositories']:
              t=(pathlib.Path('status/repos')/(x['id']+'.md')).read_text()
              assert x['repository'] in t
              assert 'Next standing-changing receipt' in t
              assert '```mermaid' in t
          PY

      - name: Remove temporary generators
        shell: bash
        run: |
          rm -f .github/workflows/generate-repo-status.yml
          rm -f .github/workflows/repair-and-generate-repo-status.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit status reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatman-ecosystem-bot'
          git config user.email '136349053+seanchatmangpt@users.noreply.github.com'
          git add -A README.md status .github
          git commit -m 'add per-repo ecosystem status reports [skip ci]'
          git push origin HEAD:${{ github.ref_name }}

# ------------------------------------------------------------- gymact-kernel
#
# The real gymact FastAPI kernel (src/gymact/surfaces/fastapi.py's
# create_app() -- the actual materialize/act/verify/checkpoint DCM
# production surface), distinct from gymact-status above, which only
# re-serves a build-time facts.json snapshot and exposes no /episodes
# surface at all. platform-console's lib/gymact-kernel.ts and
# /api/gymact-kernel proxy to this Service.
#
# NOT YET APPLIED to the live cluster as of this pass: image build is
# blocked. `gymact`'s pyproject.toml depends (via `powl`) on the Rust
# crate `rustxes` (a maturin/pyo3 native extension in turn pulling in
# polars), and polars' own transitive dependency `ethnum 1.4.0` fails to
# compile against current stable rustc on linux/arm64 with a hard
# `error[E0512]: cannot transmute between types of different sizes` in
# ethnum's error.rs -- a real upstream bug in that pinned crate version,
# unrelated to any gymact/platform-console code. Confirmed real and
# working OUTSIDE a container: the identical `gymact serve` kernel runs
# correctly against the host's already-resolved `.venv` (real `/health`,
# `/providers`, `/episodes` POST -> materialize, `/episodes/{id}/verify`
# POST -> verify, `/evidence` all exercised live, real receipts/digests
# returned). Applying this Deployment as-is today would only produce a
# real, but uninformative, ImagePullBackOff (no image exists to load into
# the kind node) -- left staged, not applied, rather than deployed in a
# broken state. See services/gymact-kernel/ (if present) or the session
# notes for the exact uv.sources build-context workaround and the
# remaining rustc/ethnum blocker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gymact-kernel
  namespace: gymact
  labels:
    app: gymact-kernel
    team: platform-team
    owner: platform-console-team
    cost-center: platform-eng
    compliance-level: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gymact-kernel
  template:
    metadata:
      labels:
        app: gymact-kernel
    spec:
      containers:
        - name: gymact-kernel
          image: gymact-kernel:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1

name: Platform Console

on:
  pull_request:
    branches: [main]
    paths:
      - "platform-console/app/**"
      - ".github/workflows/platform-console.yml"
  push:
    branches: [main]
    paths:
      - "platform-console/app/**"
      - ".github/workflows/platform-console.yml"
  workflow_dispatch:

concurrency:
  group: platform-console-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: Exact-head Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-console/app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@1e60f620b9541d7c243d9a61d31e6a365e8c07c5 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform-console/app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build

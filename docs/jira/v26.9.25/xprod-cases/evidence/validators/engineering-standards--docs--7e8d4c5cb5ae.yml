name: Root standards qualification

on:
  pull_request:
    paths:
      - 'MANIFEST.json'
      - 'AGENTS.md'
      - '**/*.md'
      - 'semantic/**/*.ttl'
      - 'semantic/**/*.json'
      - 'scripts/check-semantic-standard.py'
      - 'scripts/requirements-semantic.txt'
      - 'scripts/check-docs.mjs'
      - 'scripts/package.json'
      - 'scripts/package-lock.json'
      - '.github/workflows/docs.yml'
  push:
    branches: ['**']
    paths:
      - 'MANIFEST.json'
      - 'AGENTS.md'
      - '**/*.md'
      - 'semantic/**/*.ttl'
      - 'semantic/**/*.json'
      - 'scripts/check-semantic-standard.py'
      - 'scripts/requirements-semantic.txt'
      - 'scripts/check-docs.mjs'
      - 'scripts/package.json'
      - 'scripts/package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  qualify-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install documentation check dependencies
        working-directory: scripts
        run: npm ci --no-audit --no-fund

      - name: Check documentation projections
        run: node scripts/check-docs.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install semantic qualification dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-semantic.txt

      - name: Qualify semantic root and emit receipt
        run: python scripts/check-semantic-standard.py --receipt /tmp/root-conformance.json

      - name: Upload exact-head root conformance receipt
        uses: actions/upload-artifact@v4
        with:
          name: root-conformance-${{ github.sha }}
          path: /tmp/root-conformance.json
          if-no-files-found: error
          retention-days: 30

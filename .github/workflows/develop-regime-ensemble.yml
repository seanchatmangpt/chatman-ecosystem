name: DEVELOP detector consensus exact-head court
on:
  pull_request:
    paths:
      - 'scripts/develop_train/regime_ensemble/**'
      - 'tests/develop_train/regime_ensemble/**'
      - '.github/workflows/develop-regime-ensemble.yml'
permissions:
  contents: read
jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact subject and compile
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          python3 -m compileall -q scripts/develop_train/regime_ensemble tests/develop_train/regime_ensemble
      - name: Execute permanent court
        run: PYTHONPATH=. python3 -m unittest discover -s tests/develop_train/regime_ensemble -p 'test_*.py' -v
      - name: Refuse ambient actuation imports
        run: |
          ! grep -R -E '(^|[[:space:]])(import|from)[[:space:]]+(requests|httpx|boto3|azure|google\.cloud|socket|subprocess)' scripts/develop_train/regime_ensemble

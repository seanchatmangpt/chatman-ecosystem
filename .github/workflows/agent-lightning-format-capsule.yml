name: Agent Lightning Format Capsule

on:
  push:
    branches: [feat/agent-lightning-commercial-runtime]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Canonical format bounded owned surfaces
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/ecosystem-runtime/src/agent_lightning_commercial_plane.rs
          rustfmt --edition 2024 --config skip_children=true crates/ecosystem-runtime/src/bin/agent-lightning-commercial.rs
          git diff --check -- \
            crates/ecosystem-runtime/src/agent_lightning_commercial_plane.rs \
            crates/ecosystem-runtime/src/bin/agent-lightning-commercial.rs
      - name: Commit formatter result
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            crates/ecosystem-runtime/src/agent_lightning_commercial_plane.rs \
            crates/ecosystem-runtime/src/bin/agent-lightning-commercial.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/ecosystem-runtime/src/agent_lightning_commercial_plane.rs \
            crates/ecosystem-runtime/src/bin/agent-lightning-commercial.rs
          git commit -m 'style: format Agent Lightning commercial plane'
          git push origin "HEAD:${GITHUB_REF_NAME}"

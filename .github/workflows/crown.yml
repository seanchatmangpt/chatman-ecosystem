name: Crown Admission

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: crown-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  fast:
    name: Fast constitutional gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: crown-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- catalog validate
      - run: cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- architecture check
      - run: cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- projection check

  policy:
    name: Dependency license and source policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-deny
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-machete
      - run: cargo deny check
      - name: Run cargo machete on admitted workspace members
        run: |
          cargo machete \
            apps/ecosystem-cli \
            crates/ecosystem-core \
            crates/ecosystem-runtime \
            crates/gall

  test:
    name: Full behavior and negative fixtures
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: crown-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Execute v2030.1.1 definition-of-done court
        run: python3 scripts/v2030_definition_of_done.py --self-test
      - name: Run Python control-plane fixtures
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: cargo test --locked --workspace --all-features
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
      - run: cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- storage verify
      - run: cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- receipt verify-all
      - name: Build exact-head candidate
        run: cargo build --locked --release -p ecosystem-cli --bin ecosystem
      - name: Stage exact-head candidate artifact
        run: |
          set -euo pipefail
          rm -rf target/crown-artifact
          mkdir -p target/crown-artifact/receipts
          cp target/release/ecosystem target/crown-artifact/ecosystem
          cp target/crown/receipts/*.toml target/crown-artifact/receipts/
          cat > target/crown-artifact/build-manifest.json <<JSON
          {
            "source_sha": "${CANDIDATE_SHA}",
            "toolchain": "$(rustc --version)",
            "target": "$(rustc -vV | sed -n 's/^host: //p')",
            "cargo_lock_sha256": "$(sha256sum Cargo.lock | awk '{print $1}')",
            "binary_sha256": "$(sha256sum target/crown-artifact/ecosystem | awk '{print $1}')"
          }
          JSON
          cat target/crown-artifact/build-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crown-candidate-${{ env.CANDIDATE_SHA }}
          path: target/crown-artifact/
          if-no-files-found: error

  cold-cache:
    name: Cold-cache correctness
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
      - run: ./scripts/cold-cache.sh

  github-read:
    name: Exact-head GitHub connector smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Read repository and exact head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set -euo pipefail
          repo_json="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${REPOSITORY}")"
          test "$(jq -r '.full_name' <<<"${repo_json}")" = "${REPOSITORY}"
          commit_json="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${REPOSITORY}/commits/${EXPECTED_SHA}")"
          test "$(jq -r '.sha' <<<"${commit_json}")" = "${EXPECTED_SHA}"

  crown:
    name: CHATMAN ECOSYSTEM CROWN
    runs-on: ubuntu-latest
    needs: [policy, test, cold-cache, github-read]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: crown-candidate-${{ env.CANDIDATE_SHA }}
          path: admitted-artifact
      - name: Verify exact-head candidate artifact
        run: |
          set -euo pipefail
          manifest=admitted-artifact/build-manifest.json
          test "$(jq -r '.source_sha' "${manifest}")" = "${CANDIDATE_SHA}"
          test "$(jq -r '.cargo_lock_sha256' "${manifest}")" = "$(sha256sum Cargo.lock | awk '{print $1}')"
          test "$(jq -r '.binary_sha256' "${manifest}")" = "$(sha256sum admitted-artifact/ecosystem | awk '{print $1}')"
          test -s admitted-artifact/receipts/bootstrap.toml
      - name: Record exact admission evidence
        run: |
          set -euo pipefail
          mkdir -p target/crown
          cat > target/crown/admission.json <<JSON
          {
            "subject": "git:${CANDIDATE_SHA}",
            "gates": [
              "format",
              "clippy",
              "tests",
              "rustdoc",
              "dependency_policy",
              "catalog",
              "receipts",
              "projection",
              "architecture",
              "storage_differential",
              "v2030_definition_of_done",
              "cold_cache",
              "github_read",
              "artifact_transfer"
            ]
          }
          JSON
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          save-if: false
          shared-key: crown-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - env:
          ECOSYSTEM_SUBJECT_SHA: ${{ env.CANDIDATE_SHA }}
        run: cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- crown --json | tee crown-report.json
      - env:
          ECOSYSTEM_SUBJECT_SHA: ${{ env.CANDIDATE_SHA }}
        run: cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- crown --verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crown-report-${{ env.CANDIDATE_SHA }}
          path: crown-report.json
          if-no-files-found: error

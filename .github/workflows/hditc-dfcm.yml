name: HDITC DfCM runtime

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/hditc/**"
      - "docs/HDITC-DFCM-RUNTIME.md"
      - ".github/workflows/hditc-dfcm.yml"

permissions:
  contents: read

concurrency:
  group: hditc-dfcm-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Exact subject identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git rev-parse HEAD

      - name: Toolchain identity
        run: |
          rustc --version
          cargo --version

      - name: Admit locked workspace
        run: cargo metadata --locked --format-version 1 >/dev/null

      - name: Verify clean source before execution
        shell: bash
        run: test -z "$(git status --porcelain -- Cargo.lock crates/hditc)"

      - name: Verify HDITC formatting
        run: cargo fmt --package hditc -- --check

      - name: Compile and execute HDITC falsifiers
        run: cargo test -p hditc --all-targets --locked

      - name: Clippy HDITC crate
        run: cargo clippy -p hditc --all-targets --locked -- -D warnings

      - name: Verify execution did not mutate admitted source
        shell: bash
        run: test -z "$(git status --porcelain -- Cargo.lock crates/hditc)"

name: DEVELOP Realized Feedback Exact Head

on:
  pull_request:
    paths:
      - "scripts/develop_train/realized_feedback_controller/**"
      - "tests/develop_train/realized_feedback_controller/**"
      - ".github/workflows/develop-realized-feedback-exact-head.yml"

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile exact authored capsule
        run: python3 -m compileall -q scripts/develop_train/realized_feedback_controller tests/develop_train/realized_feedback_controller
      - name: Execute permanent feedback court
        run: PYTHONPATH=. python3 -m unittest discover -s tests/develop_train/realized_feedback_controller -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation imports
        run: "! grep -REn 'requests\\.(post|put|patch|delete)|httpx|boto3|azure\\.|google\\.cloud|socket|subprocess|os\\.system' scripts/develop_train/realized_feedback_controller"

# Residue ledger of the topology guard (scripts/topology_guard.py; tests/test_topology_guard.py).
#
# Law: repository topology is transport, never ontology. No committed executable, source, config,
# court, query, ontology or test file names a shadow checkout or runs git's worktree-add subcommand.
# A row below admits the hits inside a file that ANOTHER owner pins, and only while the pin holds:
#   sha256-pin  the file's sha256 is named in pin_file (the bytes are the pinned bytes)
#   vendored    the file is unmodified at HEAD and its pack's HEAD tree equals the VENDOR.toml tree
#   snapshot    the file is unmodified at HEAD, lies under snapshot_root, and writer still writes it
# `hits` is the exact number of hit lines under the row: fewer means lower the row, more means a new
# reference entered a foreign copy; a row with no hit is stale and refused. Each row names the owner
# and the edge that removes it. The ledger only shrinks; chatman-owned files never get a row.

[[residue]]
id = "xaas-fleet-classification-import"
kind = "sha256-pin"
paths = ["release/v26.9.23/imports/fleet-classification.ttl"]
pin_file = "release/v26.9.23/release.ttl"
hits = 6
owner = "seanchatmangpt/xaas docs/sjira/v26.9.23/fleet/classification.ttl, byte-copied at the pinned xaas commit (release.ttl er:classificationSource; CE23-1 clause I1 refuses divergence)"
edge = "xaas rewrites the six sj:classificationReason / sj:evidence literals that name its shadow integration checkouts to the canonical checkout and branch; this subject then re-pins er:classificationSource, re-copies the import, deletes ggen.lock and the stale out/ files and re-syncs. Until then these are RDF evidence literals of the frozen S23 classification, not paths any court opens."


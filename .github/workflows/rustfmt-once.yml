name: Rustfmt Once

on:
  push:
    branches: [agent/crown-completion]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'apply rustfmt 1.97.1') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/crown-completion
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit mechanical formatting
        run: |
          set -euo pipefail
          if git diff --quiet -- apps crates; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'chatman-ecosystem-governor'
          git config user.email '136349053+seanchatmangpt@users.noreply.github.com'
          git add apps crates
          git commit -m 'apply rustfmt 1.97.1'
          git push origin HEAD:agent/crown-completion

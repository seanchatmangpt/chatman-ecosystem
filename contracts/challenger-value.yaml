version: challenger-value/1
purpose: evidence-bounded Challenger commercial projection
commercial_invariant:
  canonical_evidence_is_not_mutated_by_tailoring: true
  observed_fact_may_not_be_manufactured: true
  inferred_claim_must_remain_labeled: true
  hypothesis_must_remain_labeled: true
  customer_outcome_requires_verified_evidence: true
  metric_requires_source: true
  alive_requires_standing_evidence: true
  proof_requires_exact_subject: true
  message_arc_does_not_satisfy_revenue_process: true
challenger:
  message_arc:
    phases: [TEACH, REFRAME, RATIONAL_IMPACT, NEW_WAY, PROOF, TAKE_CONTROL]
    scope: pre-engagement-evidence-presentation
  revenue_process:
    phases: [TEACH, TAILOR, TAKE_CONTROL, DIAGNOSE, QUANTIFY, PROVE]
    scope: engagement-to-customer-value
    strategy_subject: 3676b63f1f8c686dfdb4e6846d8fd956bc94e5cc
  semantic_distinction:
    PROOF: exact evidence used to support a commercial message
    PROVE: customer-specific falsifiable enterprise proof after diagnosis and quantification
    message_TAKE_CONTROL: diagnostic intent that begins a bounded next step
    revenue_TAKE_CONTROL: transition from interest into an admitted assessment or proof process
  proof_evidence_kind: VERIFIED
  take_control_is_diagnostic_intent_only: true
dfcm:
  enumerate_bounded_narrative_candidates: true
  candidate_bound: 4096
  pareto_dimensions: [evidence_density, buyer_relevance, falsifiability, materiality, claim_risk]
  preserve_nondominated_frontier: true
  irreversible_selections: 0
authority:
  SELECT: reversible-presentation
  CONSTRUCT: brief-only
  DO: none
  actuation: false
buyers:
  - cio-cto
  - ciso
  - cfo
  - platform
  - fortune5-buyer
  - hiring-manager
refusals:
  - UNSUPPORTED_CLAIM
  - PROOF_WITHOUT_SOURCE
  - PROOF_WITHOUT_EXACT_SUBJECT
  - METRIC_WITHOUT_SOURCE
  - ALIVE_WITHOUT_STANDING
  - OUTCOME_AS_FACT
  - UNSUPPORTED_AUDIENCE
  - DUPLICATE_CLAIM_ID
  - CANDIDATE_BOUND_EXCEEDED
  - EMPTY_FRONTIER
receipts:
  canonical_json_digest: sha256
  binds: [protocol, audience, candidate_frontier, recommendation, brief, authority]
  deterministic_replay_required: true

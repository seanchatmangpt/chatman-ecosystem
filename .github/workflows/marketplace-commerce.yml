name: Marketplace Commerce

on:
  push:
    branches: [main]
    paths:
      - 'crates/ecosystem-runtime/src/commerce.rs'
      - 'crates/ecosystem-runtime/src/bin/marketplace-commerce.rs'
      - 'platform-console/app/lib/marketplace-runtime.ts'
      - 'platform-console/app/app/api/marketplace/**'
      - 'platform-console/app/middleware.ts'
      - 'ontology/marketplace-commerce*.ttl'
      - 'schemas/marketplace-commerce.schema.json'
      - 'docs/MARKETPLACE-COMMERCE.md'
      - 'scripts/crown.sh'
      - '.github/workflows/marketplace-commerce.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/ecosystem-runtime/src/commerce.rs'
      - 'crates/ecosystem-runtime/src/bin/marketplace-commerce.rs'
      - 'platform-console/app/lib/marketplace-runtime.ts'
      - 'platform-console/app/app/api/marketplace/**'
      - 'platform-console/app/middleware.ts'
      - 'ontology/marketplace-commerce*.ttl'
      - 'schemas/marketplace-commerce.schema.json'
      - 'docs/MARKETPLACE-COMMERCE.md'
      - 'scripts/crown.sh'
      - '.github/workflows/marketplace-commerce.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Commercial standing fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Assert exact subject
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p ecosystem-runtime --bin marketplace-commerce -- -D warnings
      - run: cargo test --locked -p ecosystem-runtime --bin marketplace-commerce
      - name: Execute provider commerce fixtures
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p ecosystem-runtime --bin marketplace-commerce -- verify-fixtures | tee marketplace-commerce-report.json
          test "$(python3 -c 'import json; print(json.load(open("marketplace-commerce-report.json"))["standing"])')" = "PARTIAL_ALIVE"
          test "$(python3 -c 'import json; print(len(json.load(open("marketplace-commerce-report.json"))["providers_verified"]))')" = "3"
      - name: Validate normalized-observation schema JSON
        run: python3 -m json.tool schemas/marketplace-commerce.schema.json >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform-console/app/package-lock.json
      - name: Typecheck operational marketplace rail
        working-directory: platform-console/app
        run: |
          npm ci
          npx tsc --noEmit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marketplace-commerce-${{ env.CANDIDATE_SHA }}
          path: marketplace-commerce-report.json
          if-no-files-found: error

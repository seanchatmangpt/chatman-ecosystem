owner = "repository:chatman-ecosystem"
retirement_state = "FORMALIZATION_CANDIDATE"
frequency = 5
llm_cost = 4
reuse = 4
formalizability = 3
score_basis = "ESTIMATED"
prior_art = ["ggen ontology projection", "ggen-marketplace packs", "xaas and ggen_igniter handwritten ledgers"]
admitted_domain = "rows under HANDWRITTEN.md '## Active', each already naming its missing capability and intended owner pack"
notes = "The ledger already names the generator gap per row; the next step is clustering rows into shared packs (N rows -> k transformations)."

[[edge]]

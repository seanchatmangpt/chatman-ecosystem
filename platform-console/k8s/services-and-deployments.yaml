# Deployment + Service for each of the 4 status services (1 replica each)
# and the Next.js console (2 replicas). Images are locally built and
# kind-loaded (`kind load docker-image ... --name platform-eng-colima`),
# not pulled from a registry -- imagePullPolicy: IfNotPresent throughout.
# Status container port is 8080 everywhere (app.py: PORT env, default
# 8080 -- see services/<project>/app.py and Dockerfile). Console container
# port is 3000 (Next.js standalone server -- see app/Dockerfile).
#
# platform-console's env vars for the 4 backend URLs use the same
# <project>-status.<project>.svc.cluster.local convention that
# lib/status.ts already defaults to, so setting them here is redundant
# with the code's own defaults but explicit per the task's ask.
#
# AUTH_SECRET / ADMIN_USERNAME / ADMIN_PASSWORD_HASH / SUPABASE_SERVICE_ROLE_KEY
# are sourced from a Secret named platform-console-secrets that is NOT
# created by any file in this k8s/ directory (no plaintext secret belongs
# in checked-in YAML). Before applying this Deployment, create it once,
# e.g.:
#   kubectl create secret generic platform-console-secrets \
#     -n platform-console \
#     --from-literal=AUTH_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=ADMIN_USERNAME=admin \
#     --from-literal=ADMIN_PASSWORD_HASH='<bcrypt hash from data/plans.ts prep>' \
#     --from-literal=SUPABASE_SERVICE_ROLE_KEY='<demo-project-jwt Secret's service-key, supabase-demo namespace>' \
#     --from-literal=OIDC_CLIENT_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=IDP_DEMO_PASSWORD_HASH='<bcrypt hash of the oidc-idp demo account's password>'
# OIDC_CLIENT_SECRET is shared, byte-for-byte, between the console
# Deployment below (the RP, lib/oidc-federation.ts) and the
# platform-console-oidc-idp Deployment (the real, separate OIDC provider,
# services/oidc-idp) -- the same client_secret_basic credential both sides
# of a real OAuth2 client registration always share. IDP_DEMO_PASSWORD_HASH
# is consumed only by platform-console-oidc-idp itself (the third auth
# path's one seeded demo end user -- see services/oidc-idp/server.js).
# SUPABASE_SERVICE_ROLE_KEY is the real GoTrue service-role JWT for
# demo-project-auth (already exists in this cluster as the `service-key`
# key of Secret demo-project-jwt in namespace supabase-demo -- this command
# copies it into platform-console's own Secret rather than referencing
# another namespace's Secret directly, since a Pod's env can only pull
# secretKeyRef from a Secret in its own namespace).
#
# Deployment-level labels (team/owner/cost-center/compliance-level) satisfy
# the cluster's existing Gatekeeper constraints (k8srequirelabels
# require-labels and require-compliance-labels -- both currently
# enforcementAction: dryrun, confirmed via `kubectl get constrainttemplates`
# / `kubectl get k8srequirelabels -o yaml`), so these manifests pass real
# cluster policy rather than merely being unblocked by dry-run mode.
# Known, disclosed exception: `k8srestrictimageregistries` only allows
# gcr.io/, registry.example.com/, quay.io/my-org/ -- these images
# (platform-console/*, kind-loaded, no registry) do not match any of
# those prefixes and will show as a dryrun violation. That policy is also
# dryrun-only (non-blocking) and the task explicitly specified
# kind-loaded local images over a registry, so this is named here rather
# than silently worked around.
#
# Pod-level `sidecar.istio.io/inject: "false"` annotation -- REMOVED, then
# RESTORED for autofde-lab-status specifically.
# History: these 5 namespaces carry `istio-injection: enabled`
# (namespaces.yaml), but network-policies.yaml's default-deny Egress
# (deliberately, per its own header comment, including DNS/istiod) meant
# an injected istio-proxy could never resolve or reach istiod -- the
# sidecar's startup probe on :15021/healthz/ready failed forever and the
# pod never left Init:1/2 (confirmed live). Injection was disabled at the
# pod template level as a stopgap so the plain containers could start.
#
# Fix: network-policies.yaml now carries a narrow, additional
# `*-allow-egress-dns-istiod` Egress policy per project namespace
# (kube-dns UDP/TCP 53, istiod TCP 15012/15017 -- nothing else), applied
# alongside the unchanged default-deny + allow-from-platform-console
# policies. With that egress path open, injection is re-enabled here by
# removing the annotation -- `istio-injection: enabled` at the namespace
# level is no longer overridden per-pod, so the mutating webhook injects
# istio-proxy normally on the next pod recreation (`kubectl rollout
# restart`).
#
# Second incident (autofde-lab namespace only, after
# `pod-security.kubernetes.io/enforce: restricted` was applied to it --
# see namespaces.yaml): this cluster's Istio install has no istio-cni
# DaemonSet, so injection falls back to the legacy `istio-init` init
# container (a privileged NET_ADMIN/NET_RAW iptables container), which
# PodSecurity `restricted` rejects outright -- the pod's init container
# never got past admission, blocking the whole Deployment. Fixed live via
# `kubectl patch`: re-added `sidecar.istio.io/inject: "false"` to this
# Deployment's pod template only (the other 3 project-status Deployments
# above/below are unaffected -- their namespaces are not `restricted`),
# plus an explicit PodSecurity-`restricted`-compatible container
# `securityContext` (runAsNonRoot, numeric runAsUser, seccompProfile
# RuntimeDefault, allowPrivilegeEscalation: false, capabilities: drop
# [ALL]) so the plain container itself also satisfies `restricted`
# without relying on any cluster/namespace-level default. Backported here
# from the live object (`kubectl get deployment autofde-lab-status -n
# autofde-lab -o yaml`) so `kubectl apply` doesn't regress the namespace.

# ---------------------------------------------------------------- autofde-lab
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autofde-lab-status
  namespace: autofde-lab
  labels:
    app: autofde-lab-status
    team: platform-team
    owner: platform-console-team
    cost-center: platform-eng
    compliance-level: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autofde-lab-status
  template:
    metadata:
      annotations:
        # See the "Second incident" comment above the Deployment header --
        # PodSecurity `restricted` (namespaces.yaml) rejects this cluster's
        # legacy istio-init sidecar (no istio-cni DaemonSet installed), so
        # injection is disabled for this Deployment specifically.
        sidecar.istio.io/inject: "false"
      labels:
        app: autofde-lab-status
        # Canary/stable subset label -- see k8s/canary.yaml's
        # DestinationRule, which defines the `stable` subset as exactly
        # this label. The Service selector below stays scoped to `app`
        # only (unchanged), so it keeps matching both this Deployment's
        # pods AND autofde-lab-status-canary's pods; Istio's
        # DestinationRule/VirtualService pair is what actually splits
        # traffic between the two `version` values, not the Service.
        version: stable
    spec:
      serviceAccountName: autofde-lab-status-reader
      containers:
        - name: autofde-lab-status
          image: platform-console/autofde-lab-status:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # Feature Flags live-toggle proof (app.py's module docstring):
            # explicit here per the task's ask, redundant with app.py's
            # own defaults (see services/autofde-lab/Dockerfile).
            - name: FEATURE_FLAGS_NAMESPACE
              value: "platform-console"
            - name: FEATURE_FLAGS_CONFIGMAP
              value: "platform-feature-flags"
            # Real runtime canary marker (app.py's "Canary marker" doc
            # section) -- explicit here, redundant with the image's own
            # ENV CANARY_VERSION=stable default, same "explicit per the
            # task's ask" convention as the two vars above.
            - name: CANARY_VERSION
              value: "stable"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            # PodSecurity `restricted` (namespaces.yaml: autofde-lab
            # carries pod-security.kubernetes.io/enforce: restricted) --
            # backported from the live `kubectl patch` fix. See "Second
            # incident" comment above.
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: autofde-lab-status
  namespace: autofde-lab
  labels:
    app: autofde-lab-status
spec:
  selector:
    app: autofde-lab-status
  ports:
    - name: http
      port: 80
      targetPort: 8080

# ------------------------------------------------------------ autofde-lab-mcp
# Real second Deployment in the autofde-lab namespace, alongside (not
# replacing) autofde-lab-status above. That Deployment serves the
# build-time-baked facts.json stub; this one runs the actual autofde_lab
# package's OpenClaw MCP bridge (services/autofde-lab-mcp -- real
# catalog()/execute() dispatch over HTTP, see that directory's
# Dockerfile/openclaw_http.py for how the image is built and verified
# live: healthz + tools/list + a real 31-domain/57-solver
# tools/call(autofde_lab_catalog) response). lib/openclaw.ts is the
# first platform-console caller reaching this real surface.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autofde-lab-mcp
  namespace: autofde-lab
  labels:
    app: autofde-lab-mcp
    team: platform-team
    owner: platform-console-team
    cost-center: platform-eng
    compliance-level: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autofde-lab-mcp
  template:
    metadata:
      annotations:
        # Same "Second incident" rationale as autofde-lab-status above --
        # autofde-lab carries PodSecurity `restricted` (namespaces.yaml)
        # and this cluster's Istio install has no istio-cni DaemonSet, so
        # the legacy istio-init sidecar (privileged NET_ADMIN/NET_RAW)
        # would be rejected by admission. Disabled here up front rather
        # than discovered live a second time.
        sidecar.istio.io/inject: "false"
      labels:
        app: autofde-lab-mcp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: autofde-lab-mcp
          image: platform-console/autofde-lab-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          env:
            - name: PORT
              value: "8090"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: autofde-lab-mcp
  namespace: autofde-lab
  labels:
    app: autofde-lab-mcp
spec:
  selector:
    app: autofde-lab-mcp
  ports:
    - name: http
      port: 80
      targetPort: 8090


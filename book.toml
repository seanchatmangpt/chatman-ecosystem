[book]
title = "The Chatman Ecosystem"
authors = ["Sean Chatman"]
description = "A constitutional software manufacturing system for admitted observation, deterministic manufacture, bounded authority, receipts, replay, process intelligence, and evidence-backed standing."
language = "en"
multilingual = false
src = "docs"

[build]
build-dir = "book"
create-missing = false

[output.html]
site-url = "/chatman-ecosystem/"
git-repository-url = "https://github.com/seanchatmangpt/chatman-ecosystem"
edit-url-template = "https://github.com/seanchatmangpt/chatman-ecosystem/edit/main/docs/{path}"
mathjax-support = true
additional-css = ["theme/chatman.css"]
additional-js = ["theme/mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

# ------------------------------------------------------- Database Backups
#
# One Role + RoleBinding, supabase-demo only -- the Backups module
# (lib/k8s.ts's listJobs/ensureBackupsPvc/createBackupJob, app/projects/[name]/backups)
# only ever targets the real demo-db-postgres StatefulSet in
# supabase-demo, so unlike Secrets/Logs above this is not replicated
# across all platform namespaces. Grants only get/list/create on
# batch/jobs (the on-demand pg_dump Job) and persistentvolumeclaims (the
# platform-backups-pvc the Job writes its dump into) -- no update/patch/
# delete on either: a Job or PVC created wrong is left for a human with
# real kubectl access to clean up, never silently patched by this
# console. No pods verb is granted here -- creating a Job does not require
# it (the Job controller, running as kube-controller-manager's own
# identity, creates the backing Pod, not this ServiceAccount); the one
# `pods` read this module does perform (reading the source Postgres Pod's
# own spec/env to avoid re-typing its image/credential) reuses the
# already-granted per-namespace `platform-console-logs-reader` Role's
# `pods` get/list verb in supabase-demo, so no additional pods grant was
# added here either.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-backups
  namespace: supabase-demo
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-console-backups-binding
  namespace: supabase-demo
subjects:
  - kind: ServiceAccount
    name: platform-console
    namespace: platform-console
roleRef:
  kind: Role
  name: platform-console-backups
  apiGroup: rbac.authorization.k8s.io

# ------------------------------------------------------------ Feature Flags
#
# Real hyperscaler-PaaS-style Feature Flags primitive (AWS AppConfig /
# LaunchDarkly / GCP Feature Flags equivalent), backed by a single real
# k8s ConfigMap (`platform-feature-flags`) in platform-console's own
# namespace -- no external SaaS dependency. Two separate least-privilege
# grants, same "narrower than the read-mostly ClusterRole above" reasoning
# already used for Secrets/Logs/Backups above:
#
# 1. The console's own ServiceAccount gets get/list/create/update on
#    `configmaps`, scoped to ONLY the platform-console namespace -- never
#    cluster-wide (a cluster-wide configmaps grant would let this console
#    read every other workload's ConfigMaps across every namespace, many
#    of which hold non-secret-but-still-sensitive app config this console
#    has no business touching). No delete verb: this console only ever
#    creates platform-feature-flags once or edits its `data` map in place
#    via a real RFC 7386 JSON merge patch (lib/k8s.ts's
#    createOrUpdateConfigMap).
#
# 2. The live-toggle proof (services/autofde-lab/app.py) needs
#    autofde-lab-status's own ServiceAccount (autofde-lab-status-reader,
#    defined in autofde-lab's own namespace by k8s/rbac.yaml) to read that
#    SAME ConfigMap object living in platform-console's namespace -- a
#    ConfigMap volume mount cannot cross namespaces (a hard Kubernetes
#    constraint), so this is necessarily a real k8s API read, not a
#    mount. The Role granting this must itself live in platform-console's
#    namespace (an RBAC Role only ever authorizes access to objects in
#    its own namespace), bound via a RoleBinding also in
#    platform-console's namespace whose subject is a ServiceAccount from
#    a DIFFERENT namespace (autofde-lab) -- a normal, fully-supported RBAC
#    pattern (a RoleBinding's subjects may reference a ServiceAccount in
#    any namespace; only the Role/roleRef itself is namespace-bound).
#    Scoped to exactly one verb (`get`) and one named object
#    (`resourceNames: ["platform-feature-flags"]`) -- narrower than grant
#    1 above, since this identity has no legitimate reason to read or
#    list any other ConfigMap in platform-console's namespace. Verified
#    live before this grant existed: `kubectl exec` into the running
#    autofde-lab-status pod making a real HTTPS call to the k8s API for
#    this exact object returned a real `403 Forbidden` ("configmaps
#    \"platform-feature-flags\" is forbidden: User
#    \"system:serviceaccount:autofde-lab:autofde-lab-status-reader\"
#    cannot get resource \"configmaps\" ... in the namespace
#    \"platform-console\""), confirming both that the network path to the
#    API server was already open (no NetworkPolicy/CNI change was needed
#    -- this cluster's kindnet CNI does not enforce NetworkPolicy objects,
#    confirmed by this exact real request reaching the API server and
#    getting a real RBAC-layer 403, not a network-layer timeout) and that
#    only RBAC stood in the way -- exactly the gap this Role+RoleBinding
#    closes.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-feature-flags
  namespace: platform-console
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-console-feature-flags-binding
  namespace: platform-console
subjects:
  - kind: ServiceAccount
    name: platform-console
    namespace: platform-console
roleRef:
  kind: Role
  name: platform-console-feature-flags
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-feature-flags-reader
  namespace: platform-console
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["platform-feature-flags"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autofde-lab-status-feature-flags-binding
  namespace: platform-console
subjects:
  - kind: ServiceAccount
    name: autofde-lab-status-reader
    namespace: autofde-lab
roleRef:
  kind: Role
  name: platform-console-feature-flags-reader
  apiGroup: rbac.authorization.k8s.io
---
# -------------------------------------------------------------- API Keys
#
# Real hyperscaler-PaaS-style API key self-service (AWS IAM access keys /
# GCP service account keys / Stripe API keys equivalent), lib/api-keys.ts.
# Stored as a real k8s Secret (not a ConfigMap, unlike Feature Flags/Org
# Roles/Webhooks above) because the values are key HASHES -- sensitive
# even though one-way, same sensitivity-driven choice this file's own
# per-namespace Secrets Manager Roles above already make. Deliberately its
# own Role (not folded into platform-console-feature-flags above): that
# Role only ever grants `configmaps`, and this grant needs `secrets`
# instead -- kept as narrow, single-resource Roles throughout this
# namespace rather than one broad grant. No `delete` verb: revocation is a
# real merge-patch setting `revoked: true` on the one key's own JSON
# record (lib/api-keys.ts's revokeApiKey), never a delete of the whole
# Secret object or of a currently-unused individual key. Two rules, not
# one: Kubernetes RBAC cannot scope a `create` verb by `resourceNames` (the
# object doesn't exist yet at authorization time, so the API server always
# denies a name-scoped `create` rule) -- `create` is therefore granted
# namespace-wide the same way the per-project Secrets Manager Roles above
# already do, while the real least-privilege boundary (`get`/`patch`
# restricted to exactly this one Secret's name) is enforced on the second
# rule -- the same two-rule split real cloud IAM policies use for
# CreateSecret vs. GetSecretValue-by-ARN.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-api-keys
  namespace: platform-console
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["platform-console-api-keys"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-console-api-keys-binding
  namespace: platform-console
subjects:
  - kind: ServiceAccount
    name: platform-console
    namespace: platform-console
roleRef:
  kind: Role
  name: platform-console-api-keys
  apiGroup: rbac.authorization.k8s.io

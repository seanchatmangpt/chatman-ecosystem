# ------------------------------------------------------------------ Logs
#
# One Role + RoleBinding per platform namespace -- the 4 project
# namespaces plus supabase-demo, same as Secrets Manager above, plus
# platform-console's own namespace (so the console can show its own
# gateway pod's logs). Each Role grants only get/list on `pods` (to
# populate the pod picker) and get on `pods/log` (the log subresource
# itself) -- no exec, no portforward, no watch. Never a ClusterRole:
# pod logs can contain real application output, so scope is deliberately
# narrowed to this allowlist instead of "any namespace". kube-system and
# every other cluster-system namespace are intentionally absent.

# --------------------------------------------------------- autofde-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-logs-reader
  namespace: autofde-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-console-logs-reader-binding
  namespace: autofde-lab
subjects:
  - kind: ServiceAccount
    name: platform-console
    namespace: platform-console
roleRef:
  kind: Role
  name: platform-console-logs-reader
  apiGroup: rbac.authorization.k8s.io


# ------------------------------------------------------------ Custom Domains
#
# Real Custom Domain self-service (AWS Certificate Manager + Route53
# custom-domain binding / GCP Cloud Run custom-domain equivalent),
# lib/custom-domains.ts. Two separate, narrowly-scoped grants -- neither
# folded into the read-mostly platform-console-paas ClusterRole above,
# same "more consequential than read-mostly, so its own namespace-scoped
# Role" reasoning the Canary Traffic Control section above already uses:
#
# 1. Gateway/VirtualService management, platform-console namespace only
#    (where k8s/gateway.yaml's and k8s/mtls-gateway.yaml's own Gateway/
#    VirtualService objects already live -- this reuses that exact
#    placement, not a new namespace). get/list/watch/create/delete on
#    both resources -- unlike the existing Canary Role in autofde-lab
#    (which only ever get/update/patches ONE standing VirtualService
#    `kubectl apply` already created), this feature creates and deletes a
#    NEW Gateway+VirtualService pair per operator action, so it genuinely
#    needs create/delete here that Canary's Role does not carry. No
#    update/patch: a registered domain's objects are only ever deleted
#    and (on re-registration) recreated whole, never edited in place.
#
# 2. TLS Secret management, istio-system namespace -- a deliberate,
#    disclosed exception to every other Secrets-touching grant in this
#    file (Secrets Manager/Batch Compute above are always scoped to the
#    5 platform project namespaces, explicitly NEVER kube-system or any
#    other system namespace). This exception is unavoidable, not an
#    oversight: Istio's ingress-gateway SDS only reads a Gateway's
#    `credentialName` Secret from the gateway WORKLOAD's own namespace
#    (istio-system), never the Gateway object's namespace -- the exact
#    same constraint k8s/gateway.yaml's `platform-console-tls` and
#    k8s/mtls-gateway.yaml's `platform-backups-mtls-credential` Secrets
#    already live under. Kubernetes RBAC cannot scope get/list/delete to
#    "only Secrets this ServiceAccount itself created" (no wildcard-name
#    or label-based rule exists for those verbs) -- so this grant technically
#    also reaches the platform's OWN standing gateway credential Secrets in
#    istio-system, a real, disclosed tradeoff of this feature rather than
#    a hidden one. Mitigated at the application layer: lib/custom-domains.ts
#    only ever GETs/DELETEs Secrets it names itself
#    (`custom-domain-<slug>-tls`, deterministic from the hostname) and
#    never lists or reads Secret VALUES for any other name. No update/
#    patch: a registered domain's cert is only ever deleted and recreated
#    whole on re-registration, never rotated in place.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-custom-domains
  namespace: platform-console
rules:
  - apiGroups: ["networking.istio.io"]
    resources: ["gateways", "virtualservices"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-console-custom-domains-binding
  namespace: platform-console
subjects:
  - kind: ServiceAccount
    name: platform-console
    namespace: platform-console
roleRef:
  kind: Role
  name: platform-console-custom-domains
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-custom-domains-tls
  namespace: istio-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # "patch" added for lib/cert-lifecycle.ts's rotateCertificate -- an
    # in-place RFC 7386 merge-patch of an existing custom-domain TLS
    # Secret's tls.crt/tls.key (via lib/k8s.ts's createOrUpdateSecret),
    # deliberately never delete+recreate, so Istio SDS hot-reloads the new
    # cert with no Gateway/VirtualService object touched and no gap in
    # what credentialName resolves to. Same narrow "only Secrets this
    # feature itself created, by name" application-layer discipline
    # lib/custom-domains.ts's own get/delete calls already follow (see
    # README.md's Custom Domains section, "Disclosed RBAC scope
    # limitation").
    verbs: ["get", "list", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-console-custom-domains-tls-binding
  namespace: istio-system
subjects:
  - kind: ServiceAccount
    name: platform-console
    namespace: platform-console
roleRef:
  kind: Role
  name: platform-console-custom-domains-tls
  apiGroup: rbac.authorization.k8s.io
---
# ------------------------------------------- Org Custom Domains (cert-manager)
#
# Real per-org custom domain + TLS self-service (lib/orgs.ts's
# customDomain/customDomainStatus fields, lib/k8s.ts's
# createOrgCertificate/getCertificateStatus, POST/GET
# /api/orgs/[id]/custom-domain) -- the enterprise-tier "custom domain"
# upsell every B2B SaaS console offers, layered on top of the white-label
# branding feature above. Grants get/list/watch/create/delete on
# `cert-manager.io/v1` Certificate objects, platform-console namespace
# only (the same namespace k8s/gateway.yaml's own Gateway objects and the
# Custom Domains feature's own Gateway/VirtualService pairs above already
# live in) -- never delete/create on the ClusterIssuer itself, which is
# real cluster infrastructure this feature reads by name only
# (lib/k8s.ts's DEFAULT_CLUSTER_ISSUER_NAME), never provisions. No
# update/patch: createOrgCertificate deletes and recreates the Certificate
# CR whole on re-submission (cert-manager treats dnsNames/secretName as
# effectively immutable in practice), never edits one in place.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-org-custom-domains
  namespace: platform-console
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-console-org-custom-domains-binding
  namespace: platform-console
subjects:
  - kind: ServiceAccount
    name: platform-console
    namespace: platform-console
roleRef:
  kind: Role
  name: platform-console-org-custom-domains
  apiGroup: rbac.authorization.k8s.io
---
# ------------------------------------------------- Vulnerability Scanning
#
# Real Container Vulnerability Scanning (AWS ECR image scanning / GCP
# Artifact Registry vulnerability scanning / Azure Defender for Containers
# equivalent), lib/vuln-scan.ts. Namespace-scoped to platform-console
# only -- this module only ever creates its scan Job in the console's own
# namespace, never any project namespace. Grants get/list/create/delete on
# batch/jobs (create + delete a real Indexed Job per scan run, list/get to
# poll status) -- delete is granted here (unlike Scheduled Jobs' CronJob
# Role above, which never deletes) because each scan run's Job is
# ephemeral and torn down once its results are collected, so
# platform-console does not accumulate one completed Job per scan forever.
# No update/patch: a scan Job's spec is never edited in place, only
# created fresh and later deleted. No new `pods`/`pods/log` grant needed
# here -- the existing platform-console-logs-reader Role above (same
# namespace) already grants get/list on pods and get on pods/log, and this
# module reuses that identical read path to find the scan Job's own real
# Pods and read their real trivy output. No RBAC is needed for the scan
# pods' own hostPath mount onto the node's containerd socket either --
# that Pod is created by the Job controller's own identity
# (kube-controller-manager), not this ServiceAccount, and hostPath is a
# PodSecurity-admission concern, not an RBAC one (confirmed live before
# this Role existed: a bare test Pod with this exact hostPath volume ran
# 2/2 Ready in this namespace with no PSA rejection).
#
# Also grants write access to the admission-gate ConfigMap
# (`platform-console-vuln-denylist`, lib/vuln-scan.ts's
# syncVulnDenylist) that k8s/admission-policy.yaml's
# `platform-deployments-block-critical-cves` policy binding reads via
# `paramRef` -- this is what turns a completed scan into a live,
# continuously-enforced admission input, not just a report. Same
# create-rule-plus-resourceName-scoped-verbs split
# platform-batch-runner's ConfigMap grant above already establishes
# (RBAC cannot scope `create` by resourceName, since the object doesn't
# exist yet at that point): a separate unrestricted `create` rule, then
# `get`/`patch` narrowed to exactly this one object. No `delete`: the
# gate ConfigMap is never removed, only ever repatched to a fresh
# pattern (including the explicit "nothing blocked" sentinel) by every
# completed scan.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-vuln-scan
  namespace: platform-console
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["platform-console-vuln-denylist"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-console-vuln-scan-binding
  namespace: platform-console
subjects:
  - kind: ServiceAccount
    name: platform-console
    namespace: platform-console
roleRef:
  kind: Role
  name: platform-console-vuln-scan
  apiGroup: rbac.authorization.k8s.io
---
# ---------------------------------------------------------------- Castle
#
# One Role + RoleBinding scoped to the dedicated `castle` namespace
# (k8s/namespaces.yaml) for the Castle security-testing module
# (lib/castle.ts, app/app/castle) -- DEPLOY / RUN / SUNSET lifecycle over
# the real ~/castle CLI crate. get/list/create/delete on `batch/jobs`
# (RUN triggers one real Job per invocation, SUNSET deletes them all --
# same verb set as platform-console-vuln-scan above, one level down: a
# dedicated namespace rather than sharing platform-console's own). get/
# list on `pods` and get on `pods/log` to read a Run's own captured
# output, same shape as platform-console-logs-reader. get/list/create/
# update/patch/delete on `configmaps`, restricted to the module's own
# fixed ConfigMap name via `resourceNames` (least-privilege, same pattern
# platform-console-feature-flags-reader already established) -- this is
# where DEPLOY records what image is installed and SUNSET clears it; it
# is never used to fake or grant CASTLE "DO" authority, only to record
# this module's own deploy/sunset bookkeeping.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-castle
  namespace: castle
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["platform-castle-deployment"]
    verbs: ["get", "update", "patch", "delete"]
  # `create` cannot be restricted by `resourceNames` -- the object doesn't
  # exist yet at authorization time, so k8s RBAC docs explicitly call this
  # combination a no-op (confirmed live: the resourceNames-scoped rule
  # above alone produced a real 403 forbidden on the very first DEPLOY
  # call). A second, separate rule grants bare `create` on `configmaps`,
  # scoped only by this already-dedicated namespace -- the same
  # `create`-is-separate pattern lib/k8s.ts's Feature Flags Role and
  # platform-console-vuln-scan's own ConfigMap rule above already use.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-console-castle-binding
  namespace: castle
subjects:
  - kind: ServiceAccount
    name: platform-console
    namespace: platform-console
roleRef:
  kind: Role
  name: platform-console-castle
  apiGroup: rbac.authorization.k8s.io

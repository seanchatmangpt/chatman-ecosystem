# across all platform namespaces. Grants only get/list/create on
# batch/jobs (the on-demand pg_dump Job) and persistentvolumeclaims (the
# platform-backups-pvc the Job writes its dump into) -- no update/patch/
# delete on either: a Job or PVC created wrong is left for a human with
# real kubectl access to clean up, never silently patched by this
# console. No pods verb is granted here -- creating a Job does not require
# it (the Job controller, running as kube-controller-manager's own
# identity, creates the backing Pod, not this ServiceAccount); the one
# `pods` read this module does perform (reading the source Postgres Pod's
# own spec/env to avoid re-typing its image/credential) reuses the
# already-granted per-namespace `platform-console-logs-reader` Role's
# `pods` get/list verb in supabase-demo, so no additional pods grant was

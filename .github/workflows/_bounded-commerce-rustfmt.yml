name: bounded-commerce-rustfmt

on:
  push:
    branches:
      - fix/gymact-live-azure-authority-admission

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/gymact-live-azure-authority-admission
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format and fence changed paths
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 0 )); then
            echo "No formatting delta"
            exit 0
          fi
          allowed='^(crates/ecosystem-runtime/src/commerce\.rs|crates/ecosystem-runtime/src/bin/marketplace-commerce\.rs)$'
          for path in "${changed[@]}"; do
            if [[ ! "$path" =~ $allowed ]]; then
              echo "REFUSED:UNBOUNDED_RUSTFMT_PATH:$path" >&2
              exit 2
            fi
          done
          git diff --check
          git config user.name 'chatman-ecosystem-rustfmt'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "${changed[@]}"
          git commit -m 'style: rustfmt marketplace commerce kernel'
          git push origin HEAD:fix/gymact-live-azure-authority-admission

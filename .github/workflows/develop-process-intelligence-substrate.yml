name: DEVELOP Process Intelligence Substrate Exact Head

on:
  pull_request:
    paths:
      - "scripts/develop_train/process_intelligence_substrate/**"
      - "tests/develop_train/process_intelligence_substrate/**"
      - ".github/workflows/develop-process-intelligence-substrate.yml"

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile
        run: python3 -m compileall -q scripts/develop_train/process_intelligence_substrate tests/develop_train/process_intelligence_substrate
      - name: Execute permanent and Chicago courts
        env:
          PYTHONPATH: .
        run: python3 -m unittest discover -s tests/develop_train/process_intelligence_substrate -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|httpx|boto3|azure\.|google\.cloud|socket|subprocess|os\.system' scripts/develop_train/process_intelligence_substrate tests/develop_train/process_intelligence_substrate

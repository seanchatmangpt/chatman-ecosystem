name: bounded-projection-render

on:
  push:
    branches:
      - fix/gymact-live-azure-authority-admission

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/gymact-live-azure-authority-admission
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
      - name: Render canonical projection and fence output
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- projection render
          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 0 )); then
            echo "No projection delta"
            exit 0
          fi
          for path in "${changed[@]}"; do
            if [[ "$path" != "views/generated/portfolio.md" ]]; then
              echo "REFUSED:UNBOUNDED_PROJECTION_PATH:$path" >&2
              exit 2
            fi
          done
          cargo run --locked --quiet -p ecosystem-cli --bin ecosystem -- projection check
          git diff --check
          git config user.name 'chatman-ecosystem-projection'
          git config user.email 'actions@users.noreply.github.com'
          git add views/generated/portfolio.md
          git commit -m 'chore: regenerate canonical portfolio projection'
          git push origin HEAD:fix/gymact-live-azure-authority-admission

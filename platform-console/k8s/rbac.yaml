# ------------------------------------------------------------ platform-console
# Identity for the console Deployment's pods (mTLS/pod identity only --
# the console talks to the four /status endpoints over plain HTTP inside
# the mesh, never through the Kubernetes API, so no Role/RoleBinding is
# granted here on purpose).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-console
  namespace: platform-console

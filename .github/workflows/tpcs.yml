name: TCPS Federation Court

on:
  pull_request:
    paths:
      - 'catalog/tpcs.toml'
      - 'ontology/tpcs.ttl'
      - 'scripts/tpcs_pipeline.py'
      - 'tests/test_tpcs_pipeline.py'
      - 'receipts/tcps/**'
      - '.github/workflows/tpcs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  federation:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact ecosystem subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.subject.outputs.sha }}
          persist-credentials: false

      - name: Admit exact ecosystem head
        env:
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"
          test "${#SUBJECT_SHA}" -eq 40

      - name: Verify federation law and falsifiers
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/tpcs_pipeline.py
          python3 scripts/tpcs_pipeline.py --self-test
          python3 -m unittest tests.test_tpcs_pipeline -v

      - name: Manufacture evidence-bounded federation report
        run: |
          set -euo pipefail
          mkdir -p receipts/tpcs-ci
          runtime=0
          projection=0
          [[ -f receipts/tcps/runtime.json ]] && runtime=1
          [[ -f receipts/tcps/projection.json ]] && projection=1
          test "${runtime}" -eq "${projection}"
          if [[ "${runtime}" -eq 1 ]]; then
            python3 scripts/tpcs_pipeline.py \
              --runtime-receipt receipts/tcps/runtime.json \
              --projection-receipt receipts/tcps/projection.json \
              --out receipts/tpcs-ci/federation.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('receipts/tpcs-ci/federation.json').read_text())
          assert report['state'] == 'ALIVE'
          assert report['runtime_receipt_bound'] is True
          assert report['projection_receipt_bound'] is True
          assert report['implementation_authority'] is False
          assert report['actuation_authority'] is False
          PY
          else
            python3 scripts/tpcs_pipeline.py --out receipts/tpcs-ci/federation.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('receipts/tpcs-ci/federation.json').read_text())
          assert report['state'] == 'PARTIAL_ALIVE'
          assert report['runtime_receipt_bound'] is False
          assert report['projection_receipt_bound'] is False
          PY
          fi

      - name: Preserve federation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tpcs-federation-${{ steps.subject.outputs.sha }}
          path: receipts/tpcs-ci/federation.json
          if-no-files-found: error

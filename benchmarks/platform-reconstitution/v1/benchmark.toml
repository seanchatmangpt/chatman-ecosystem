[benchmark]
id = "platform-reconstitution-v1"
version = "1.0.0"
claim = "A single admitted semantic subject can manufacture, actuate through BRCE, receipt, delete, reconstitute, and replay an enterprise capability across heterogeneous deployment substrates without projection-owned business meaning."
scenario = "benchmarks/platform-reconstitution/v1/scenarios/regulated-claims.toml"
standing = "UNKNOWN"

[marketplace]
repository = "seanchatmangpt/ggen-marketplace"
ref = "main"
sha = "14f122414e72291a69975523601305fc346b118d"
required_packs = [
  "dfcm-full-deployment-pack",
  "domain-capability-pack",
  "fortune5-deployment-blocks-pack",
  "ggen-combinatorial-maximalism-pack",
  "mfact-pack",
  "mfw-pack",
  "praxis-core-pack",
  "shacl-projection-pack",
  "standing-ladder-pack",
]

[toolchain]
release_manifest = "release/v26.9.1/manifest.toml"

[[toolchain.components]]
id = "open-ontologies"
repository = "seanchatmangpt/open-ontologies"
ref = "main"
sha = "16d01cfcbc2a8efe2f074776fa4a4e5fe6701b99"
role = "public-ontology"

[[toolchain.components]]
id = "star-toml"
repository = "seanchatmangpt/star-toml"
ref = "main"
sha = "8395515cf8e68bfdc9edff49fb358c4f1da7c795"
role = "config-admission"

[[toolchain.components]]
id = "ggen"
repository = "seanchatmangpt/ggen"
ref = "main"
sha = "162e466d8f07d0a75a468b4441b4bc8b1aad369b"
role = "manufacture"

[[toolchain.components]]
id = "mfact"
repository = "seanchatmangpt/mfact"
ref = "main"
sha = "308384002a15b9946acbcd6f560c5819723d79dc"
role = "formal-proof"

[[toolchain.components]]
id = "mfw"
repository = "seanchatmangpt/mfw"
ref = "agent/finish-cmca-mfw"
sha = "2ecde02f9d7eaea50cfb4ea7876340c6463ac3a1"
role = "orchestration"

[[toolchain.components]]
id = "gymact"
repository = "seanchatmangpt/gymact"
ref = "feat/llmless-ggen-agents-fortune5-mna"
sha = "cf9a36fcc5b0738269809b83e3ffcad7dae0a5c4"

name: MEASURE Trace Relation Selector Realization MSA
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact pull request head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile selector realization measurement system
        run: PYTHONPATH=. python3 -m py_compile scripts/measure_train/trace_relation_selector_realization_msa/*.py tests/measure_train/trace_relation_selector_realization_msa/*.py
      - name: Execute permanent selector realization MSA court
        run: PYTHONPATH=. python3 -m unittest discover -s tests/measure_train/trace_relation_selector_realization_msa -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: "! grep -REn 'requests\\.(post|put|patch|delete)|urllib\\.request\\.(Request|urlopen)|subprocess\\.|os\\.system|boto3|azure\\.|google\\.cloud' scripts/measure_train/trace_relation_selector_realization_msa"

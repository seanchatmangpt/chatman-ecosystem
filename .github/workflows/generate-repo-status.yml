name: Generate ecosystem repo status reports

on:
  push:
    branches:
      - agent/v26.9.1-constitutional-thesis
    paths:
      - '.github/workflows/generate-repo-status.yml'

permissions:
  contents: write

jobs:
  status:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Observe ecosystem fleet and write reports
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, datetime, json, os, pathlib, tomllib, urllib.error, urllib.parse, urllib.request

          API = 'https://api.github.com'
          TOKEN = os.environ['GH_TOKEN']
          HEADERS = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {TOKEN}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'chatman-ecosystem-status-reporter',
          }

          def get(path, default=None):
              url = path if path.startswith('http') else API + path
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  if e.code in (404, 409, 422):
                      return default
                  raise

          manifest_payload = get('/repos/seanchatmangpt/chatman-ecosystem/contents/release/v26.9.1/manifest.toml?ref=agent%2Fv26.9.1-release-control-plane')
          manifest_text = base64.b64decode(manifest_payload['content']).decode()
          manifest = tomllib.loads(manifest_text)
          observed_at = datetime.datetime.now(datetime.timezone.utc).isoformat()
          prior_observed_at = manifest['release']['observed_at']

          components = [dict(c) for c in manifest['components']]
          components.append({
              'id': 'chatman-ecosystem',
              'repository': 'seanchatmangpt/chatman-ecosystem',
              'ref': 'agent/v26.9.1-constitutional-thesis',
              'role': 'constitutional-root',
              'disposition': 'REQUIRED',
              'standing': 'PARTIAL_ALIVE',
              'required': True,
              'depends_on': [],
              'sha': os.environ.get('GITHUB_SHA', ''),
          })

          out = pathlib.Path('status/repos')
          out.mkdir(parents=True, exist_ok=True)
          snapshot = []

          bad_conclusions = {'failure','cancelled','timed_out','action_required','startup_failure','stale'}

          for comp in components:
              repo = comp['repository']
              owner, name = repo.split('/', 1)
              ref = comp.get('ref') or 'main'
              meta = get(f'/repos/{owner}/{name}', {}) or {}
              refq = urllib.parse.quote(ref, safe='')
              ref_obj = get(f'/repos/{owner}/{name}/git/ref/heads/{refq}')
              current_sha = (ref_obj or {}).get('object', {}).get('sha')
              if not current_sha and ref == meta.get('default_branch'):
                  branch = get(f'/repos/{owner}/{name}/branches/{refq}')
                  current_sha = (branch or {}).get('commit', {}).get('sha')
              commit = get(f'/repos/{owner}/{name}/commits/{current_sha}', {}) if current_sha else {}
              prs = get(f'/repos/{owner}/{name}/pulls?state=open&per_page=100', []) or []
              runs_payload = get(f'/repos/{owner}/{name}/actions/runs?branch={urllib.parse.quote(ref)}&per_page=20', {}) or {}
              runs = runs_payload.get('workflow_runs', []) if isinstance(runs_payload, dict) else []
              exact_runs = [r for r in runs if r.get('head_sha') == current_sha] if current_sha else []
              exact_runs.sort(key=lambda r: r.get('run_started_at') or r.get('created_at') or '', reverse=True)
              latest_exact = exact_runs[0] if exact_runs else None

              prior = comp.get('standing', 'UNKNOWN')
              prior_sha = comp.get('executed_sha') or comp.get('sha')
              prior_receipt = comp.get('execution_receipt')
              prior_blocker = comp.get('blocker')
              same_subject = bool(current_sha and prior_sha and current_sha == prior_sha)

              standing = 'UNKNOWN'
              rationale = []
              if meta.get('disabled') or meta.get('archived'):
                  standing = 'BLOCKED'
                  rationale.append('Repository is archived or disabled.')
              elif not current_sha:
                  standing = 'BLOCKED'
                  rationale.append(f'Configured ref `{ref}` could not be resolved.')
              elif latest_exact and latest_exact.get('status') == 'completed' and latest_exact.get('conclusion') in bad_conclusions:
                  standing = 'BUILD_BROKEN'
                  rationale.append(f"Latest exact-head workflow concluded `{latest_exact.get('conclusion')}`.")
              elif same_subject and prior == 'ALIVE' and prior_receipt:
                  standing = 'ALIVE'
                  rationale.append('Current ref still equals the prior executed SHA with an admitted execution receipt.')
              elif same_subject and prior == 'BUILD_BROKEN':
                  if latest_exact and latest_exact.get('status') == 'completed' and latest_exact.get('conclusion') == 'success' and (latest_exact.get('updated_at') or '') > prior_observed_at:
                      standing = 'PARTIAL_ALIVE'
                      rationale.append('A newer exact-head CI success exists, but the previous BUILD_BROKEN semantic standing requires a fresh execution receipt before ALIVE.')
                  else:
                      standing = 'BUILD_BROKEN'
                      rationale.append('Prior exact-subject BUILD_BROKEN evidence still applies and no newer exact-head success supersedes it.')
              elif same_subject and prior == 'BLOCKED':
                  if latest_exact and latest_exact.get('status') == 'completed' and latest_exact.get('conclusion') == 'success' and (latest_exact.get('updated_at') or '') > prior_observed_at:
                      standing = 'PARTIAL_ALIVE'
                      rationale.append('A newer exact-head CI success indicates progress past the prior block, but a fresh semantic execution receipt is still required.')
                  else:
                      standing = 'BLOCKED'
                      rationale.append('Prior exact-subject external block remains the last admitted standing evidence.')
              elif latest_exact and latest_exact.get('status') == 'completed' and latest_exact.get('conclusion') == 'success':
                  standing = 'PARTIAL_ALIVE'
                  rationale.append('Exact-head CI success is observed, but generic CI is not automatically a semantic execution receipt.')
              elif latest_exact and latest_exact.get('status') in {'queued','in_progress','waiting','pending','requested'}:
                  standing = 'PARTIAL_ALIVE'
                  rationale.append('Exact-head execution is currently pending or in progress.')
              elif prior_sha and current_sha != prior_sha:
                  standing = 'PARTIAL_ALIVE'
                  rationale.append('The configured ref has advanced beyond the prior admitted/executed subject; prior standing cannot be inherited by the new head.')
              else:
                  standing = 'UNKNOWN'
                  rationale.append('Repository/ref is observable, but no exact current execution receipt establishes a stronger standing.')

              next_receipt = {
                  'ALIVE': 'Replay the exact admitted receipt periodically; if the ref advances, obtain a new exact-head receipt.',
                  'PARTIAL_ALIVE': 'Execute the narrowest exact-head semantic boundary required for this role and capture a replayable receipt.',
                  'UNKNOWN': 'Locate an existing exact-subject receipt or execute the minimum role-defining boundary to create one.',
                  'BUILD_BROKEN': 'Repair the observed exact-head failure, rerun the required execution, and capture the succeeding receipt.',
                  'BLOCKED': 'Remove or receipt the external prerequisite, then rerun the exact subject.',
                  'UNSUPPORTED': 'Implement the missing mechanism before attempting execution.',
                  'REFUSED': 'Preserve the refusal receipt; no DO is permitted for the refused candidate.',
              }[standing]

              commit_info = commit.get('commit', {}) if isinstance(commit, dict) else {}
              author_info = commit_info.get('author') or {}
              latest_message = (commit_info.get('message') or '').splitlines()[0]
              latest_date = author_info.get('date')
              open_issue_count = meta.get('open_issues_count')
              open_pr_count = len(prs)
              dependencies = comp.get('depends_on', [])

              report = []
              report.append(f'# {name} — Ecosystem Status Report')
              report.append('')
              report.append(f'> **Observed:** `{observed_at}`  ')
              report.append(f'> **Repository:** `{repo}`  ')
              report.append(f'> **Constitutional role:** `{comp.get("role", "unknown")}`  ')
              report.append(f'> **Current evidence standing:** `{standing}`')
              report.append('')
              report.append('## Executive status')
              report.append('')
              report.append('| Field | Observation |')
              report.append('|---|---|')
              report.append(f'| Required | `{str(bool(comp.get("required", True))).lower()}` |')
              report.append(f'| Disposition | `{comp.get("disposition", "REQUIRED")}` |')
              report.append(f'| Configured ref | `{ref}` |')
              report.append(f'| Current SHA | `{current_sha or "UNRESOLVED"}` |')
              report.append(f'| Prior manifest SHA | `{comp.get("sha", "none")}` |')
              report.append(f'| Prior manifest standing | `{prior}` |')
              report.append(f'| Prior execution receipt | `{prior_receipt or "none"}` |')
              report.append(f'| Default branch | `{meta.get("default_branch", "unknown")}` |')
              report.append(f'| Latest commit | `{latest_message or "unknown"}` |')
              report.append(f'| Latest commit date | `{latest_date or "unknown"}` |')
              report.append(f'| Repository pushed_at | `{meta.get("pushed_at", "unknown")}` |')
              report.append(f'| Open PRs observed | `{open_pr_count}` |')
              report.append(f'| GitHub open issues+PRs counter | `{open_issue_count if open_issue_count is not None else "unknown"}` |')
              report.append(f'| Dependencies | `{", ".join(dependencies) if dependencies else "none"}` |')
              report.append('')
              report.append('## Standing derivation')
              report.append('')
              for line in rationale:
                  report.append(f'- {line}')
              if prior_blocker:
                  report.append(f'- Prior manifest blocker: `{prior_blocker}`.')
              if prior_sha and current_sha and current_sha != prior_sha:
                  report.append(f'- **Subject drift:** prior `{prior_sha}` → current `{current_sha}`. Standing does not automatically transfer across this boundary.')
              report.append('')
              report.append('The report applies the ecosystem law: `Architecture != Execution`. A repository existing, a branch resolving, or generic CI passing does not by itself establish the role-specific `ALIVE` consequence. Exact-subject execution and a replayable receipt are the crown evidence.')
              report.append('')
              report.append('## Current execution evidence')
              report.append('')
              if latest_exact:
                  report.append(f'- Workflow: **{latest_exact.get("name") or latest_exact.get("display_title") or "unnamed"}**')
                  report.append(f'- Run ID: `{latest_exact.get("id")}`')
                  report.append(f'- Status: `{latest_exact.get("status")}`')
                  report.append(f'- Conclusion: `{latest_exact.get("conclusion")}`')
                  report.append(f'- Head SHA: `{latest_exact.get("head_sha")}`')
                  report.append(f'- Event: `{latest_exact.get("event")}`')
                  report.append(f'- Updated: `{latest_exact.get("updated_at")}`')
              else:
                  report.append('- No workflow run among the latest 20 runs on the configured ref matched the current exact SHA.')
              report.append('')
              report.append('## Open pull requests')
              report.append('')
              if prs:
                  for pr in prs[:10]:
                      report.append(f'- #{pr.get("number")} **{pr.get("title")}** — `{pr.get("head",{}).get("ref")}` → `{pr.get("base",{}).get("ref")}`; draft=`{str(pr.get("draft", False)).lower()}`; updated `{pr.get("updated_at")}`.')
                  if len(prs) > 10:
                      report.append(f'- … plus {len(prs)-10} additional open PRs in the first 100 returned by GitHub.')
              else:
                  report.append('- None observed.')
              report.append('')
              report.append('## Next standing-changing receipt')
              report.append('')
              report.append(next_receipt)
              report.append('')
              report.append('## Constitutional path')
              report.append('')
              report.append('```mermaid')
              report.append('flowchart LR')
              report.append(f'    R["{name}<br/>{comp.get("role", "role")}"] --> O["Observed ref / SHA"]')
              report.append('    O --> A{"Exact role execution receipt?"}')
              report.append('    A -->|No| P["UNKNOWN / PARTIAL / BLOCKED / BUILD_BROKEN"]')
              report.append('    A -->|Yes| X["Replay exact subject"]')
              report.append('    X -->|PASS| L["ALIVE"]')
              report.append('    X -->|FAIL| B["BUILD_BROKEN"]')
              report.append('```')
              report.append('')
              report.append('## Evidence boundary')
              report.append('')
              report.append(f'This file is an observation report for `{repo}@{ref}`. It is not an actuation receipt and cannot itself promote the component. The strongest standing shown above is derived only from exact repository/ref identity, the previous admitted fleet manifest when its subject still matches, and current GitHub execution metadata.')
              report.append('')

              (out / f'{comp["id"]}.md').write_text('\n'.join(report) + '\n')
              snapshot.append({
                  'id': comp['id'], 'repository': repo, 'role': comp.get('role'), 'ref': ref,
                  'current_sha': current_sha, 'prior_sha': comp.get('sha'), 'prior_standing': prior,
                  'standing': standing, 'prior_receipt': prior_receipt, 'blocker': prior_blocker,
                  'latest_exact_run': ({k: latest_exact.get(k) for k in ['id','name','status','conclusion','head_sha','event','updated_at']} if latest_exact else None),
                  'open_pr_count': open_pr_count, 'pushed_at': meta.get('pushed_at'),
                  'observed_at': observed_at, 'next_receipt': next_receipt,
              })

          counts = {}
          for item in snapshot:
              counts[item['standing']] = counts.get(item['standing'], 0) + 1

          index = []
          index.append('# Chatman Ecosystem — Repository Status')
          index.append('')
          index.append(f'> Fleet observed at `{observed_at}` from the v26.9.1 admitted component manifest plus live GitHub state.')
          index.append('')
          index.append('## Fleet standing')
          index.append('')
          index.append('| Standing | Repositories |')
          index.append('|---|---:|')
          for s in ['ALIVE','PARTIAL_ALIVE','UNKNOWN','BLOCKED','BUILD_BROKEN','UNSUPPORTED','REFUSED']:
              index.append(f'| `{s}` | {counts.get(s,0)} |')
          index.append('')
          index.append('## Per-repository reports')
          index.append('')
          index.append('| Repository | Role | Ref | SHA | Standing |')
          index.append('|---|---|---|---|---|')
          for item in snapshot:
              name = item['repository'].split('/')[-1]
              sha = (item['current_sha'] or 'UNRESOLVED')[:12]
              index.append(f'| [{name}](repos/{item["id"]}.md) | `{item["role"]}` | `{item["ref"]}` | `{sha}` | **{item["standing"]}** |')
          index.append('')
          index.append('## Interpretation')
          index.append('')
          index.append('These standings are conjunctive evidence states, not health scores. A prior `ALIVE` receipt is retained only while its exact executed subject remains the current subject. Head drift invalidates inheritance of execution standing. Generic current-head CI success is recorded as evidence but remains `PARTIAL_ALIVE` unless it is the admitted role-specific execution receipt.')
          index.append('')
          index.append('The release question remains: **Where is the receipt?**')
          index.append('')
          pathlib.Path('status/README.md').write_text('\n'.join(index) + '\n')
          pathlib.Path('status/snapshot.json').write_text(json.dumps({'observed_at': observed_at, 'source_manifest_observed_at': prior_observed_at, 'counts': counts, 'repositories': snapshot}, indent=2) + '\n')

          root = pathlib.Path('README.md')
          text = root.read_text()
          marker = '## Repository status\n'
          block = '\n## Repository status\n\nCurrent evidence-bounded per-repository standing is maintained in [`status/README.md`](status/README.md). The status corpus records exact refs/SHAs, prior admitted receipts, current workflow evidence, open PRs, subject drift, blockers, and the next standing-changing receipt for every v26.9.1 ecosystem repository.\n'
          if marker not in text:
              root.write_text(text.rstrip() + '\n' + block + '\n')
          PY

      - name: Validate status corpus
        shell: bash
        run: |
          set -euo pipefail
          test -s status/README.md
          test -s status/snapshot.json
          test "$(find status/repos -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')" -eq 17
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('status/snapshot.json').read_text())
          assert len(d['repositories']) == 17
          assert sum(d['counts'].values()) == 17
          allowed={'UNKNOWN','PARTIAL_ALIVE','ALIVE','BLOCKED','BUILD_BROKEN','UNSUPPORTED','REFUSED'}
          assert all(x['standing'] in allowed for x in d['repositories'])
          for x in d['repositories']:
              p=pathlib.Path('status/repos')/(x['id']+'.md')
              t=p.read_text()
              assert x['repository'] in t
              assert 'Next standing-changing receipt' in t
              assert '```mermaid' in t
          PY

      - name: Remove generator workflow
        shell: bash
        run: |
          rm -f .github/workflows/generate-repo-status.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit status reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatman-ecosystem-bot'
          git config user.email '136349053+seanchatmangpt@users.noreply.github.com'
          git add -A README.md status .github
          git commit -m 'add per-repo ecosystem status reports [skip ci]'
          git push origin HEAD:${{ github.ref_name }}

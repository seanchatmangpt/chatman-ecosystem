name: Distributional Robustness Crown Exact Head
on:
  pull_request:
    paths:
      - 'scripts/release_train/distributional_robustness_crown/**'
      - 'tests/release_train/distributional_robustness_crown/**'
      - '.github/workflows/distributional-robustness-crown-exact-head.yml'
permissions:
  contents: read
jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile
        run: python3 -m compileall -q scripts/release_train/distributional_robustness_crown tests/release_train/distributional_robustness_crown
      - name: Permanent courts
        run: PYTHONPATH=. python3 -m unittest discover -s tests/release_train/distributional_robustness_crown -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: '! grep -REn "^\\s*(import|from)\\s+(requests|httpx|boto3|azure|google\\.cloud|socket|subprocess)|requests\\.(post|put|patch|delete)|subprocess\\.|os\\.system" scripts/release_train/distributional_robustness_crown tests/release_train/distributional_robustness_crown'

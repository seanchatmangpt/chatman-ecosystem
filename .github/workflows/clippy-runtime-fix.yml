name: Clippy Runtime Repair

on:
  push:
    branches: [agent/crown-completion]

concurrency:
  group: clippy-runtime-repair-agent-crown-completion
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/crown-completion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: python tools/clippy_runtime_fix.py
      - run: cargo fmt --all
      - name: Commit repairs and remove actuator
        run: |
          set -euo pipefail
          git rm .github/workflows/clippy-runtime-fix.yml tools/clippy_runtime_fix.py
          git config user.name 'chatman-ecosystem-governor'
          git config user.email '136349053+seanchatmangpt@users.noreply.github.com'
          git add crates/ecosystem-runtime/src/lib.rs
          git commit -m 'repair runtime Clippy contracts'
          git fetch origin agent/crown-completion
          git rebase origin/agent/crown-completion
          git push origin HEAD:agent/crown-completion

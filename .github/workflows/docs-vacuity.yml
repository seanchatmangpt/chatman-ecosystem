name: Documentation Vacuity

on:
  pull_request:
    paths:
      - "docs/**"
      - "books/**"
      - "scripts/audit_doc_vacuity.py"
      - "scripts/enrich_published_pages.py"
      - "scripts/regenerate_semantic_books.py"
      - "scripts/generate_dyson_sphere_book.py"
      - "scripts/generate_hditc_book.py"
      - ".github/workflows/docs-vacuity.yml"

permissions:
  contents: read

concurrency:
  group: docs-vacuity-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0

      - name: Verify exact subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          printf 'exact_subject=%s\n' "$EXACT_SHA"

      - name: Verify zero vacuous published pages
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_doc_vacuity.py --json /tmp/doc-vacuity.json

      - name: Verify canonical regeneration is idempotent
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/regenerate_semantic_books.py
          git diff --exit-code -- docs books
          test -z "$(git status --porcelain -- docs books)"

      - name: Re-verify semantic corpus after regeneration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_doc_vacuity.py --json /tmp/doc-vacuity-after-regeneration.json

      - name: Preserve machine-readable vacuity receipts
        uses: actions/upload-artifact@v7
        with:
          name: documentation-vacuity-receipts
          path: |
            /tmp/doc-vacuity.json
            /tmp/doc-vacuity-after-regeneration.json
          if-no-files-found: error
          retention-days: 7

# ------------------------------------------------------------ Feature Flags
#
# Real hyperscaler-PaaS-style Feature Flags primitive (AWS AppConfig /
# LaunchDarkly / GCP Feature Flags equivalent), backed by a single real
# k8s ConfigMap (`platform-feature-flags`) in platform-console's own
# namespace -- no external SaaS dependency. Two separate least-privilege
# grants, same "narrower than the read-mostly ClusterRole above" reasoning
# already used for Secrets/Logs/Backups above:
#
# 1. The console's own ServiceAccount gets get/list/create/update on
#    `configmaps`, scoped to ONLY the platform-console namespace -- never
#    cluster-wide (a cluster-wide configmaps grant would let this console
#    read every other workload's ConfigMaps across every namespace, many
#    of which hold non-secret-but-still-sensitive app config this console
#    has no business touching). No delete verb: this console only ever
#    creates platform-feature-flags once or edits its `data` map in place
#    via a real RFC 7386 JSON merge patch (lib/k8s.ts's
#    createOrUpdateConfigMap).
#
# 2. The live-toggle proof (services/autofde-lab/app.py) needs
#    autofde-lab-status's own ServiceAccount (autofde-lab-status-reader,
#    defined in autofde-lab's own namespace by k8s/rbac.yaml) to read that
#    SAME ConfigMap object living in platform-console's namespace -- a
#    ConfigMap volume mount cannot cross namespaces (a hard Kubernetes
#    constraint), so this is necessarily a real k8s API read, not a
#    mount. The Role granting this must itself live in platform-console's
#    namespace (an RBAC Role only ever authorizes access to objects in
#    its own namespace), bound via a RoleBinding also in
#    platform-console's namespace whose subject is a ServiceAccount from
#    a DIFFERENT namespace (autofde-lab) -- a normal, fully-supported RBAC
#    pattern (a RoleBinding's subjects may reference a ServiceAccount in
#    any namespace; only the Role/roleRef itself is namespace-bound).
#    Scoped to exactly one verb (`get`) and one named object
#    (`resourceNames: ["platform-feature-flags"]`) -- narrower than grant
#    1 above, since this identity has no legitimate reason to read or
#    list any other ConfigMap in platform-console's namespace. Verified
#    live before this grant existed: `kubectl exec` into the running
#    autofde-lab-status pod making a real HTTPS call to the k8s API for
#    this exact object returned a real `403 Forbidden` ("configmaps
#    \"platform-feature-flags\" is forbidden: User
#    \"system:serviceaccount:autofde-lab:autofde-lab-status-reader\"
#    cannot get resource \"configmaps\" ... in the namespace
#    \"platform-console\""), confirming both that the network path to the
#    API server was already open (no NetworkPolicy/CNI change was needed
#    -- this cluster's kindnet CNI does not enforce NetworkPolicy objects,
#    confirmed by this exact real request reaching the API server and
#    getting a real RBAC-layer 403, not a network-layer timeout) and that
#    only RBAC stood in the way -- exactly the gap this Role+RoleBinding
#    closes.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-feature-flags
  namespace: platform-console
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-console-feature-flags-binding
  namespace: platform-console
subjects:
  - kind: ServiceAccount
    name: platform-console
    namespace: platform-console
roleRef:
  kind: Role
  name: platform-console-feature-flags
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-feature-flags-reader
  namespace: platform-console
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["platform-feature-flags"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autofde-lab-status-feature-flags-binding
  namespace: platform-console
subjects:
  - kind: ServiceAccount
    name: autofde-lab-status-reader
    namespace: autofde-lab
roleRef:
  kind: Role
  name: platform-console-feature-flags-reader
  apiGroup: rbac.authorization.k8s.io
---
# -------------------------------------------------------------- API Keys
#
# Real hyperscaler-PaaS-style API key self-service (AWS IAM access keys /
# GCP service account keys / Stripe API keys equivalent), lib/api-keys.ts.
# Stored as a real k8s Secret (not a ConfigMap, unlike Feature Flags/Org
# Roles/Webhooks above) because the values are key HASHES -- sensitive
# even though one-way, same sensitivity-driven choice this file's own
# per-namespace Secrets Manager Roles above already make. Deliberately its
# own Role (not folded into platform-console-feature-flags above): that
# Role only ever grants `configmaps`, and this grant needs `secrets`
# instead -- kept as narrow, single-resource Roles throughout this
# namespace rather than one broad grant. No `delete` verb: revocation is a
# real merge-patch setting `revoked: true` on the one key's own JSON
# record (lib/api-keys.ts's revokeApiKey), never a delete of the whole
# Secret object or of a currently-unused individual key. Two rules, not
# one: Kubernetes RBAC cannot scope a `create` verb by `resourceNames` (the
# object doesn't exist yet at authorization time, so the API server always
# denies a name-scoped `create` rule) -- `create` is therefore granted
# namespace-wide the same way the per-project Secrets Manager Roles above
# already do, while the real least-privilege boundary (`get`/`patch`
# restricted to exactly this one Secret's name) is enforced on the second
# rule -- the same two-rule split real cloud IAM policies use for
# CreateSecret vs. GetSecretValue-by-ARN.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-api-keys
  namespace: platform-console
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["platform-console-api-keys"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-console-api-keys-binding
  namespace: platform-console
subjects:
  - kind: ServiceAccount
    name: platform-console
    namespace: platform-console
roleRef:
  kind: Role
  name: platform-console-api-keys
  apiGroup: rbac.authorization.k8s.io
---
# services/ggen/app.py's /provision now gates on the same real
# platform-console-api-keys Secret (Bearer-API-key auth, ported byte-for-byte
# from lib/api-keys.ts) -- ggen-status-reader (the ggen namespace's own
# ServiceAccount) needs cross-namespace READ ONLY access to that one Secret.
# get-only, resourceNames-scoped -- this service never creates or rotates
# keys, only validates a presented one, so it gets none of the create/patch
# verbs platform-console's own ServiceAccount has above.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ggen-status-read-api-keys
  namespace: platform-console
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["platform-console-api-keys"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ggen-status-read-api-keys-binding
  namespace: platform-console
subjects:
  - kind: ServiceAccount
    name: ggen-status-reader
    namespace: ggen
roleRef:
  kind: Role
  name: ggen-status-read-api-keys
  apiGroup: rbac.authorization.k8s.io
---
# ------------------------------------------------------ Canary Traffic Control
#
# Real Canary/Blue-Green traffic-shifting control (k8s/canary.yaml,
# lib/canary.ts, app/deployments/canary). Deliberately its OWN
# namespace-scoped Role -- never folded into the cluster-wide
# platform-console-paas ClusterRole above -- for two reasons, same
# reasoning already used for Secrets/Logs below: (1) this grants
# `update`/`patch` on a live-traffic-routing object plus `create`/`delete`
# on Deployments, a materially more consequential capability than the
# read-mostly resources platform-console-paas grants cluster-wide, so it
# is scoped to exactly the one namespace this demo actually uses
# (autofde-lab), not every platform namespace; (2) the app-level
# `requireRole(session, "owner")` gate in app/api/deployments/canary/
# route.ts is the real per-request authorization boundary -- this RBAC
# grant only bounds what the pod's OWN ServiceAccount identity could ever
# do, the same defense-in-depth split every other mutating module in this
# file already follows.
#
# `deployments` get/list/watch is already granted cluster-wide by
# platform-console-paas above -- not repeated here, RBAC grants are
# additive. This Role adds only the verbs that ClusterRole doesn't carry:
# `create`/`delete` on Deployments (to stand up/tear down the canary
# Deployment and to delete the losing side on promote/rollback), and
# `get`/`update`/`patch` on the one `networking.istio.io` VirtualService
# object this demo reads/writes live (`autofde-lab-status`,
# k8s/canary.yaml) -- no `create`/`delete` on the VirtualService or
# DestinationRule themselves, since both are standing objects managed by
# `kubectl apply` of k8s/canary.yaml, never created/destroyed by the
# console at runtime.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-canary-autofde-lab
  namespace: autofde-lab
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["networking.istio.io"]
    resources: ["destinationrules"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-console-canary-autofde-lab-binding
  namespace: autofde-lab
subjects:
  - kind: ServiceAccount
    name: platform-console
    namespace: platform-console
roleRef:
  kind: Role
  name: platform-console-canary-autofde-lab
  apiGroup: rbac.authorization.k8s.io
---
# ------------------------------------------------------------ Container Exec
#
# Real hyperscaler-PaaS-style browser-based shell access (AWS Systems
# Manager Session Manager / GCP Cloud Shell / Azure Cloud Shell "run a
# command in a running instance/pod" equivalent), lib/container-exec.ts.
# One Role + RoleBinding per platform namespace -- the exact same 6
# namespaces (5 platform namespaces plus platform-console's own) as the
# Logs section above, same per-namespace-Role-not-ClusterRole reasoning:
# `pods/exec` is a DISTINCT, more sensitive subresource than `pods`/
# `pods/log` (k8s itself treats it separately -- a real container command
# execution channel, not a read), so it is never folded into the existing
# Logs Role and never granted cluster-wide.
#
# Two verbs, both real requirements, confirmed live against this cluster's
# actual v1.34 API server before this grant existed (same
# `kubectl auth can-i` / real-403-then-fixed discipline every other
# section of this file already documents):
#   - `create`: the conventional verb for the pods/exec subresource (what
#     `kubectl auth can-i create pods/exec` checks, and what a POST/SPDY-
#     style exec client uses).
#   - `get`: what this console's OWN WebSocket-based exec client actually
#     needs. lib/container-exec.ts opens the exec subresource via a plain
#     HTTP GET upgraded to a WebSocket (the same mechanism a browser's
#     `new WebSocket(...)` performs) rather than the POST+SPDY upgrade
#     `kubectl exec` traditionally used -- k8s's authorizer maps a GET
#     request's verb to "get", not "create", confirmed live: an identical
#     WebSocket exec request using this ServiceAccount's real token with
#     ONLY the conventional `create` verb granted came back with a real,
#     live `403` reading "cannot get resource \"pods/exec\"" (the API
#     server naming the verb it actually evaluated); adding `get` to this
#     Role, with no other change, made the exact same request succeed.
#     Both verbs are kept -- `create` because it's the documented/
#     conventional grant every k8s exec guide names, `get` because it's
#     the one this console's real WebSocket-upgrade client actually
#     exercises.
# No update/patch/delete/list/watch: this subresource has no meaningful
# list, and this console only ever opens a fresh one-shot exec session,
# never watches or mutates anything past it.

# --------------------------------------------------------- autofde-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-console-exec
  namespace: autofde-lab
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-console-exec-binding
  namespace: autofde-lab
subjects:
  - kind: ServiceAccount
    name: platform-console
    namespace: platform-console
roleRef:
  kind: Role
  name: platform-console-exec
  apiGroup: rbac.authorization.k8s.io


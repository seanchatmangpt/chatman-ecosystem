    owner: platform-console-team
    cost-center: platform-eng
    compliance-level: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ggen-status
  template:
    metadata:
      labels:
        app: ggen-status
    spec:
      serviceAccountName: ggen-status-reader
      containers:
        - name: ggen-status
          image: platform-console/ggen-status:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: state
              mountPath: /app/state
      volumes:
        # emptyDir, not a PVC: the /provision endpoint's platform-managed signing key
        # and per-run workspaces live here (see app.py's resolve_signing_key
        # docstring). Ephemeral by design for this pass -- a pod restart mints a
        # fresh signing key, so receipts signed before a restart can no longer be
        # verified against the new key. Backing this with a real PVC (or sourcing
        # GGEN_SIGNING_KEY from a k8s Secret instead) is the production fix and is
        # out of scope for this pass.
        - name: state
          emptyDir: {}

name: mdBook Pages

on:
  pull_request:
    paths:
      - book.toml
      - docs/**
      - .github/workflows/mdbook.yml
  push:
    branches: [main]
    paths:
      - book.toml
      - docs/**
      - .github/workflows/mdbook.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expand-chateco:
    name: Expand verified Chateco manuscript
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha }}
      ARCHIVE_SHA256: e90331785c29d0535ffad6f9e60167b671b148e609b0781fcb25f1fa36b144b4
    steps:
      - name: Checkout exact pull-request subject
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          printf 'exact_subject=%s\n' "$EXACT_SHA"

      - name: Expand content-addressed doctoral manuscript
        id: expand
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="docs/.chateco-phd-bootstrap"
          if [[ ! -d "$bootstrap" ]]; then
            echo "expanded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$GITHUB_HEAD_REF" = "agent/chateco-phd-book"
          cat "$bootstrap"/part-* | base64 --decode > /tmp/chateco-phd-source.tar.xz
          echo "$ARCHIVE_SHA256  /tmp/chateco-phd-source.tar.xz" | sha256sum --check -

          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          archive = "/tmp/chateco-phd-source.tar.xz"
          with tarfile.open(archive, "r:xz") as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit("REFUSED:EMPTY_BOOTSTRAP_ARCHIVE")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"REFUSED:UNSAFE_ARCHIVE_PATH:{member.name}")
                  if len(path.parts) < 2 or path.parts[:2] != ("docs", "chateco-phd"):
                      raise SystemExit(f"REFUSED:OUT_OF_SCOPE_ARCHIVE_PATH:{member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"REFUSED:ARCHIVE_LINK:{member.name}")
          PY

          tar -xJf /tmp/chateco-phd-source.tar.xz
          rm -rf "$bootstrap"
          echo "expanded=true" >> "$GITHUB_OUTPUT"

      - name: Verify manufactured manuscript before publication
        if: steps.expand.outputs.expanded == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/chateco-phd/verify.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path("docs/chateco-phd")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["chapter_count"] == 141
          assert manifest["appendix_count"] == 26
          assert manifest["summary_target_count"] == 172
          assert manifest["base_sha"] == "495cb16e91b2ac208043e19a432d3cc477ec77aa"
          assert manifest["source_corpus_sha256"] == "3a7cbe92378c0f645f4acfbf898b5145583b2b801835e7fa5b5f0c5b398378cf"

          markdown = list((root / "src").rglob("*.md"))
          if len(markdown) != 173:
              raise SystemExit(f"expected 173 source markdown files, got {len(markdown)}")
          bad = []
          for path in markdown:
              text = path.read_text(encoding="utf-8")
              if any(ord(ch) < 32 and ch not in "\n\r\t" for ch in text):
                  bad.append(str(path))
              if re.search(r"\b(?:TODO|TBD)\b", text):
                  bad.append(str(path))
          if bad:
              raise SystemExit(f"REFUSED:MANUSCRIPT_HYGIENE:{bad[:10]}")
          print("manuscript_hygiene=PASS")
          PY

      - name: Install verified mdBook 0.5.4
        if: steps.expand.outputs.expanded == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="0.5.4"
          archive="mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rust-lang/mdBook/releases/download/v${version}/${archive}" \
            --output "${archive}"
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  ${archive}" | sha256sum --check -
          tar -xzf "${archive}"
          install -d "$HOME/.local/bin"
          install -m 0755 mdbook "$HOME/.local/bin/mdbook"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mdbook" --version

      - name: Build and inspect doctoral manuscript before publication
        if: steps.expand.outputs.expanded == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mdbook build docs/chateco-phd
          root="docs/chateco-phd/book"
          test -s "$root/index.html"
          test -s "$root/chapters/001-the-industrialization-of-knowledge-work.html"
          test -s "$root/chapters/028-zero-unreceipted-actuation.html"
          test -s "$root/chapters/141-final-receipt.html"
          test -s "$root/appendices/z-machine-readable-thesis-manifest.html"
          find "$root" -type f -name 'searchindex*.js' -size +0c -print -quit | grep -q .
          grep -q "The Chateco Research Program" "$root/index.html"
          grep -q "Zero Unreceipted Actuation" "$root/chapters/028-zero-unreceipted-actuation.html"

      - name: Publish expanded Markdown source to the PR branch
        if: steps.expand.outputs.expanded == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/chateco-phd/book
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/chateco-phd docs/.chateco-phd-bootstrap
          test -n "$(git diff --cached --name-only)"
          git commit -m "docs: expand full Chateco PhD book"
          published="$(git rev-parse HEAD)"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          printf 'published_subject=%s\n' "$published"

  build:
    name: Build canonical mdBook
    runs-on: ubuntu-latest
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_SHA }}

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXACT_SHA"
          printf 'exact_subject=%s\n' "$actual"

      - name: Install verified mdBook 0.5.4
        shell: bash
        run: |
          set -euo pipefail
          version="0.5.4"
          archive="mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rust-lang/mdBook/releases/download/v${version}/${archive}" \
            --output "${archive}"
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  ${archive}" | sha256sum --check -
          tar -xzf "${archive}"
          install -d "$HOME/.local/bin"
          install -m 0755 mdbook "$HOME/.local/bin/mdbook"
          "$HOME/.local/bin/mdbook" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify book graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          LINK_RE = re.compile(r"\[[^\]]+\]\(([^)]+\.md)\)")

          def local_targets(summary_path: Path):
              summary = summary_path.read_text(encoding="utf-8")
              return [
                  target
                  for target in LINK_RE.findall(summary)
                  if not target.startswith(("http://", "https://"))
              ]

          def verify_targets(base_dir: Path, summary_path: Path):
              targets = local_targets(summary_path)
              missing = [target for target in targets if not (base_dir / target).exists()]
              if missing:
                  raise SystemExit(
                      f"{summary_path} contains missing targets: {missing}"
                  )
              return targets

          docs = Path("docs")
          root_summary = docs / "SUMMARY.md"
          root_targets = verify_targets(docs, root_summary)

          numbered_paths = sorted(
              path.name
              for path in docs.glob("[0-9][0-9]-*.md")
              if path.name[:2] != "00"
          )
          summary_numbered = [
              target
              for target in root_targets
              if "/" not in target
              and re.match(r"^\d{2}-.*\.md$", target)
              and target[:2] != "00"
          ]
          counts = Counter(summary_numbered)
          duplicates = sorted(name for name, count in counts.items() if count != 1)
          if duplicates:
              raise SystemExit(
                  f"root SUMMARY contains duplicate numbered chapters: {duplicates}"
              )
          if sorted(summary_numbered) != numbered_paths:
              missing_from_summary = sorted(set(numbered_paths) - set(summary_numbered))
              extra_in_summary = sorted(set(summary_numbered) - set(numbered_paths))
              raise SystemExit(
                  "root numbered corpus and SUMMARY diverge: "
                  f"missing={missing_from_summary}, extra={extra_in_summary}"
              )

          handbook = docs / "post-agi-platform-handbook"
          handbook_summary = handbook / "SUMMARY.md"
          handbook_targets = verify_targets(handbook, handbook_summary)

          root_handbook_targets = {
              target.removeprefix("post-agi-platform-handbook/")
              for target in root_targets
              if target.startswith("post-agi-platform-handbook/")
          }
          omitted = sorted(set(handbook_targets) - root_handbook_targets)
          if omitted:
              raise SystemExit(
                  f"root SUMMARY omits handbook targets: {omitted}"
              )

          print(
              f"validated {len(root_targets)} root SUMMARY targets, "
              f"{len(numbered_paths)} numbered root chapters, and "
              f"{len(handbook_targets)} handbook targets"
          )
          PY

      - name: Build book
        run: mdbook build

      - name: Verify rendered crown
        shell: bash
        run: |
          set -euo pipefail
          test -s book/index.html
          test -s book/00-reading-map.html
          test -s book/01-constitutional-thesis.html
          test -s book/50-civilization-scale-synthesis.html
          test -s book/60-ecosystem-synthesis.html
          test -s book/70-dissertation-synthesis.html
          test -s book/80-post-operator-factory.html
          test -s book/post-agi-platform-handbook/working-backwards.html
          test -s book/post-agi-platform-handbook/part-16-complete-calculus/65-reality-runtime.html
          test -s book/post-agi-platform-handbook/appendices/p-civilization-memory-algebra.html
          find book -type f -name 'searchindex*.js' -size +0c -print -quit | grep -q .
          grep -q "The Chatman Ecosystem" book/index.html
          grep -q "Current operational snapshot" book/index.html
          grep -q "Documentation Inventory" book/index.html
          grep -q "Reality as the Runtime" book/post-agi-platform-handbook/part-16-complete-calculus/65-reality-runtime.html

      - name: Verify standalone Chateco doctoral book
        if: hashFiles('docs/chateco-phd/manifest.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/chateco-phd/verify.py
          mdbook build docs/chateco-phd
          root="docs/chateco-phd/book"
          test -s "$root/index.html"
          test -s "$root/chapters/001-the-industrialization-of-knowledge-work.html"
          test -s "$root/chapters/028-zero-unreceipted-actuation.html"
          test -s "$root/chapters/141-final-receipt.html"
          test -s "$root/appendices/z-machine-readable-thesis-manifest.html"
          find "$root" -type f -name 'searchindex*.js' -size +0c -print -quit | grep -q .
          grep -q "The Chateco Research Program" "$root/index.html"
          grep -q "Zero Unreceipted Actuation" "$root/chapters/028-zero-unreceipted-actuation.html"
          printf 'chateco_exact_subject=%s\n' "$(git rev-parse HEAD)"

      - name: Preserve rendered book
        uses: actions/upload-artifact@v7
        with:
          name: chatman-ecosystem-mdbook
          path: book
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download exact rendered subject
        uses: actions/download-artifact@v8
        with:
          name: chatman-ecosystem-mdbook
          path: book

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

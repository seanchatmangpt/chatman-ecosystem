name: Agent dependency upgrade lock refresh

on:
  push:
    branches:
      - agent/upgrade-dependencies-20260816
    paths:
      - '.github/workflows/agent-upgrade-lock.yml'
      - 'Cargo.toml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/upgrade-dependencies-20260816
          persist-credentials: true
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
      - name: Refresh lock
        run: |
          cargo generate-lockfile
          git diff --check -- Cargo.lock
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git config user.name 'chatman-ecosystem-bot'
          git config user.email '136349053+seanchatmangpt@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore(deps): refresh lock for major upgrades'
          git push origin HEAD:agent/upgrade-dependencies-20260816

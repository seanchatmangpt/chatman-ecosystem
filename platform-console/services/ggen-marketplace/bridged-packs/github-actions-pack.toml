[pack]
id = "github-actions-pack"
name = "github-actions-pack"
version = "0.2.3"
description = """v0.2.3: added gates/030_push_trigger_required.rq and gha:noPushTriggerReason, closing a real gap a same-day 34-repo ecosystem health audit found: gate 010/020 admit a gha:Workflow with correct permissions/security facts even if it structurally can never run on push, which is exactly the shape 4 real repos (rrgym, lifegym, biblegym, claudecodegym) had -- real, green, currently-passing CI, but only ever exercised on a working branch, never the repository's own default branch (`branch=main` returned zero runs for all four in that audit). This gate cannot see live run history (out of scope for a static ontology gate -- see autofde-lab's authority/ecosystem-reconstitution/check_head_drift.py for that half), but it does close the authoring-time half: a gha:Workflow declared with neither gha:trigger gha:EventPush nor a stated gha:noPushTriggerReason is now refused at ggen sync time, before any real run needs to happen to discover the gap. New real fixtures in qualification/consumer.ttl prove both admitted cases (a real push trigger; a stated exemption for a manual-dispatch-only release gate) qualify cleanly; the refused case (neither) was verified for real during development (a real `ggen sync run` refusal citing FM-PACK-013 and the exact subject) but is not shipped as a permanent fixture, since a pack's qualification data should demonstrate what's admitted, not carry a permanently-failing individual. See docs/reference/ci-standing-policy.md for the full policy this gate is one half of. v0.2.2: converted both templates (workflow.yml.tmpl, composite_action.yml.tmpl) from the [[generation.rules]] File-sourced no-frontmatter form to the marketplace's own canonical self-contained to:/sparql:/for_each: format. Found via ggen-marketplace's own qualify tooling, not assumed: both templates failed [FM-TPL-001] (missing required frontmatter) the first time this pack's own qualify gate ever actually ran against them, because sync.rs's native pack-template discovery (used by qualify_packs.py's `[packs]`-wired consumer, and by every other real pack in this marketplace) requires every template to carry frontmatter -- the [[generation.rules]] File-sourced path these two templates previously relied on bypasses that requirement entirely (raw file read, no Template::parse), which is why it went undetected through two real consumer validations (ggen, wasm4pm) before the marketplace's own qualify check finally exercised it. Reverified end-to-end after conversion: `qualify_pack()` now returns status=ALIVE (previously REFUSED); a real render against ggen's own correctly-pinned facts still produces the same semantically-equivalent output already validated pre-conversion (same triggers/env/jobs/steps, confirmed via yaml.safe_load); both gates still fire correctly (0 rows on ggen's real facts, 4 rows on wasm4pm's real unpinned-action-ref facts, matching the v0.2.1 finding exactly). Consumers (ggen, wasm4pm) must re-vendor and drop their now-unnecessary [[generation.rules]] workaround rule in the same pass -- the old File-sourced raw-text-read path would otherwise leak the new frontmatter block into rendered output as literal text, corrupting the YAML (confirmed empirically: a leaked leading "---\n---\n" pair breaks yaml.safe_load with "expected a single document in the stream"). v0.2.1: fixed a real bug the second real consumer (wasm4pm) exposed in gate 020_security.rq's third-party-action-pinning branch — it required the SUBJECT's own IRI to start with this pack's namespace, a leftover from when the pack shipped its own individuals under that namespace. Since v0.2.0 the pack ships zero individuals (every real gha:Step is consumer-minted under the CONSUMER's own namespace), so that constraint meant the branch could structurally never fire against any real consumer's data — confirmed empirically: wasm4pm's 4 real unpinned action refs (actions/checkout@v4, dtolnay/rust-toolchain@master, actions/setup-node@v4, actions/upload-artifact@v4) produced zero gate rows until this fix. Removed the subject-IRI constraint (the gate already composes correctly via its gha:-prefixed PREDICATE matching, which is namespace-exact on its own); reverified zero regression against ggen's real, correctly-pinned facts (still 0 rows) and correct firing against wasm4pm's real unpinned facts (4 rows, one per ref). v0.2.0: TCPS production-process pack for GitHub Actions (生産設備と工程標準), rebuilt from first principles as a schema-only, project-agnostic pack: ontology.ttl carries ZERO gha:Workflow/gha:Job/gha:Step/gha:CompositeAction individuals (dspy-pack's proven contract — 'ontology.ttl ships zero individuals; a consumer project supplies its own individuals against this vocabulary in its own .ttl'). Prior revision (0.1.0) fused this schema with one project's (ggen's own) 21 gha:Wf*/7 gha:Job* as-built individuals, and its 4 templates only echoed a hardcoded gha:artifactBody YAML string literal per workflow -- not reusable by any other repo, and admitted as much at gha:L5C16: '複数リポジトリへ適用できる (applicable to multiple repos)... 未実施 (not yet done) -- single-repo model only.' This revision closes both gaps: (1) all project-specific individuals removed, ontology is pure vocabulary now; (2) a genuine gha:Step layer added (gha:inJob/gha:stepOrder/gha:usesAction/gha:runCommand/gha:withParam/gha:envVar/gha:continueOnError -- the layer the prior revision never modeled at all, without which nothing distinguishes one project's `cargo test` from another's `pnpm build`), and templates/workflow.yml.tmpl + templates/composite_action.yml.tmpl render REAL structured on:/permissions:/jobs:/steps: YAML from those typed facts via per-row SPARQL + Tera filter(attribute=,value=), not a blob echo. Each consumer wires this pack via its own ggen.toml (or ggen-engine's [ontology].imports + [[generation.rules]] convention, per project) and authors its own gha:Workflow/gha:Job/gha:Step facts in its own repo. Retains the 4-layer model (Event/Workflow/Job+Step/Production-output) and both real SPARQL refusal gates (010_required.rq, 020_security.rq — write-all, unspecified permissions, unnecessary contents:write, unbounded pull_request_target, unpinned third-party action refs, undeclared secret reasons); 010 gained a Step-required-facts branch, and 020's gha:usesAction branch is live for the first time (previously dead -- no individual ever populated that property). Two of the prior revision's four templates (reusable-rust-inspection workflow/caller, emit-evidence composite action) were inspection-workflow specifics with no generic value and are retired, not ported, in this pass -- named here, not silently dropped. First real consumer validated against: ggen's own .github/workflows/ci.yml, diffed for semantic equivalence against the real committed file, not assumed."""
category = "marketplace"
packages = []

[pack.metadata]
bridged_from = "~/ggen-marketplace/packs/github-actions-pack"
has_ontology_ttl = true

name: MEASURE Process Intelligence Convergence MSA
on:
  pull_request:
    paths:
      - 'scripts/measure_train/process_intelligence_convergence_msa/**'
      - 'tests/measure_train/process_intelligence_convergence_msa/**'
      - '.github/workflows/measure-process-intelligence-convergence.yml'
permissions:
  contents: read
jobs:
  exact-head-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile convergence MSA
        run: PYTHONPATH=. python3 -m py_compile scripts/measure_train/process_intelligence_convergence_msa/*.py tests/measure_train/process_intelligence_convergence_msa/*.py
      - name: Execute convergence MSA court
        run: PYTHONPATH=. python3 -m unittest discover -s tests/measure_train/process_intelligence_convergence_msa -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: "! grep -REn 'requests\\.(post|put|patch|delete)|urllib\\.request\\.(Request|urlopen)|subprocess\\.|os\\.system|boto3|azure\\.|google\\.cloud' scripts/measure_train/process_intelligence_convergence_msa"

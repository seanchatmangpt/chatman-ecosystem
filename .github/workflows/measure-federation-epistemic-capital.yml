name: MEASURE Federation Epistemic Capital MSA

on:
  pull_request:
    paths:
      - scripts/measure_train/federation_epistemic_capital_msa/**
      - tests/measure_train/federation_epistemic_capital_msa/**
      - .github/workflows/measure-federation-epistemic-capital.yml

permissions:
  contents: read

jobs:
  measure-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR subject
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile federation epistemic capital MSA
        run: python3 -m py_compile scripts/measure_train/federation_epistemic_capital_msa/*.py tests/measure_train/federation_epistemic_capital_msa/*.py
      - name: Run permanent falsifier and Chicago court
        run: PYTHONPATH=. python3 -m unittest discover -s tests/measure_train/federation_epistemic_capital_msa -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|urllib\.request\.(Request|urlopen)|subprocess\.|os\.system|boto3|azure\.|google\.cloud|socket\.' scripts/measure_train/federation_epistemic_capital_msa tests/measure_train/federation_epistemic_capital_msa

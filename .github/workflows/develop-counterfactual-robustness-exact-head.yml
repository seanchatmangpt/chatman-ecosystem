name: DEVELOP Counterfactual Robustness Exact Head
on:
  pull_request:
    paths:
      - 'scripts/develop_train/counterfactual_policy_robustness/**'
      - 'tests/develop_train/counterfactual_policy_robustness/**'
      - '.github/workflows/develop-counterfactual-robustness-exact-head.yml'
permissions:
  contents: read
jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python3 -m compileall -q scripts/develop_train/counterfactual_policy_robustness tests/develop_train/counterfactual_policy_robustness
      - name: Permanent and Chicago courts
        run: PYTHONPATH=. python3 -m unittest discover -s tests/develop_train/counterfactual_policy_robustness -p 'test_*.py' -v
      - name: Reject ambient consequential actuation imports
        run: |
          ! grep -R -E '(^|[[:space:]])(import|from)[[:space:]]+(requests|httpx|boto3|azure|google\.cloud|socket|subprocess)' scripts/develop_train/counterfactual_policy_robustness tests/develop_train/counterfactual_policy_robustness

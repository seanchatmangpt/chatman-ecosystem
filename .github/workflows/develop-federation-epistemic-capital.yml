name: DEVELOP Federation Epistemic Capital Exact Head

on:
  pull_request:
    paths:
      - 'scripts/develop_train/federation_epistemic_capital_control/**'
      - 'tests/develop_train/federation_epistemic_capital_control/**'
      - '.github/workflows/develop-federation-epistemic-capital.yml'

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Compile additive substrate
        run: python3 -m compileall -q scripts/develop_train/federation_epistemic_capital_control tests/develop_train/federation_epistemic_capital_control
      - name: Run permanent and Chicago courts
        env:
          PYTHONPATH: .
        run: python3 -m unittest discover -s tests/develop_train/federation_epistemic_capital_control -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn '^\s*(import|from)\s+(requests|httpx|boto3|azure|google\.cloud|socket|subprocess)|requests\.(post|put|patch|delete)|subprocess\.|os\.system' scripts/develop_train/federation_epistemic_capital_control tests/develop_train/federation_epistemic_capital_control

[pack]
name = "nonllm-class-qualification-pack"
version = "0.1.0"
description = "DfLSS qualification law and projections for non-LLM work classes: the nlb: vocabulary (benchmark classes with observed membership tests and independent verifiers, near-miss and negative-control cases, CTQs, RTY stages, MSA properties and courts, fractional-factorial factors with typed support, evidence tiers and exact Clopper-Pearson bound rows, class standing tuples, the two standings BENCHMARK_DESIGN_ALIVE and NON_LLM_OPERATIONAL_ALIVE with an explicit non-implication), SPARQL gates and SHACL shapes over that law, a plan CONSTRUCT that generates one tuple-complete semantic-jira work order per class x benchmark family x next tier, per MSA court and per capability gap, and generated projections (class catalog, CTQ tracker, MSA contract, acceptance rules, DOE design and CI matrices, case manifests, qualification report, SPC chart skeleton). Statistics are computed by one kernel (scripts/evidence_tiers.py) and rendered, never re-derived in templates. In-repo home for Chatman Ecosystem v26.9.23 (release/v26.9.23/bench/pack); successor home ggen-marketplace/packs/nonllm-class-qualification-pack."

name: Documentation Vacuity

on:
  pull_request:
    paths:
      - "docs/**"
      - "books/**"
      - "scripts/audit_doc_vacuity.py"
      - "scripts/enrich_published_pages.py"
      - ".github/workflows/docs-vacuity.yml"
  push:
    branches:
      - "agent/finish-vacuous-pages-20260819"
    paths:
      - "scripts/audit_doc_vacuity.py"
      - "scripts/enrich_published_pages.py"
      - ".github/workflows/docs-vacuity.yml"

permissions:
  contents: write

concurrency:
  group: docs-vacuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0

      - name: Verify exact subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          printf 'exact_subject=%s\n' "$EXACT_SHA"

      - name: Manufacture substantive pages on branch push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/enrich_published_pages.py --write

      - name: Verify zero vacuous published pages
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_doc_vacuity.py --json /tmp/doc-vacuity.json

      - name: Persist manufactured canonical documentation
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$(git status --porcelain -- docs books)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- docs books
            git commit -m "docs: enrich every published vacuous page"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Preserve machine-readable vacuity receipt
        uses: actions/upload-artifact@v7
        with:
          name: documentation-vacuity-receipt
          path: /tmp/doc-vacuity.json
          if-no-files-found: error
          retention-days: 7

name: DEVELOP Decision Outcome Evidence Exact Head

on:
  pull_request:
    paths:
      - "scripts/develop_train/decision_outcome_evidence_capital/**"
      - "tests/develop_train/decision_outcome_evidence_capital/**"
      - ".github/workflows/develop-decision-outcome-evidence-capital-exact-head.yml"

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile production and courts
        run: python3 -m compileall -q scripts/develop_train/decision_outcome_evidence_capital tests/develop_train/decision_outcome_evidence_capital
      - name: Execute permanent and Chicago courts
        env:
          PYTHONPATH: .
        run: python3 -m unittest discover -s tests/develop_train/decision_outcome_evidence_capital -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation imports
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn '^\s*(import|from)\s+(requests|httpx|boto3|azure|google\.cloud|socket|subprocess)|requests\.(post|put|patch|delete)|subprocess\.|os\.system' scripts/develop_train/decision_outcome_evidence_capital tests/develop_train/decision_outcome_evidence_capital; then
            echo 'ambient consequential-actuation surface detected' >&2
            exit 1
          fi
